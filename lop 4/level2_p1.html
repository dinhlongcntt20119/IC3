<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lớp 4 - Level 2 | Kiến Thức Nền Tảng - Phần 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Kanit:ital,wght@1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            /* TÔNG MÀU CAM LEVEL 2 */
            --primary-color: #ef6c00; /* Orange */
            --primary-dark: #e65100;  /* Darker Orange */
            --accent-color: #ff9800;  /* Lighter Orange */
            --bg-body: #fff8e1;       /* Cream background */
            --text-color: #3e2723;    /* Dark brown text */
            --border-color: #ffe0b2;
            
            --correct-bg: #d4edda;
            --correct-border: #28a745;
            --wrong-bg: #f8d7da;
            --wrong-border: #dc3545;
        }

        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-body); color: var(--text-color); margin: 0; padding: 0; }
        
        /* HEADER */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 1000; border-bottom: 4px solid #fff;
        }
        .header-left { display: flex; flex-direction: column; align-items: flex-start; }
        .logo-ic3 { font-family: 'Kanit', sans-serif; font-size: 2rem; font-weight: 800; font-style: italic; line-height: 1; }
        .logo-ic3 span:nth-child(1) { color: #fff; } 
        .logo-ic3 span:nth-child(2) { color: #ffe0b2; } /* Light orange text */
        
        .home-btn {
            margin-top: 8px; color: white; text-decoration: none; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.6);
            padding: 5px 15px; border-radius: 20px; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px;
        }
        .home-btn:hover { background: rgba(255,255,255,0.2); }
        .header-right { text-align: right; }
        .teacher-name { font-weight: 700; font-size: 1.1rem; display: block; }
        .sub-title { font-size: 0.9rem; opacity: 0.9; }

        /* CONTAINER */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        .page-title { text-align: center; margin-bottom: 40px; }
        .page-title h1 { color: var(--primary-dark); margin: 0; font-size: 2.2rem; text-transform: uppercase; font-weight: 800; }
        .page-title h2 { color: #5d4037; margin: 10px 0 0; font-size: 1.4rem; font-weight: bold; text-transform: uppercase; }

        /* QUESTION CARD */
        .question-card {
            background: white; border: 1px solid var(--border-color); border-radius: 12px; 
            margin-bottom: 30px; overflow: hidden; display: flex; flex-wrap: wrap;
            box-shadow: 0 4px 12px rgba(230, 81, 0, 0.08); /* Orange tinted shadow */
        }
        .question-card.incomplete { border: 2px solid var(--wrong-border); box-shadow: 0 0 10px rgba(220, 53, 69, 0.2); }

        .topic-col {
            background-color: var(--primary-dark); width: 140px; padding: 20px;
            display: flex; align-items: center; justify-content: center; text-align: center;
            font-weight: 700; color: white; flex-shrink: 0; font-size: 1rem; border-right: 1px solid #fff;
        }
        .content-col { flex-grow: 1; padding: 25px; width: calc(100% - 140px); background: #fff; }

        .question-text { font-weight: 700; font-size: 1.1rem; margin-bottom: 20px; color: var(--primary-dark); }

        /* OPTIONS */
        .options label {
            display: block; margin-bottom: 10px; cursor: pointer; padding: 12px 15px;
            border: 2px solid #fff3e0; border-radius: 8px; transition: 0.2s; position: relative;
        }
        .options label:hover { background-color: #fff3e0; border-color: var(--primary-color); }
        .options input { margin-right: 12px; transform: scale(1.3); vertical-align: middle; accent-color: var(--primary-color); }

        /* SINGLE IMAGE */
        .single-img { display: block; max-width: 100%; max-height: 400px; margin: 0 auto 20px auto; border-radius: 8px; border: 1px solid #ddd; }

        /* TABLES */
        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 15px; }
        .data-table { width: 100%; border-collapse: collapse; margin: 0; }
        .data-table th {
            background-color: var(--primary-color); color: white; padding: 15px; 
            text-align: center; font-weight: 700; border-bottom: 2px solid #fff;
        }
        .data-table td { border-bottom: 1px solid var(--border-color); padding: 15px; vertical-align: middle; }
        .data-table tr:nth-child(even) { background-color: #fff8e1; } /* Light cream for rows */
        .data-table tr:last-child td { border-bottom: none; }
        
        .data-table td:first-child { width: 65%; font-weight: 500; font-family: 'Times New Roman', serif; color: #000; }
        .data-table td:not(:first-child) { width: 35%; text-align: center; }

        .data-table select {
            width: 100%; padding: 10px; border: 1px solid #ffcc80; border-radius: 5px; 
            background: white; font-size: 0.95rem; cursor: pointer;
        }
        .data-table select:focus { outline: none; border-color: var(--primary-dark); }
        .data-table input[type="radio"] { transform: scale(1.5); cursor: pointer; accent-color: var(--primary-color); }

        /* FEEDBACK */
        .feedback { 
            margin-top: 20px; padding: 15px; background-color: #fff3cd; 
            border-left: 5px solid #ffc107; border-radius: 4px; 
            font-size: 0.95rem; color: #856404; display: none; line-height: 1.5;
        }
        .correct-opt { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; }
        .wrong-opt { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; }
        
        .correction { 
            display: block; margin-top: 8px; font-size: 0.9rem; font-weight: bold; 
            color: var(--wrong-border); background: rgba(255,255,255,0.9); padding: 5px; border-radius: 4px; border: 1px dashed var(--wrong-border);
        }

        .btn-submit {
            display: block; width: 250px; margin: 40px auto; padding: 18px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white; border: none; border-radius: 50px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(230, 81, 0, 0.4); transition: 0.3s;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(230, 81, 0, 0.6); }

        #result-area {
            text-align: center; font-size: 1.6rem; font-weight: bold; margin-top: 30px;
            padding: 30px; display: none; background: white; border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 2px solid var(--primary-color);
        }

        footer { background: var(--primary-dark); color: white; padding: 40px 20px; text-align: center; margin-top: 80px; }
        .footer-info { margin-top: 15px; font-size: 0.95rem; opacity: 0.9; }

        @media (max-width: 768px) {
            .question-card { flex-direction: column; }
            .topic-col { width: 100%; padding: 10px; justify-content: flex-start; border-right: none; border-bottom: 4px solid #ffcc80; }
            .content-col { width: 100%; padding: 15px; }
            .data-table td:first-child { width: 50%; }
            .data-table td:not(:first-child) { width: 25%; }
        }
    </style>
</head>

<script>
    const questions = [
        { id: 1, type: "radio", q: "Hệ điều hành (OS) là gì?", opts: [{v: "a", t: "Khu vực làm việc của màn hình máy tính"}, {v: "b", t: "Một cái gì đó đi vào máy tính"}, {v: "c", t: "Phần mềm hỗ trợ các chức năng cơ bản của máy tính"}, {v: "d", t: "Thiết bị vật lý lưu trữ thông tin cho hệ điều hành, phần mềm và phần cứng"}], ans: "c", explain: "Hệ điều hành (Operating System - OS) là một phần mềm quản lý và điều khiển tất cả các hoạt động của máy tính." },
        { id: 2, type: "radio", q: "Thiết bị nào trong số này là thiết bị nhập (Input Device)?", opts: [{v: "a", t: "Keyboard (Bàn phím)"}, {v: "b", t: "Speakers (Loa)"}, {v: "c", t: "Printer (Máy in)"}, {v: "d", t: "Monitor (Màn hình)"}], ans: "a", explain: "Keyboard: Thiết bị đầu vào sử dụng để nhập dữ liệu vào máy tính." },
        { id: 3, type: "radio", q: "Tùy chọn nào dưới đây có thể được sử dụng để truyền dữ liệu không dây giữa 2 thiết bị gần nhau?", opts: [{v: "a", t: "Ethernet"}, {v: "b", t: "Firewall"}, {v: "c", t: "Modem"}, {v: "d", t: "Bluetooth"}], ans: "d", explain: "Bluetooth: Một công nghệ truyền thông sử dụng kết nối không dây tầm ngắn." },
        { id: 4, type: "radio", q: "Nỗ lực khai thác hệ thống máy tính hoặc mạng riêng bên trong máy tính được gọi là gì?", opts: [{v: "a", t: "Bystander"}, {v: "b", t: "Công dân kỷ nguyên số"}, {v: "c", t: "Dấu chân kỹ thuật số"}, {v: "d", t: "Hacking"}], ans: "d", explain: "Hacking: Truy cập trái phép vào hệ thống máy tính." },
        { id: 5, type: "radio", q: "Phản ứng thích hợp nếu bạn bị bắt nạt trên mạng (Cyberbullying) là gì?", opts: [{v: "a", t: "Làm gì đó để trả thù"}, {v: "b", t: "Dừng lại, tạm thời, nói chuyện với người lớn"}, {v: "c", t: "Bỏ qua nó và không làm gì cả"}, {v: "d", t: "Ngừng sử dụng máy tính"}], ans: "b", explain: "Hãy dừng lại và nói chuyện với người lớn để giúp giải quyết vấn đề." },
        { id: 6, type: "radio", q: "Điều gì KHÔNG phải là một phần của dấu chân kỹ thuật số (Footprint) của bạn?", opts: [{v: "a", t: "Đăng ký nhận bản tin email"}, {v: "b", t: "Bài đăng trên mạng xã hội"}, {v: "c", t: "Nhạc được lưu trên ổ cứng máy tính"}, {v: "d", t: "Mua hàng trực tuyến"}], ans: "c", explain: "Nhạc lưu cục bộ không phải là dấu chân số công khai." },
        { id: 7, type: "radio", q: "Một ví dụ về việc sử dụng công nghệ kỹ thuật số một cách thích hợp trong trường học là gì?", opts: [{v: "a", t: "Bí mật ghi lại âm thanh"}, {v: "b", t: "Hợp tác với các bạn cùng lớp trong một bài tập nhóm"}, {v: "c", t: "Chơi game"}, {v: "d", t: "Quay video các bạn cùng lớp"}], ans: "b", explain: "Cộng tác trực tuyến là cách sử dụng phù hợp." },
        { id: 8, type: "radio", q: "Nó được gọi là gì khi bạn buộc một trình duyệt truy xuất một trang web từ máy chủ thay vì tải nó từ bộ đệm?", opts: [{v: "a", t: "Tải lại (Reloading)"}, {v: "b", t: "Điều hướng"}, {v: "c", t: "Đánh dấu trang"}, {v: "d", t: "Gửi biểu mẫu"}], ans: "a", explain: "Tải lại (Reload) giúp cập nhật nội dung mới nhất từ máy chủ." },
        { id: 9, type: "radio", q: "Cách nhanh nhất để quay lại một trang web sau đó là gì?", opts: [{v: "a", t: "Nói với bạn bè"}, {v: "b", t: "In trang web"}, {v: "c", t: "Viết URL"}, {v: "d", t: "Tạo dấu trang (Bookmark)"}], ans: "d", explain: "Tạo dấu trang (Bookmark) giúp truy cập lại nhanh chóng." },
        { id: 10, type: "radio", q: "Tùy chọn nào dưới đây là một ví dụ về giải trí?", opts: [{v: "a", t: "Gửi email"}, {v: "b", t: "Bảng tính"}, {v: "c", t: "Truyền trực tuyến (Streaming) một chương trình"}, {v: "d", t: "Từ điển trực tuyến"}], ans: "c", explain: "Streaming video/nhạc là hình thức giải trí." },
        { id: 11, type: "radio", q: "Địa chỉ của một trang web được gọi là gì?", opts: [{v: "a", t: "URL"}, {v: "b", t: "Tiêu đề trang"}, {v: "c", t: "Nhà xuất bản"}, {v: "d", t: "Tác giả"}], ans: "a", explain: "URL là địa chỉ định danh của trang web." },
        { id: 12, type: "radio", q: "Bạn cần thông tin cho trường học, nhưng tìm kiếm ban đầu không hữu ích. Bạn nên thử gì tiếp theo?", opts: [{v: "a", t: "Nhấp vào quảng cáo"}, {v: "b", t: "Tinh chỉnh tìm kiếm của bạn"}, {v: "c", t: "Gửi email giáo viên"}, {v: "d", t: "Từ bỏ"}], ans: "b", explain: "Tinh chỉnh từ khóa tìm kiếm để có kết quả tốt hơn." },
        { id: 13, type: "radio", q: "Khi bạn thấy \"quảng cáo\" bên cạnh liên kết tìm kiếm, điều đó có nghĩa là gì?", opts: [{v: "a", t: "Đây là mục được tài trợ đã trả tiền"}, {v: "b", t: "Tìm kiếm không đủ kết quả"}, {v: "c", t: "Máy tính nhiễm virus"}, {v: "d", t: "Sẽ mất tiền nếu nhấp vào"}], ans: "a", explain: "Đó là kết quả trả phí (Sponsored/Ad)." },
        { id: 14, type: "radio", q: "Khi bạn sử dụng từ đồng nghĩa để tìm kiếm, bạn đang làm gì?", opts: [{v: "a", t: "Làm rộng phạm vi"}, {v: "b", t: "Giới hạn kết quả"}, {v: "c", t: "Sử dụng từ tương tự để tinh chỉnh kết quả"}, {v: "d", t: "Bỏ qua quảng cáo"}], ans: "c", explain: "Dùng từ đồng nghĩa giúp tìm được các nội dung liên quan sát nghĩa hơn." },
        { id: 15, type: "radio", q: "Các từ hoặc cụm từ ngắn ở đầu trang trình chiếu kỹ thuật số là gì?", opts: [{v: "a", t: "Tiêu đề (Heading)"}, {v: "b", t: "Tác giả"}, {v: "c", t: "URL"}, {v: "d", t: "Nhà xuất bản"}], ans: "a", explain: "Tiêu đề (Heading) tóm tắt nội dung slide." },
        { id: 16, type: "radio", q: "Ứng dụng nào dùng để hiển thị hình ảnh, văn bản, video cho khán giả?", opts: [{v: "a", t: "Nhắn tin"}, {v: "b", t: "Bảng tính"}, {v: "c", t: "Trình chiếu (Slideshow application)"}, {v: "d", t: "Email"}], ans: "c", explain: "Phần mềm trình chiếu (như PowerPoint) dùng cho việc này." },
        { id: 17, type: "radio", q: "Việc sử dụng thích hợp của một danh sách được đánh số là gì?", opts: [{v: "a", t: "Thêm hình ảnh"}, {v: "b", t: "Viết thư"}, {v: "c", t: "Gửi tin nhắn"}, {v: "d", t: "Liệt kê các mục theo thứ tự hoặc trình tự thời gian"}], ans: "d", explain: "Danh sách số dùng cho các bước hoặc quy trình có thứ tự." },
        { id: 18, type: "radio", q: "Tùy chọn nào là nghi thức trực tuyến KHÔNG phù hợp?", opts: [{v: "a", t: "Giải quyết xung đột ngoại tuyến"}, {v: "b", t: "Tôn trọng riêng tư"}, {v: "c", t: "Viết email sử dụng tất cả các chữ hoa"}, {v: "d", t: "Đối xử tốt với người khác"}], ans: "c", explain: "Viết hoa toàn bộ (ALL CAPS) được coi là la hét." },
        { id: 19, type: "radio", q: "Bạn đọc tin tức trực tuyến làm bạn khó chịu. Bạn nên làm gì?", opts: [{v: "a", t: "Tạm ngừng, hít thở và suy nghĩ trước khi hành động"}, {v: "b", t: "Ngừng đọc tin tức"}, {v: "c", t: "Viết email tức giận"}, {v: "d", t: "Nói tin tức là giả"}], ans: "a", explain: "Giữ bình tĩnh và suy nghĩ thấu đáo trước khi phản ứng." },
        { id: 20, type: "radio", q: "Việc chia sẻ công việc với các bạn cùng lớp để nhận phản hồi được gọi là gì?", opts: [{v: "a", t: "Trách nhiệm"}, {v: "b", t: "Xuất bản"}, {v: "c", t: "Vai trò"}, {v: "d", t: "Đánh giá ngang hàng (Peer review)"}], ans: "d", explain: "Đánh giá ngang hàng giúp cải thiện chất lượng công việc." },
        { id: 21, type: "radio", q: "Yếu tố nào KHÔNG phải là yếu tố hợp tác thành công?", opts: [{v: "a", t: "Đặt mục tiêu rõ ràng"}, {v: "b", t: "Giao tiếp rõ ràng"}, {v: "c", t: "Tiếp tục nhiệm vụ"}, {v: "d", t: "Phê bình ý kiến trước khi hiểu chúng"}], ans: "d", explain: "Cần lắng nghe và thấu hiểu trước khi phê bình." },
        { id: 22, type: "radio", q: "Phần mềm diệt virus là gì?", opts: [{v: "a", t: "Quấy rối trực tuyến"}, {v: "b", t: "Chương trình bảo vệ máy tính khỏi phần mềm độc hại"}, {v: "c", t: "Truy cập nhiều người dùng"}, {v: "d", t: "Ăn cắp dữ liệu"}], ans: "b", explain: "Nó bảo vệ máy tính khỏi virus và malware." },
        { id: 23, type: "radio", q: "Điều gì KHÔNG phải là mối nguy hiểm phổ biến của thói quen sử dụng thiết bị kéo dài?", opts: [{v: "a", t: "Mệt mỏi hoặc đau chân"}, {v: "b", t: "Khó ngủ"}, {v: "c", t: "Mắt căng thẳng"}, {v: "d", t: "Đau lưng và cổ"}], ans: "a", explain: "Đau chân ít liên quan trực tiếp đến việc ngồi máy tính so với mắt và lưng." },

    function renderQuiz() {
        const form = document.getElementById('quiz-form');
        let html = '';
        questions.forEach((q, index) => {
            let label = q.id < 10 ? '0' + q.id : q.id;
            html += `<div class="question-card" id="card-${index}">
                <div class="topic-col">Chủ đề ${label}</div>
                <div class="content-col">
                    <div class="question-text">${q.q}</div>`;
            
            if (q.img && q.type !== 'img_radio' && q.type !== 'img_check' && !q.customHtml) {
                html += `<img src="${q.img}" class="single-img" alt="Minh họa">`;
            }

            if (q.type === 'radio') {
                html += `<div class="options">`;
                q.opts.forEach(opt => {
                    html += `<label><input type="radio" name="q${index}" value="${opt.v}"> ${opt.t}</label>`;
                });
                html += `</div>`;
            } else if (q.type === 'match') {
                html += `<div class="table-container"><table class="data-table"><thead><tr><th>Ví dụ / Nội dung</th><th>Lựa chọn</th></tr></thead><tbody>`;
                q.rows.forEach((r, rIdx) => {
                    let leftContent = r.html ? r.html : r.t;
                    html += `<tr>
                        <td style="vertical-align: middle;">${leftContent}</td>
                        <td style="vertical-align: middle;">
                            <select name="q${index}_${rIdx}" style="width:100%; padding:8px;">
                                <option value="">-- Chọn --</option>`;
                    q.opts.forEach(opt => {
                        html += `<option value="${opt.v}">${opt.t}</option>`;
                    });
                    html += `</select>
                        </td>
                    </tr>`;
                });
                html += `</tbody></table></div>`;
            } else if (q.type === 'table_tf') {
                html += `<div class="table-container"><table class="data-table"><thead><tr><th>Nội dung</th><th>${q.headers[0]}</th><th>${q.headers[1]}</th></tr></thead><tbody>`;
                q.rows.forEach((r, rIdx) => {
                    html += `<tr><td>${r.t}</td>
                        <td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="yes"></td>
                        <td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="no"></td></tr>`;
                });
                html += `</tbody></table></div>`;
            }
            
            html += `<div class="feedback"><strong>Giải thích:</strong> ${q.explain}</div>
                </div>
            </div>`;
        });
        form.innerHTML = html;
    }

    function gradeQuiz() {
        let score = 0;
        let allAnswered = true;
        let firstUnanswered = null;

        document.querySelectorAll('.question-card').forEach(c => c.classList.remove('incomplete'));
        document.querySelectorAll('.feedback').forEach(f => f.style.display = 'none');
        document.querySelectorAll('.correct-opt, .wrong-opt').forEach(el => {
            el.classList.remove('correct-opt', 'wrong-opt');
            el.style.backgroundColor = ''; el.style.borderColor = ''; el.style.border = '';
        });
        document.querySelectorAll('.correction').forEach(el => el.remove());

        questions.forEach((q, index) => {
            let answered = false;
            if (q.type === 'radio') {
                if (document.querySelector(`input[name="q${index}"]:checked`)) answered = true;
            } else if (q.type === 'match') {
                let subCount = 0;
                q.rows.forEach((r, rIdx) => { if (document.getElementsByName(`q${index}_${rIdx}`)[0].value !== "") subCount++; });
                if (subCount === q.rows.length) answered = true;
            } else if (q.type === 'table_tf') {
                let subCount = 0;
                q.rows.forEach((r, rIdx) => { if (document.querySelector(`input[name="q${index}_${rIdx}"]:checked`)) subCount++; });
                if (subCount === q.rows.length) answered = true;
            }

            if (!answered) {
                allAnswered = false;
                let card = document.getElementById(`card-${index}`);
                card.classList.add('incomplete');
                if (!firstUnanswered) firstUnanswered = card;
            }
        });

        if (!allAnswered) {
            alert("Vui lòng hoàn thành tất cả các câu hỏi trước khi nộp bài!");
            firstUnanswered.scrollIntoView({ behavior: "smooth", block: "center" });
            return;
        }

        questions.forEach((q, index) => {
            let isCorrect = false;
            if (q.type === 'radio') {
                let checked = document.querySelector(`input[name="q${index}"]:checked`);
                if (checked.value === q.ans) {
                    isCorrect = true;
                    checked.parentElement.classList.add('correct-opt');
                } else {
                    checked.parentElement.classList.add('wrong-opt');
                    let correctInput = document.querySelector(`input[name="q${index}"][value="${q.ans}"]`);
                    if(correctInput) correctInput.parentElement.style.border = "2px dashed #28a745";
                }
            } else if (q.type === 'match') {
                let subCorrect = 0;
                q.rows.forEach((r, rIdx) => {
                    let sel = document.getElementsByName(`q${index}_${rIdx}`)[0];
                    let userVal = sel.value;
                    let correctKey = r.a;
                    let correctText = q.opts.find(o => o.v === correctKey).t;

                    if (userVal === correctKey) {
                        subCorrect++;
                        sel.style.borderColor = "#28a745";
                        sel.style.backgroundColor = "#d4edda";
                    } else {
                        sel.style.borderColor = "#dc3545";
                        sel.style.backgroundColor = "#f8d7da";
                        let div = document.createElement("div");
                        div.className = "correction";
                        div.innerHTML = `Đúng: ${correctText}`;
                        sel.parentElement.appendChild(div);
                    }
                });
                if (subCorrect === q.rows.length) isCorrect = true;
            } else if (q.type === 'table_tf') {
                let subCorrect = 0;
                q.rows.forEach((r, rIdx) => {
                    let checked = document.querySelector(`input[name="q${index}_${rIdx}"]:checked`);
                    let rightVal = r.a; 
                    
                    if (checked.value === rightVal) {
                        subCorrect++;
                        checked.parentElement.style.backgroundColor = "#d4edda";
                    } else {
                        checked.parentElement.style.backgroundColor = "#f8d7da";
                        let correctInput = document.querySelector(`input[name="q${index}_${rIdx}"][value="${rightVal}"]`);
                        if (correctInput) correctInput.parentElement.style.border = "2px dashed #28a745";
                    }
                });
                if (subCorrect === q.rows.length) isCorrect = true;
            }

            if (isCorrect) score++;
            document.querySelector(`#card-${index} .feedback`).style.display = 'block';
        });

        let res = document.getElementById('result-area');
        res.style.display = 'block';
        let percent = Math.round((score / questions.length) * 100);
        res.innerHTML = `KẾT QUẢ: ${score} / ${questions.length} CÂU ĐÚNG (${percent}%)`;
        res.style.color = percent >= 80 ? '#ef6c00' : '#dc3545';
        res.style.borderColor = percent >= 80 ? '#ef6c00' : '#dc3545';

        document.querySelectorAll('input, select').forEach(el => el.disabled = true);
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    renderQuiz();
</script>
