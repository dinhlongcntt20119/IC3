<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lớp 4 - Level 2 | Kiến Thức Nền Tảng - Phần 2.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Kanit:ital,wght@1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            /* TÔNG MÀU CAM LEVEL 2 */
            --primary-color: #ef6c00; 
            --primary-dark: #e65100;
            --accent-color: #ff9800;
            --bg-body: #fff8e1;
            --text-color: #3e2723;
            --border-color: #ffe0b2;
            
            --correct-bg: #d4edda;
            --correct-border: #28a745;
            --wrong-bg: #f8d7da;
            --wrong-border: #dc3545;
        }

        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-body); color: var(--text-color); margin: 0; padding: 0; }
        
        /* HEADER */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 1000; border-bottom: 4px solid #fff;
        }
        .header-left { display: flex; flex-direction: column; align-items: flex-start; }
        .logo-ic3 { font-family: 'Kanit', sans-serif; font-size: 2rem; font-weight: 800; font-style: italic; line-height: 1; }
        .logo-ic3 span:nth-child(1) { color: #fff; } 
        .logo-ic3 span:nth-child(2) { color: #ffe0b2; }
        
        .home-btn {
            margin-top: 8px; color: white; text-decoration: none; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.6);
            padding: 5px 15px; border-radius: 20px; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px;
        }
        .home-btn:hover { background: rgba(255,255,255,0.2); }
        .header-right { text-align: right; }
        .teacher-name { font-weight: 700; font-size: 1.1rem; display: block; }
        .sub-title { font-size: 0.9rem; opacity: 0.9; }

        /* CONTAINER */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        .page-title { text-align: center; margin-bottom: 40px; }
        .page-title h1 { color: var(--primary-dark); margin: 0; font-size: 2.2rem; text-transform: uppercase; font-weight: 800; }
        .page-title h2 { color: #5d4037; margin: 10px 0 0; font-size: 1.4rem; font-weight: bold; text-transform: uppercase; }

        /* QUESTION CARD */
        .question-card {
            background: white; border: 1px solid var(--border-color); border-radius: 12px; 
            margin-bottom: 30px; overflow: hidden; display: flex; flex-wrap: wrap;
            box-shadow: 0 4px 12px rgba(230, 81, 0, 0.08);
        }
        .question-card.incomplete { border: 2px solid var(--wrong-border); box-shadow: 0 0 10px rgba(220, 53, 69, 0.2); }

        .topic-col {
            background-color: var(--primary-dark); width: 140px; padding: 20px;
            display: flex; align-items: center; justify-content: center; text-align: center;
            font-weight: 700; color: white; flex-shrink: 0; font-size: 1.2rem; border-right: 1px solid #fff;
        }
        .content-col { flex-grow: 1; padding: 25px; width: calc(100% - 140px); background: #fff; }

        .question-text { font-weight: 700; font-size: 1.1rem; margin-bottom: 20px; color: var(--primary-dark); line-height: 1.5; }

        /* OPTIONS */
        .options label {
            display: block; margin-bottom: 10px; cursor: pointer; padding: 12px 15px;
            border: 2px solid #fff3e0; border-radius: 8px; transition: 0.2s; position: relative;
        }
        .options label:hover { background-color: #fff3e0; border-color: var(--primary-color); }
        .options input { margin-right: 12px; transform: scale(1.3); vertical-align: middle; accent-color: var(--primary-color); }

        /* TABLES */
        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 15px; }
        .data-table { width: 100%; border-collapse: collapse; margin: 0; }
        .data-table th {
            background-color: var(--primary-color); color: white; padding: 15px; 
            text-align: center; font-weight: 700; border-bottom: 2px solid #fff;
        }
        .data-table td { border-bottom: 1px solid var(--border-color); padding: 15px; vertical-align: middle; }
        .data-table tr:nth-child(even) { background-color: #fff8e1; }
        .data-table tr:last-child td { border-bottom: none; }
        
        .data-table td:first-child { width: 65%; font-weight: 500; font-family: 'Times New Roman', serif; color: #000; }
        .data-table td:not(:first-child) { width: 35%; text-align: center; }

        .data-table select {
            width: 100%; padding: 10px; border: 1px solid #ffcc80; border-radius: 5px; 
            background: white; font-size: 0.95rem; cursor: pointer;
        }
        .data-table select:focus { outline: none; border-color: var(--primary-dark); }
        .data-table input[type="radio"] { transform: scale(1.5); cursor: pointer; accent-color: var(--primary-color); }

        /* FEEDBACK */
        .feedback { 
            margin-top: 20px; padding: 15px; background-color: #fff3cd; 
            border-left: 5px solid #ffc107; border-radius: 4px; 
            font-size: 0.95rem; color: #856404; display: none; line-height: 1.5;
        }
        .correct-opt { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; }
        .wrong-opt { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; }
        
        .correction { 
            display: block; margin-top: 8px; font-size: 0.9rem; font-weight: bold; 
            color: var(--wrong-border); background: rgba(255,255,255,0.9); padding: 5px; border-radius: 4px; border: 1px dashed var(--wrong-border);
        }

        .btn-submit {
            display: block; width: 250px; margin: 40px auto; padding: 18px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white; border: none; border-radius: 50px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(230, 81, 0, 0.4); transition: 0.3s;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(230, 81, 0, 0.6); }

        #result-area {
            text-align: center; font-size: 1.6rem; font-weight: bold; margin-top: 30px;
            padding: 30px; display: none; background: white; border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 2px solid var(--primary-color);
        }

        footer { background: var(--primary-dark); color: white; padding: 40px 20px; text-align: center; margin-top: 80px; }
        .footer-info { margin-top: 15px; font-size: 0.95rem; opacity: 0.9; }

        @media (max-width: 768px) {
            .question-card { flex-direction: column; }
            .topic-col { width: 100%; padding: 10px; justify-content: flex-start; border-right: none; border-bottom: 4px solid #ffcc80; }
            .content-col { width: 100%; padding: 15px; }
            .data-table td:first-child { width: 50%; }
            .data-table td:not(:first-child) { width: 50%; }
        }
    </style>
</head>

<script>
    const questions = [
        { id: 16, type: "radio", q: "Đâu là nghi thức trực tuyến KHÔNG phù hợp?", opts: [{v: "a", t: "Giải quyết xung đột trực tuyến ngoại tuyến"}, {v: "b", t: "Hãy đối xử với người khác theo cách bạn muốn được đối xử"}, {v: "c", t: "Giao tiếp về những người khác mà không có sự cho phép của họ"}, {v: "d", t: "Viết email sử dụng tất cả các chữ hoa"}], ans: "d", explain: "Viết toàn bộ chữ hoa (ALL CAPS) thường được hiểu là đang la hét hoặc giận dữ." },
        { id: 17, type: "radio", q: "Điều nào KHÔNG phải là một phần của thực hành giao tiếp tốt?", opts: [{v: "a", t: "Sự tôn trọng (Respect)"}, {v: "b", t: "Đồng cảm (Empathy)"}, {v: "c", t: "Căn chỉnh (Alignment)"}, {v: "d", t: "Phép lịch sự (Etiquette)"}], ans: "c", explain: "Alignment là thuật ngữ về định dạng văn bản, không phải là kỹ năng giao tiếp." },
        { id: 18, type: "radio", q: "Việc bạn chia sẻ công việc với các bạn cùng lớp để nhận phản hồi được gọi là gì?", opts: [{v: "a", t: "Xuất bản (Publishing)"}, {v: "b", t: "Vai trò (Roles)"}, {v: "c", t: "Trách nhiệm (Responsibilities)"}, {v: "d", t: "Đánh giá ngang hàng (Peer review)"}], ans: "d", explain: "Peer review giúp cải thiện chất lượng công việc thông qua góp ý của bạn bè/đồng nghiệp." },
        { id: 19, type: "radio", q: "Một yếu tố quan trọng của sự hợp tác thành công là gì?", opts: [{v: "a", t: "Phê bình ý tưởng hoặc quan điểm của mọi người trước khi hiểu chúng"}, {v: "b", t: "Thay đổi vai trò của mọi người mỗi khi bạn gặp nhau"}, {v: "c", t: "Xác thực ý tưởng"}, {v: "d", t: "Chơi trò chơi trong giờ làm việc nhóm"}], ans: "c", explain: "Xác thực và thấu hiểu ý tưởng của nhau là chìa khóa của làm việc nhóm hiệu quả." },
        { id: 20, type: "radio", q: "Mỗi nguy hiểm phổ biến của thời gian sử dụng màn hình kéo dài là gì?", opts: [{v: "a", t: "Mất nước (Dehydration)"}, {v: "b", t: "Mệt mỏi hoặc đau chân (Tired or sore feet)"}, {v: "c", t: "Điểm kém (Poor grades)"}, {v: "d", t: "Khó ngủ (Difficulty sleeping)"}], ans: "d", explain: "Ánh sáng xanh từ màn hình có thể gây rối loạn giấc ngủ." },
        { id: 21, type: "radio", q: "Tùy chọn nào dưới đây KHÔNG phải là một ví dụ về CYBERBULLYING?", opts: [{v: "a", t: "Lan truyền tin đồn về ai đó trên phương tiện truyền thông xã hội"}, {v: "b", t: "Nói những điều gây tổn thương về ai đó trong bữa trưa"}, {v: "c", t: "Gửi tin nhắn email gây tổn thương cho ai đó"}, {v: "d", t: "Quay video của mọi người mà họ không biết và đăng nó lên mạng"}], ans: "b", explain: "Nói xấu trong bữa trưa là bắt nạt trực tiếp (offline), không phải bắt nạt qua mạng (Cyber)." },
        { id: 22, type: "radio", q: "Thiết bị nào KHÔNG có camera?", opts: [{v: "a", t: "Tai nghe Bluetooth (Bluetooth Headset)"}, {v: "b", t: "Google Chromebook"}, {v: "c", t: "Apple iPhone"}, {v: "d", t: "Chuông cửa thông minh (Smart doorbell)"}], ans: "a", explain: "Tai nghe Bluetooth là thiết bị âm thanh, không tích hợp camera." },
        { id: 23, type: "radio", q: "Đâu KHÔNG phải là ví dụ về thông tin đăng nhập có thể được sử dụng để xác thực người dùng?", opts: [{v: "a", t: "Vân tay (Fingerprint)"}, {v: "b", t: "Mật khẩu (Password)"}, {v: "c", t: "Cookies"}, {v: "d", t: "Nhận diện nói (Voice recognition)"}], ans: "c", explain: "Cookies dùng để lưu trữ phiên làm việc và theo dõi, không phải là phương thức xác thực sinh trắc học hay mật khẩu chủ động." },
        { id: 24, type: "table_tf", q: "Hãy chọn Có nếu đó là nội dung trực tuyến mà bạn thường có thể TIN CẬY và Không nếu không thể tin cậy.", headers: ["Có", "Không"], rows: [{t: "Bản tin trường học mà bạn đã đăng ký", a: "yes"}, {t: "Email có URL từ người gửi mà bạn không nhận ra", a: "no"}, {t: "Một trang web bật lên cho biết bạn đã giành được thứ gì đó", a: "no"}, {t: "Tin nhắn trong ứng dụng từ một người mà bạn không biết", a: "no"}], explain: "Chỉ tin cậy các nguồn thông tin chính thống và đã được xác thực." },
        { id: 25, type: "table_tf", q: "Chọn Có nếu đó là ví dụ về GIAO TIẾP và Không nếu không phải.", headers: ["Có", "Không"], rows: [{t: "Một bản tin email", a: "yes"}, {t: "Phát trực tuyến một bộ phim tài liệu", a: "no"}, {t: "Một văn bản cập nhật từ trường học của bạn", a: "yes"}, {t: "Bảng tính điểm của bạn", a: "no"}], explain: "Giao tiếp liên quan đến việc trao đổi thông tin giữa các bên. Phim ảnh là giải trí, Bảng điểm là dữ liệu." },
        { id: 26, type: "table_tf", q: "Chọn Có nếu đó là ví dụ về UPSTANDER (Người bảo vệ/lên tiếng) và Không nếu không phải.", headers: ["Có", "Không"], rows: [{t: "Dừng lại, tạm dừng, nói chuyện với người lớn sau khi thấy ai đó tham gia bắt nạt trên mạng", a: "yes"}, {t: "Không làm gì khi một người bạn cùng lớp đang lan truyền tin đồn về ai đó trên mạng", a: "no"}, {t: "Tôn trọng người khác trên mạng, ngay cả khi bạn không đồng ý với ý kiến của họ", a: "yes"}, {t: "Đăng ảnh của mọi người lên mạng mà họ không biết", a: "no"}], explain: "Upstander là người dám đứng lên bảo vệ lẽ phải và chống lại hành vi bắt nạt." },
        { id: 27, type: "table_tf", q: "Chọn Có nếu đó là ví dụ về giao tiếp phù hợp và Không nếu đó là ví dụ về giao tiếp tiêu cực/không an toàn.", headers: ["Có", "Không"], rows: [{t: "Trả lời email có thông tin ngân hàng của bạn vì người gửi cho biết họ cần trợ giúp", a: "no"}, {t: "Gửi email cho các bạn cùng lớp một bản sao những gì bạn đã tạo cho một dự án nhóm", a: "yes"}, {t: "Nhắn tin những lời động viên cho một người bạn đang gặp khó khăn", a: "yes"}, {t: "Cung cấp thông tin cá nhân cho ai đó trong phòng trò chuyện vì họ yêu cầu", a: "no"}], explain: "Tuyệt đối không chia sẻ thông tin tài chính hoặc cá nhân cho người lạ trực tuyến." },
        { id: 28, type: "table_tf", q: "Chọn Có nếu đó là ví dụ về THIẾT BỊ ĐẦU VÀO và Không nếu không phải.", headers: ["Có", "Không"], rows: [{t: "Mouse (Chuột máy tính)", a: "yes"}, {t: "Printer (Máy in)", a: "no"}, {t: "Keyboard (Bàn phím)", a: "yes"}, {t: "Speakers (Loa)", a: "no"}], explain: "Chuột và Bàn phím dùng để nhập dữ liệu. Máy in và Loa dùng để xuất dữ liệu." },
        { id: 29, type: "match", q: "Nối mỗi định nghĩa ở bên trái với thuật ngữ tương ứng ở bên phải.", rows: [{t: "Các giao dịch mua nội dung hoặc đăng ký bổ sung mà bạn mua trong ứng dụng", a: "purchase"}, {t: "Một khoảng thời gian nhất định để sử dụng ứng dụng miễn phí trước khi được yêu cầu đăng ký trả phí", a: "trial"}, {t: "Quyền truy cập phải trả phí vào nội dung trong ứng dụng trong một khoảng thời gian cụ thể", a: "sub"}], opts: [{v: "trial", t: "App trial (Dùng thử ứng dụng)"}, {v: "purchase", t: "In-app purchase (Mua trong ứng dụng)"}, {v: "sub", t: "App subscription (Đăng ký ứng dụng)"}], explain: "Trial: Dùng thử. Purchase: Mua thêm. Subscription: Đăng ký định kỳ." },
        { id: 30, type: "match", q: "Nối mỗi định nghĩa ở bên trái với thuật ngữ tương ứng ở bên phải.", rows: [{t: "Cập nhật trang web để xem nội dung có thay đổi hay không", a: "rl"}, {t: "Việc lưu trữ, tổ chức và truy xuất thông tin", a: "im"}, {t: "Để nhấp chuột và xem qua các tài nguyên trên internet", a: "nav"}, {t: "Lưu địa chỉ web", a: "bm"}], opts: [{v: "bm", t: "Bookmark (Đánh dấu trang)"}, {v: "rl", t: "Reload (Tải lại)"}, {v: "im", t: "Information Management (Quản lý thông tin)"}, {v: "nav", t: "Navigate (Điều hướng)"}], explain: "Bookmark: Lưu lại. Reload: Tải lại. Navigate: Duyệt web. Info Mgmt: Quản lý dữ liệu." },
        { id: 31, type: "match", q: "Nối mỗi định nghĩa ở bên trái với thuật ngữ tương ứng ở bên phải.", rows: [{t: "Một trang của bài trình chiếu Slide", a: "slide"}, {t: "Kiểm soát cách hiển thị nội dung", a: "align"}, {t: "Một nhóm câu tập trung vào cùng một chủ đề", a: "para"}, {t: "Các mục liên quan được viết liên tiếp, thường là mục này ở trên mục kia", a: "list"}], opts: [{v: "para", t: "Paragraph (Đoạn văn bản)"}, {v: "align", t: "Alignment (Căn chỉnh)"}, {v: "slide", t: "Slide (Trang chiếu)"}, {v: "list", t: "List (Danh sách)"}], explain: "Paragraph: Đoạn văn. Alignment: Căn chỉnh. Slide: Trang chiếu. List: Danh sách." },
        { id: 32, type: "match", q: "Nối mỗi định nghĩa ở bên trái với thuật ngữ tương ứng ở bên phải.", rows: [{t: "Quá trình xem xét và thay đổi nội dung để chuẩn bị xuất bản", a: "edit"}, {t: "Các nhiệm vụ cụ thể mà mỗi vai trò chịu trách nhiệm khi cộng tác", a: "resp"}, {t: "Học sinh chia sẻ bài tập với nhau để có phản hồi mang tính xây dựng", a: "pr"}, {t: "Phân công công việc cho các thành viên trong nhóm khi cộng tác", a: "roles"}], opts: [{v: "edit", t: "Editing (Chỉnh sửa)"}, {v: "resp", t: "Responsibilities (Trách nhiệm)"}, {v: "roles", t: "Roles (Vai trò)"}, {v: "pr", t: "Peer Review (Bình duyệt)"}], explain: "Editing: Sửa chữa. Roles: Phân vai. Responsibilities: Nhiệm vụ. Peer Review: Đánh giá lẫn nhau." },
        { id: 33, type: "match", q: "Nối mỗi định nghĩa ở bên trái với thuật ngữ tương ứng ở bên phải.", rows: [{t: "Phần mềm độc hại, như virút và phần mềm gián điệp", a: "mal"}, {t: "Chứng minh ai đó đúng như họ nói", a: "auth"}, {t: "Khi ai đó hình thành một mối quan hệ và chiếm được lòng tin của một người để lợi dụng họ", a: "groom"}, {t: "Tin nhắn không mong muốn nhận được qua email, tin nhắn văn bản hoặc hệ thống nhắn tin khác", a: "spam"}], opts: [{v: "mal", t: "Malware (Phần mềm độc hại)"}, {v: "spam", t: "Spam"}, {v: "auth", t: "Authentication (Xác thực)"}, {v: "groom", t: "Grooming"}], explain: "Malware: Độc hại. Spam: Tin rác. Authentication: Xác thực danh tính. Grooming: Dụ dỗ/Lợi dụng." }
    ];

    function renderQuiz() {
        const form = document.getElementById('quiz-form');
        let html = '';
        questions.forEach((q, index) => {
            let label = q.id < 10 ? '0' + q.id : q.id;
            html += `<div class="question-card" id="card-${index}">
                <div class="topic-col">Chủ đề ${label}</div>
                <div class="content-col">
                    <div class="question-text">${q.q}</div>`;
            
            if (q.type === 'radio') {
                html += `<div class="options">`;
                q.opts.forEach(opt => {
                    html += `<label><input type="radio" name="q${index}" value="${opt.v}"> ${opt.t}</label>`;
                });
                html += `</div>`;
            } else if (q.type === 'match') {
                html += `<div class="table-container"><table class="data-table"><thead><tr><th>Định nghĩa / Nội dung</th><th>Lựa chọn</th></tr></thead><tbody>`;
                q.rows.forEach((r, rIdx) => {
                    html += `<tr><td>${r.t}</td><td><select name="q${index}_${rIdx}" style="width:100%"><option value="">-- Chọn --</option>`;
                    q.opts.forEach(opt => {
                        html += `<option value="${opt.v}">${opt.t}</option>`;
                    });
                    html += `</select></td></tr>`;
                });
                html += `</tbody></table></div>`;
            } else if (q.type === 'table_tf') {
                html += `<div class="table-container"><table class="data-table tf-table"><thead><tr><th>Nội dung</th><th>${q.headers[0]}</th><th>${q.headers[1]}</th></tr></thead><tbody>`;
                q.rows.forEach((r, rIdx) => {
                    html += `<tr><td>${r.t}</td>
                        <td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="yes"></td>
                        <td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="no"></td></tr>`;
                });
                html += `</tbody></table></div>`;
            }
            
            html += `<div class="feedback"><strong>Giải thích:</strong> ${q.explain}</div>
                </div>
            </div>`;
        });
        form.innerHTML = html;
    }

    function gradeQuiz() {
        let score = 0;
        let allAnswered = true;
        let firstUnanswered = null;

        document.querySelectorAll('.question-card').forEach(c => c.classList.remove('incomplete'));
        document.querySelectorAll('.feedback').forEach(f => f.style.display = 'none');
        document.querySelectorAll('.correct-opt, .wrong-opt').forEach(el => {
            el.classList.remove('correct-opt', 'wrong-opt');
            el.style.backgroundColor = ''; el.style.borderColor = ''; el.style.border = '';
        });
        document.querySelectorAll('.correction').forEach(el => el.remove());

        questions.forEach((q, index) => {
            let answered = false;
            if (q.type === 'radio') {
                if (document.querySelector(`input[name="q${index}"]:checked`)) answered = true;
            } else if (q.type === 'match' || q.type === 'table_tf') {
                let subCount = 0;
                let totalRows = q.rows.length;
                if (q.type === 'match') {
                    q.rows.forEach((r, rIdx) => { if (document.getElementsByName(`q${index}_${rIdx}`)[0].value !== "") subCount++; });
                } else {
                    q.rows.forEach((r, rIdx) => { if (document.querySelector(`input[name="q${index}_${rIdx}"]:checked`)) subCount++; });
                }
                if (subCount === totalRows) answered = true;
            }

            if (!answered) {
                allAnswered = false;
                let card = document.getElementById(`card-${index}`);
                card.classList.add('incomplete');
                if (!firstUnanswered) firstUnanswered = card;
            }
        });

        if (!allAnswered) {
            alert("Vui lòng hoàn thành tất cả các Chủ đề hỏi trước khi nộp bài!");
            firstUnanswered.scrollIntoView({ behavior: "smooth", block: "center" });
            return;
        }

        questions.forEach((q, index) => {
            let isCorrect = false;
            if (q.type === 'radio') {
                let checked = document.querySelector(`input[name="q${index}"]:checked`);
                if (checked.value === q.ans) {
                    isCorrect = true;
                    checked.parentElement.classList.add('correct-opt');
                } else {
                    checked.parentElement.classList.add('wrong-opt');
                    let correctInput = document.querySelector(`input[name="q${index}"][value="${q.ans}"]`);
                    if(correctInput) correctInput.parentElement.style.border = "2px dashed #28a745";
                }
            } else if (q.type === 'match') {
                let subCorrect = 0;
                q.rows.forEach((r, rIdx) => {
                    let sel = document.getElementsByName(`q${index}_${rIdx}`)[0];
                    if (sel.value === r.a) {
                        subCorrect++;
                        sel.style.borderColor = "#28a745";
                        sel.style.backgroundColor = "#d4edda";
                    } else {
                        sel.style.borderColor = "#dc3545";
                        sel.style.backgroundColor = "#f8d7da";
                        let correctText = q.opts.find(o => o.v === r.a).t;
                        let div = document.createElement("div");
                        div.className = "correction";
                        div.innerHTML = `Đúng: ${correctText}`;
                        sel.parentElement.appendChild(div);
                    }
                });
                if (subCorrect === q.rows.length) isCorrect = true;
            } else if (q.type === 'table_tf') {
                let subCorrect = 0;
                q.rows.forEach((r, rIdx) => {
                    let checked = document.querySelector(`input[name="q${index}_${rIdx}"]:checked`);
                    let rightVal = r.a; 
                    if (checked.value === rightVal) {
                        subCorrect++;
                        checked.parentElement.style.backgroundColor = "#d4edda";
                    } else {
                        checked.parentElement.style.backgroundColor = "#f8d7da";
                        let correctInput = document.querySelector(`input[name="q${index}_${rIdx}"][value="${rightVal}"]`);
                        if (correctInput) correctInput.parentElement.style.border = "2px dashed #28a745";
                    }
                });
                if (subCorrect === q.rows.length) isCorrect = true;
            }

            if (isCorrect) score++;
            document.querySelector(`#card-${index} .feedback`).style.display = 'block';
        });

        let res = document.getElementById('result-area');
        res.style.display = 'block';
        let percent = Math.round((score / questions.length) * 100);
        res.innerHTML = `KẾT QUẢ: ${score} / ${questions.length} CÂU ĐÚNG (${percent}%)`;
        res.style.color = percent >= 80 ? '#ef6c00' : '#dc3545';
        res.style.borderColor = percent >= 80 ? '#ef6c00' : '#dc3545';

        document.querySelectorAll('input, select').forEach(el => el.disabled = true);
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    renderQuiz();
</script>
