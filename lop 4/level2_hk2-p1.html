<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IC3 SPARK LEVEL 2 - KIẾN THỨC TỔNG HỢP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Kanit:ital,wght@1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-blue: #234585; --accent-yellow: #ffc107; --bg-color: #f0f4f8; --success-color: #d4edda; --error-color: #f8d7da; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: #333; line-height: 1.6; margin: 0; padding: 0; }
        header { background-color: var(--primary-blue); color: white; padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent-yellow); position: sticky; top: 0; z-index: 1000; }
        .home-btn { background: rgba(255,255,255,0.2); color: white; text-decoration: none; padding: 6px 15px; border-radius: 20px; font-weight: 500; border: 1px solid rgba(255,255,255,0.4); display: flex; align-items: center; gap: 5px; }
        .logo-ic3 { font-family: 'Kanit', sans-serif; font-size: 1.8rem; font-style: italic; font-weight: 800; display: flex; align-items: center; }
        .logo-ic3 span:nth-child(1) { color: #4CAF50; -webkit-text-stroke: 1px white; margin-right: 5px; } 
        .logo-ic3 span:nth-child(2) { color: #222; opacity: 0.7; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .question-card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 25px; position: relative; border: 1px solid #e1e8ed; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .question-card.incomplete { border: 2px solid #dc3545; box-shadow: 0 0 8px rgba(220,53,69,0.4); }
        .topic-label { position: absolute; top: -12px; left: 20px; background: #e9ecef; border: 1px solid #ccc; color: #333; padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        .question-text { font-weight: 700; font-size: 1.1rem; margin-bottom: 15px; color: #2c3e50; margin-top: 5px; }
        .options label { display: block; padding: 10px 15px; margin-bottom: 8px; border: 1px solid #eee; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .options label:hover { background: #f0f7ff; }
        .grid-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .grid-table th, .grid-table td { border: 1px solid #dee2e6; padding: 10px; text-align: center; }
        .grid-table th { background: #f8f9fa; }
        .grid-table td:first-child { text-align: left; font-weight: 500; width: 60%; }
        .grid-table select { width: 100%; padding: 5px; border-radius: 4px; border: 1px solid #ced4da; }
        
        /* Feedback Styles */
        .correct-answer { background-color: var(--success-color) !important; border: 1px solid #28a745 !important; }
        .wrong-answer { background-color: var(--error-color) !important; border: 1px solid #dc3545 !important; }
        .feedback-box { display: none; margin-top: 15px; padding: 15px; background: #eef2f7; border-left: 5px solid #28a745; border-radius: 4px; font-size: 0.95rem; }
        .feedback-title { font-weight: bold; color: #155724; display: block; margin-bottom: 5px; }

        .btn-submit { display: block; width: 100%; padding: 18px; background: var(--primary-blue); color: white; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 30px; }
        #result-area { text-align: center; font-size: 1.4rem; font-weight: bold; margin-top: 30px; display: none; padding: 20px; border-radius: 8px; }
        footer { background-color: var(--primary-blue); color: white; padding: 40px 20px; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>
<header>
    <div class="header-left"><a href="index.html" class="home-btn"><i class="fas fa-home"></i> Trang chủ</a><div class="logo-ic3"><span>IC3</span><span>spark</span></div></div>
    <div style="text-align: right; line-height: 1.3;"><div>GV. Nguyễn Đình Bạch Long</div><div style="font-size: 0.85rem; opacity: 0.9;">Level 2 - Tổng hợp</div></div>
</header>

<div class="container">
    <div style="text-align:center; margin-bottom:30px;">
        <h1 style="color:var(--primary-blue);">KIẾN THỨC TỔNG HỢP - PHẦN 1</h1>
        <p>Phiếu bài tập IC3 Spark Level 2 (Câu 01 - Câu 36)</p>
    </div>
    <form id="quiz-form">
        <script>
            // Hàm sinh HTML câu hỏi tự động để tiết kiệm không gian hiển thị mã nguồn
            const questions = [
                {id:1, q:"Thành phần quan trọng nhất để chạy ứng dụng?", type:"radio", opts:[{v:"a",t:"Bộ lưu trữ"},{v:"b",t:"Bộ nhớ"},{v:"c",t:"Thẻ SIM"},{v:"d",t:"Card màn hình"}], ans:"b", explain:"Bộ nhớ (RAM) là nơi lưu trữ tạm thời để chạy ứng dụng."},
                {id:2, q:"Phương pháp truy cập/cập nhật tập tin trực tuyến?", type:"radio", opts:[{v:"a",t:"Ổ cứng ngoài"},{v:"b",t:"Lưu trữ đám mây"},{v:"c",t:"Email"},{v:"d",t:"USB"}], ans:"b", explain:"Lưu trữ đám mây (Cloud) cho phép truy cập mọi lúc mọi nơi."},
                {id:3, q:"Thiết bị thay thế chuột trên máy tính bảng? (Chọn 2)", type:"check", opts:[{v:"a",t:"Chuột KTS"},{v:"b",t:"Bút chì"},{v:"c",t:"Màn hình cảm ứng"},{v:"d",t:"Bút cảm ứng"}], ans:["c","d"], explain:"Màn hình cảm ứng và Bút cảm ứng (Stylus)."},
                {id:4, q:"Kết nối không dây tải ảnh từ máy ảnh?", type:"radio", opts:[{v:"a",t:"HDMI"},{v:"b",t:"VGA"},{v:"c",t:"RCA"},{v:"d",t:"Bluetooth"}], ans:"d", explain:"Bluetooth là kết nối không dây tầm ngắn."},
                {id:5, q:"Loại lưu trữ truy cập từ xa qua internet?", type:"radio", opts:[{v:"a",t:"CD"},{v:"b",t:"HDD"},{v:"c",t:"USB"},{v:"d",t:"Lưu trữ đám mây"}], ans:"d", explain:"Cloud Storage."},
                {id:6, q:"Dữ liệu di động là gì?", type:"radio", opts:[{v:"a",t:"Thời gian gọi"},{v:"b",t:"Internet không dây tính phí theo dung lượng"},{v:"c",t:"Tin nhắn"},{v:"d",t:"Bộ nhớ"}], ans:"b", explain:"Truy cập internet qua mạng di động (3G/4G/5G)."},
                {id:7, q:"Lợi ích tải xuống so với phát trực tuyến? (Chọn 2)", type:"check", opts:[{v:"a",t:"Phát mượt hơn"},{v:"b",t:"Phát lại đáng tin cậy hơn"},{v:"c",t:"Không tốn chỗ"},{v:"d",t:"Không cần đợi"},{v:"e",t:"Không cần internet để phát"}], ans:["b","e"], explain:"File tải về xem offline được và không bị giật lag do mạng."},
                {id:8, q:"Cách tăng dung lượng lưu trữ điện thoại? (Chọn 2)", type:"check", opts:[{v:"a",t:"Gỡ cài đặt game"},{v:"b",t:"Xóa ảnh cũ"},{v:"c",t:"Đóng app nền"},{v:"d",t:"Xem video SD"}], ans:["a","b"], explain:"Gỡ bỏ ứng dụng và xóa dữ liệu thừa."},
                {id:9, q:"Virus ảnh hưởng thế nào? (Chọn 2)", type:"check", opts:[{v:"a",t:"Xóa/hỏng dữ liệu"},{v:"b",t:"Thu thập thông tin"},{v:"c",t:"Hỏng bo mạch"},{v:"d",t:"Tấn công DoS"}], ans:["a","b"], explain:"Virus phần mềm thường phá hoại dữ liệu hoặc đánh cắp thông tin."},
                {id:10, q:"Đơn vị đo lưu trữ? (Chọn 2)", type:"check", opts:[{v:"a",t:"CM"},{v:"b",t:"Feet"},{v:"c",t:"Terabytes"},{v:"d",t:"Gigabytes"},{v:"e",t:"Inches"}], ans:["c","d"], explain:"TB và GB là đơn vị đo dung lượng."},
                {id:11, q:"Cài gì làm hết dung lượng bộ nhớ?", type:"radio", opts:[{v:"a",t:"Sạc pin"},{v:"b",t:"Xem HD"},{v:"c",t:"Quên xóa cache"},{v:"d",t:"Cài quá nhiều game"}], ans:"d", explain:"Game thường chiếm dung lượng rất lớn."},
                {id:12, q:"Thông tin nào thuộc dấu chân kỹ thuật số?", type:"radio", opts:[{v:"a",t:"Điểm số"},{v:"b",t:"Giày"},{v:"c",t:"Tin nhắn SMS"},{v:"d",t:"Lịch sử tìm kiếm internet"}], ans:"d", explain:"Lịch sử tìm kiếm được lưu lại trực tuyến."},
                {id:13, q:"Chọn 2 thông tin thuộc dấu chân KTS?", type:"check", opts:[{v:"a",t:"Email gửi đi"},{v:"b",t:"Trang web truy cập"},{v:"c",t:"Cuộc gọi"},{v:"d",t:"Bài tập nộp"}], ans:["a","b"], explain:"Hoạt động online tạo ra dấu chân số."},
                {id:14, q:"Nhận game lậu, làm gì?", type:"radio", opts:[{v:"a",t:"Yêu cầu hoàn tiền"},{v:"b",t:"Tắt tường lửa"},{v:"c",t:"Quét virus"},{v:"d",t:"Chia sẻ"}], ans:"a", explain:"Không sử dụng phần mềm vi phạm bản quyền."},
                {id:15, q:"Ưu điểm điện toán đám mây? (Chọn 4)", type:"check", opts:[{v:"a",t:"Phí"},{v:"b",t:"Nhóm truy cập cùng lúc"},{v:"c",t:"Tự động sao lưu"},{v:"d",t:"Truy cập mọi nơi"},{v:"e",t:"Cần internet"},{v:"f",t:"Chia sẻ dễ dàng"}], ans:["b","c","d","f"], explain:"Cộng tác, Sao lưu, Truy cập từ xa, Chia sẻ."},
                {id:16, q:"Đúng/Sai về Dấu chân KTS?", type:"table", rows:[{t:"Thông tin đăng mạng là dấu chân số",a:"d"},{t:"Có thể xóa vĩnh viễn mọi thứ",a:"s"},{t:"Bài tập ở trường là dấu chân số",a:"s"}], explain:"Không thể xóa vĩnh viễn dấu chân số. Bài tập giấy không phải dấu chân số (trừ khi nộp online công khai)."},
                {id:17, q:"Duyệt web an toàn? (Chọn 2)", type:"check", opts:[{v:"a",t:"Không tải gì là an toàn"},{v:"b",t:"Trình duyệt bảo mật tốt hơn"},{v:"c",t:"Xóa file tạm"},{v:"d",t:"Chỉ nhập thông tin web an toàn (HTTPS)"}], ans:["b","d"], explain:"Dùng trình duyệt uy tín và chỉ nhập liệu trên web an toàn."},
                {id:18, q:"Dịch vụ dựa trên internet?", type:"radio", opts:[{v:"a",t:"Email"},{v:"b",t:"Split-screen"},{v:"c",t:"Bách khoa toàn thư"},{v:"d",t:"Microsoft"}], ans:"a", explain:"Email cần internet để gửi/nhận."},
                {id:19, q:"Tại sao bảo vệ danh tính trực tuyến? (Chọn 2)", type:"check", opts:[{v:"a",t:"Ai cũng nói thật"},{v:"b",t:"Người dùng không dùng ảnh thật"},{v:"c",t:"Internet có bộ nhớ lâu dài"},{v:"d",t:"Không cần bảo vệ"}], ans:["b","c"], explain:"Thông tin lưu lâu dài và người lạ có thể ẩn danh."},
                {id:20, q:"Hành vi đúng ở trường? (Chọn 2)", type:"check", opts:[{v:"a",t:"Không trộm/phá hoại"},{v:"b",t:"Chia sẻ mật khẩu"},{v:"c",t:"Không dùng MXH trong lớp"},{v:"d",t:"Mở loa ngoài"}], ans:["a","c"], explain:"Tôn trọng tài sản và quy định lớp học."},
                {id:21, q:"Ghép hành vi với phép xã giao:", type:"match", rows:[{t:"Đăng ảnh bạn chưa hỏi",a:"privacy"},{t:"Nhắn tin đêm khuya",a:"time"},{t:"Nói xấu bạn bè",a:"gossip"},{t:"VIẾT HOA HẾT",a:"caps"}], explain:"Privacy: Riêng tư, Time: Thời gian, Gossip: Nói xấu, Caps: La hét."},
                {id:22, q:"Phép xã giao KTS?", type:"radio", opts:[{v:"a",t:"Nguồn giả"},{v:"b",t:"Châm biếm"},{v:"c",t:"Phỉ báng"},{v:"d",t:"Duy trì tính tích cực"}], ans:"d", explain:"Luôn lịch sự và tích cực."},
                {id:23, q:"Dấu chân KTS là gì?", type:"radio", opts:[{v:"a",t:"Thư tay"},{v:"b",t:"Bài đăng MXH"},{v:"c",t:"Nhạc trong ổ cứng"},{v:"d",t:"Biên lai giấy"}], ans:"b", explain:"Hoạt động công khai trên mạng."},
                {id:24, q:"http://... là gì?", type:"radio", opts:[{v:"a",t:"Tác giả"},{v:"b",t:"Tiêu đề"},{v:"c",t:"URL"},{v:"d",t:"Mã nguồn"}], ans:"c", explain:"Đó là địa chỉ web (URL)."},
                {id:25, q:"Ví dụ về URL?", type:"radio", opts:[{v:"a",t:"http://www.cool.com/visit"},{v:"b",t:"com.Cool"},{v:"c",t:"Cool.com"},{v:"d",t:"www.cool"}], ans:"a", explain:"URL đầy đủ bao gồm giao thức (http)."},
                {id:26, q:"Web chơi game là loại gì?", type:"radio", opts:[{v:"a",t:"Giải trí"},{v:"b",t:"Thông tin"},{v:"c",t:"MXH"},{v:"d",t:"Giao tiếp"}], ans:"a", explain:"Chơi game là giải trí."},
                {id:27, q:"Ghép thuật ngữ web:", type:"match", rows:[{t:"Cập nhật bản mới nhất",a:"reload"},{t:"Khám phá web",a:"navigate"},{t:"Lưu địa chỉ",a:"bookmark"},{t:"Ô nhập liệu",a:"form"}], explain:"Reload: Tải lại, Navigate: Điều hướng, Bookmark: Dấu trang, Form: Biểu mẫu."},
                {id:28, q:"Đúng/Sai về trình duyệt:", type:"table", rows:[{t:"Bookmark để lưu trang yêu thích",a:"d"},{t:"Reload để xem trang thường xuyên",a:"s"},{t:"Autofill tự điền thông tin",a:"d"}], explain:"Reload chỉ làm mới trang hiện tại."},
                {id:29, q:"Xử lý tình huống:", type:"match_inline", txt:"Trang bị đứng -> [1], Muốn xem câu sau -> [2]", opts:[{v:"reload",t:"Tải lại"},{v:"navigate",t:"Điều hướng"},{v:"bookmark",t:"Dấu trang"}], ans:["reload","navigate"], explain:"Đứng -> Tải lại. Xem tiếp -> Điều hướng."},
                {id:30, q:"Tinh chỉnh tìm kiếm? (Chọn 2)", type:"check", opts:[{v:"a",t:"Nhấp quảng cáo"},{v:"b",t:"Thử lại y chang"},{v:"c",t:"Dùng bộ lọc"},{v:"d",t:"Dùng từ đồng nghĩa"}], ans:["c","d"], explain:"Bộ lọc và từ khóa khác giúp tìm chính xác hơn."},
                {id:31, q:"Trang khuyến mãi 5 phút nữa, làm gì?", type:"radio", opts:[{v:"a",t:"In"},{v:"b",t:"Bookmark"},{v:"c",t:"Email"},{v:"d",t:"Tải lại (Reload)"}], ans:"d", explain:"Tải lại để cập nhật giá mới."},
                {id:32, q:"Lưu trang web để xem sau?", type:"radio", opts:[{v:"a",t:"Nhớ"},{v:"b",t:"Bookmark"},{v:"c",t:"Nói bạn"},{v:"d",t:"Nhờ nhắc"}], ans:"b", explain:"Dấu trang (Bookmark)."},
                {id:33, q:"Tìm không thấy tin, làm gì?", type:"radio", opts:[{v:"a",t:"Đóng"},{v:"b",t:"Check mạng"},{v:"c",t:"Dùng từ đồng nghĩa"},{v:"d",t:"Bấm quảng cáo"}], ans:"c", explain:"Thay đổi từ khóa."},
                {id:34, q:"Tìm hiểu người viết bài?", type:"radio", opts:[{v:"a",t:"Privacy"},{v:"b",t:"Tác giả (Author)"},{v:"c",t:"Terms"},{v:"d",t:"Mobile"}], ans:"b", explain:"Author link."},
                {id:35, q:"Ghép hoạt động:", type:"match", rows:[{t:"Gửi email cho GV",a:"comm"},{t:"Dùng Google Scholar",a:"info"},{t:"Xem video hài",a:"ent"}], explain:"Comm: Giao tiếp, Info: Thông tin, Ent: Giải trí."},
                {id:36, q:"Công cụ tìm kiếm? (Chọn 2)", type:"check", opts:[{v:"a",t:"Safari"},{v:"b",t:"Bing"},{v:"c",t:"Google"},{v:"d",t:"Firefox"}], ans:["b","c"], explain:"Bing và Google là Search Engine. Safari/Firefox là Browser."}
            ];

            const form = document.getElementById('quiz-form');
            questions.forEach(q => {
                let html = `<div class="question-card" id="card-q${q.id}"><span class="topic-label">Câu ${q.id < 10 ? '0'+q.id : q.id}</span>`;
                html += `<div class="question-text">${q.q}</div>`;
                
                if (q.type === 'radio' || q.type === 'check') {
                    html += `<div class="options">`;
                    q.opts.forEach(o => {
                        let type = q.type === 'radio' ? 'radio' : 'checkbox';
                        html += `<label><input type="${type}" name="q${q.id}" value="${o.v}"> ${o.t}</label>`;
                    });
                    html += `</div>`;
                } else if (q.type === 'table' || q.type === 'match') {
                    html += `<table class="grid-table"><tr><th>Nội dung</th><th>${q.type==='table'?'Đúng/Sai':'Lựa chọn'}</th></tr>`;
                    q.rows.forEach((r, idx) => {
                        html += `<tr><td>${r.t}</td><td>`;
                        if(q.type === 'table') {
                            html += `<label style="display:inline;"><input type="radio" name="q${q.id}_${idx}" value="d"> Đúng</label> `;
                            html += `<label style="display:inline;"><input type="radio" name="q${q.id}_${idx}" value="s"> Sai</label>`;
                        } else {
                            html += `<select name="q${q.id}_${idx}"><option value="">--Chọn--</option>`;
                            // Hardcoded options for matching based on q21, q27, q35 specific logic in loop
                            if(q.id===21) html += `<option value="privacy">Riêng tư</option><option value="time">Thời gian</option><option value="gossip">Nói xấu</option><option value="caps">Viết hoa</option>`;
                            if(q.id===27) html += `<option value="reload">Tải lại</option><option value="navigate">Điều hướng</option><option value="bookmark">Dấu trang</option><option value="form">Biểu mẫu</option>`;
                            if(q.id===35) html += `<option value="comm">Giao tiếp</option><option value="info">Thông tin</option><option value="ent">Giải trí</option>`;
                            html += `</select>`;
                        }
                        html += `</td></tr>`;
                    });
                    html += `</table>`;
                } else if (q.type === 'match_inline') {
                    html += `<div style="margin-bottom:10px;">${q.txt.replace('[1]', `<select name="q${q.id}_1"><option value="">...</option><option value="reload">Tải lại</option><option value="navigate">Điều hướng</option><option value="bookmark">Dấu trang</option></select>`).replace('[2]', `<select name="q${q.id}_2"><option value="">...</option><option value="reload">Tải lại</option><option value="navigate">Điều hướng</option><option value="bookmark">Dấu trang</option></select>`)}</div>`;
                }

                html += `<div class="feedback-box"><span class="feedback-title">Đáp án đúng & Giải thích:</span>${q.explain}</div></div>`;
                form.innerHTML += html;
            });

            // LOGIC CHẤM ĐIỂM
            function gradeQuiz() {
                let score = 0;
                let total = questions.length;
                let allAnswered = true;
                let firstMissing = null;

                // Reset
                document.querySelectorAll('.question-card').forEach(c => c.classList.remove('incomplete'));
                document.querySelectorAll('.feedback-box').forEach(b => b.style.display = 'none');
                document.querySelectorAll('label, select').forEach(l => {
                    l.classList.remove('correct-answer', 'wrong-answer');
                    l.style.backgroundColor = ''; 
                    l.style.border = '';
                });

                // Validation Loop
                questions.forEach(q => {
                    let answered = false;
                    if(q.type === 'radio' || q.type === 'check') {
                        if(document.querySelector(`input[name="q${q.id}"]:checked`)) answered = true;
                    } else if (q.type === 'table' || q.type === 'match') {
                        let subCount = 0;
                        q.rows.forEach((r, idx) => {
                            if(q.type === 'table') { if(document.querySelector(`input[name="q${q.id}_${idx}"]:checked`)) subCount++; }
                            else { if(document.querySelector(`select[name="q${q.id}_${idx}"]`).value !== "") subCount++; }
                        });
                        if(subCount === q.rows.length) answered = true;
                    } else if (q.type === 'match_inline') {
                        if(document.querySelector(`select[name="q${q.id}_1"]`).value !== "" && document.querySelector(`select[name="q${q.id}_2"]`).value !== "") answered = true;
                    }

                    if(!answered) {
                        allAnswered = false;
                        let card = document.getElementById(`card-q${q.id}`);
                        card.classList.add('incomplete');
                        if(!firstMissing) firstMissing = card;
                    }
                });

                if(!allAnswered) {
                    alert("Vui lòng trả lời hết các câu hỏi!");
                    firstMissing.scrollIntoView({behavior: "smooth", block: "center"});
                    return;
                }

                // Grading Loop
                questions.forEach(q => {
                    let isCorrect = false;
                    let card = document.getElementById(`card-q${q.id}`);
                    
                    if(q.type === 'radio') {
                        let userVal = document.querySelector(`input[name="q${q.id}"]:checked`).value;
                        if(userVal === q.ans) isCorrect = true;
                        
                        // Style
                        document.querySelectorAll(`input[name="q${q.id}"]`).forEach(i => {
                            if(i.value === q.ans) i.parentElement.classList.add('correct-answer');
                            if(i.checked && i.value !== q.ans) i.parentElement.classList.add('wrong-answer');
                        });

                    } else if (q.type === 'check') {
                        let checked = Array.from(document.querySelectorAll(`input[name="q${q.id}"]:checked`)).map(i=>i.value);
                        if(JSON.stringify(checked.sort()) === JSON.stringify(q.ans.sort())) isCorrect = true;
                        
                        document.querySelectorAll(`input[name="q${q.id}"]`).forEach(i => {
                            if(q.ans.includes(i.value)) i.parentElement.classList.add('correct-answer');
                            if(i.checked && !q.ans.includes(i.value)) i.parentElement.classList.add('wrong-answer');
                        });

                    } else if (q.type === 'table') {
                        let subCorrect = 0;
                        q.rows.forEach((r, idx) => {
                            let val = document.querySelector(`input[name="q${q.id}_${idx}"]:checked`).value;
                            let rowInputs = document.querySelectorAll(`input[name="q${q.id}_${idx}"]`);
                            if(val === r.a) {
                                subCorrect++;
                                rowInputs.forEach(i => { if(i.checked) i.parentElement.parentElement.classList.add('correct-answer'); });
                            } else {
                                rowInputs.forEach(i => { 
                                    if(i.checked) i.parentElement.parentElement.classList.add('wrong-answer');
                                    if(i.value === r.a) i.parentElement.parentElement.style.border = "2px dashed #28a745";
                                });
                            }
                        });
                        if(subCorrect === q.rows.length) isCorrect = true;

                    } else if (q.type === 'match') {
                        let subCorrect = 0;
                        q.rows.forEach((r, idx) => {
                            let sel = document.querySelector(`select[name="q${q.id}_${idx}"]`);
                            if(sel.value === r.a) {
                                subCorrect++;
                                sel.classList.add('correct-answer');
                            } else {
                                sel.classList.add('wrong-answer');
                            }
                        });
                        if(subCorrect === q.rows.length) isCorrect = true;
                    } else if (q.type === 'match_inline') {
                        let s1 = document.querySelector(`select[name="q${q.id}_1"]`);
                        let s2 = document.querySelector(`select[name="q${q.id}_2"]`);
                        if(s1.value === q.ans[0]) s1.classList.add('correct-answer'); else s1.classList.add('wrong-answer');
                        if(s2.value === q.ans[1]) s2.classList.add('correct-answer'); else s2.classList.add('wrong-answer');
                        if(s1.value === q.ans[0] && s2.value === q.ans[1]) isCorrect = true;
                    }

                    if(isCorrect) score++;
                    card.querySelector('.feedback-box').style.display = 'block';
                });

                const res = document.getElementById('result-area');
                res.style.display = 'block';
                res.innerHTML = `Kết quả: ${score}/${total} câu đúng (${Math.round(score/total*100)}%)`;
                res.style.backgroundColor = (score/total >= 0.8) ? "#d4edda" : "#f8d7da";
                
                // Disable all inputs
                document.querySelectorAll('input, select').forEach(el => el.disabled = true);
                window.scrollTo({top:0, behavior:'smooth'});
            }
        </script>
        <button type="button" class="btn-submit" onclick="gradeQuiz()">NỘP BÀI</button>
        <div id="result-area"></div>
    </form>
