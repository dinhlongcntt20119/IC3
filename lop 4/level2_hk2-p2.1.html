<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lớp 4 - Level 2 | Kiến Thức Tổng Hợp - Phần 2.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Kanit:ital,wght@1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            /* TÔNG MÀU CAM LEVEL 2 */
            --primary-color: #ef6c00; /* Orange */
            --primary-dark: #e65100;  /* Darker Orange */
            --accent-color: #ff9800;  /* Lighter Orange */
            --bg-body: #fff8e1;       /* Cream background */
            --text-color: #3e2723;    /* Dark brown text */
            --border-color: #ffe0b2;
            
            --correct-bg: #d4edda;
            --correct-border: #28a745;
            --wrong-bg: #f8d7da;
            --wrong-border: #dc3545;
        }

        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-body); color: var(--text-color); margin: 0; padding: 0; }
        
        /* HEADER */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 1000; border-bottom: 4px solid #fff;
        }
        .header-left { display: flex; flex-direction: column; align-items: flex-start; }
        .logo-ic3 { font-family: 'Kanit', sans-serif; font-size: 2rem; font-weight: 800; font-style: italic; line-height: 1; }
        .logo-ic3 span:nth-child(1) { color: #fff; } 
        .logo-ic3 span:nth-child(2) { color: #ffe0b2; } /* Light orange text */
        
        .home-btn {
            margin-top: 8px; color: white; text-decoration: none; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.6);
            padding: 5px 15px; border-radius: 20px; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px;
        }
        .home-btn:hover { background: rgba(255,255,255,0.2); }
        .header-right { text-align: right; }
        .teacher-name { font-weight: 700; font-size: 1.1rem; display: block; }
        .sub-title { font-size: 0.9rem; opacity: 0.9; }

        /* CONTAINER */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        .page-title { text-align: center; margin-bottom: 40px; }
        .page-title h1 { color: var(--primary-dark); margin: 0; font-size: 2.2rem; text-transform: uppercase; font-weight: 800; }
        .page-title h2 { color: #5d4037; margin: 10px 0 0; font-size: 1.4rem; font-weight: bold; text-transform: uppercase; }

        /* QUESTION CARD */
        .question-card {
            background: white; border: 1px solid var(--border-color); border-radius: 12px; 
            margin-bottom: 30px; overflow: hidden; display: flex; flex-wrap: wrap;
            box-shadow: 0 4px 12px rgba(230, 81, 0, 0.08); /* Orange tinted shadow */
        }
        .question-card.incomplete { border: 2px solid var(--wrong-border); box-shadow: 0 0 10px rgba(220, 53, 69, 0.2); }

        .topic-col {
            background-color: var(--primary-dark); width: 140px; padding: 20px;
            display: flex; align-items: center; justify-content: center; text-align: center;
            font-weight: 700; color: white; flex-shrink: 0; font-size: 1.2rem; border-right: 1px solid #fff;
        }
        .content-col { flex-grow: 1; padding: 25px; width: calc(100% - 140px); background: #fff; }

        .question-text { font-weight: 700; font-size: 1.1rem; margin-bottom: 20px; color: var(--primary-dark); }

        /* OPTIONS */
        .options label {
            display: block; margin-bottom: 10px; cursor: pointer; padding: 12px 15px;
            border: 2px solid #fff3e0; border-radius: 8px; transition: 0.2s; position: relative;
        }
        .options label:hover { background-color: #fff3e0; border-color: var(--primary-color); }
        .options input { margin-right: 12px; transform: scale(1.3); vertical-align: middle; accent-color: var(--primary-color); }

        /* IMAGE GRID */
        .img-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .img-item { border: 2px solid #eee; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .img-item:hover { border-color: var(--primary-color); background: #fff3e0; }
        .img-item img { max-width: 100%; height: 120px; object-fit: contain; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto; }

        /* SINGLE IMAGE */
        .single-img { display: block; max-width: 100%; max-height: 400px; margin: 0 auto 20px auto; border-radius: 8px; border: 1px solid #ddd; }

        /* CUSTOM DOC PREVIEW (CSS ONLY) */
        .doc-preview {
            border: 1px solid #ccc;
            padding: 20px;
            background: #fff;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 20px auto;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            font-family: 'Times New Roman', serif;
            color: #000;
        }
        .doc-title { font-size: 1.5rem; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .doc-p { margin-bottom: 15px; line-height: 1.4; }
        .doc-list { margin-bottom: 15px; padding-left: 20px; }
        .doc-box { border: 1px dashed #999; padding: 10px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; }
        
        /* TABLES */
        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 15px; }
        .data-table { width: 100%; border-collapse: collapse; margin: 0; }
        .data-table th {
            background-color: var(--primary-color); color: white; padding: 15px; 
            text-align: center; font-weight: 700; border-bottom: 2px solid #fff;
        }
        .data-table td { border-bottom: 1px solid var(--border-color); padding: 15px; vertical-align: middle; }
        .data-table tr:nth-child(even) { background-color: #fff8e1; } /* Light cream for rows */
        .data-table tr:last-child td { border-bottom: none; }
        
        .data-table td:first-child { width: 60%; font-weight: 500; font-family: 'Times New Roman', serif; color: #000; }
        .data-table td:not(:first-child) { width: 20%; text-align: center; }

        .data-table select {
            width: 100%; padding: 10px; border: 1px solid #ffcc80; border-radius: 5px; 
            background: white; font-size: 0.95rem; cursor: pointer;
        }
        .data-table select:focus { outline: none; border-color: var(--primary-dark); }
        .data-table input[type="radio"] { transform: scale(1.5); cursor: pointer; accent-color: var(--primary-color); }

        /* FEEDBACK */
        .feedback { 
            margin-top: 20px; padding: 15px; background-color: #fff3cd; 
            border-left: 5px solid #ffc107; border-radius: 4px; 
            font-size: 0.95rem; color: #856404; display: none; line-height: 1.5;
        }
        .correct-opt { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; }
        .wrong-opt { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; }
        
        .correction { 
            display: block; margin-top: 8px; font-size: 0.9rem; font-weight: bold; 
            color: var(--wrong-border); background: rgba(255,255,255,0.9); padding: 5px; border-radius: 4px; border: 1px dashed var(--wrong-border);
        }

        .btn-submit {
            display: block; width: 250px; margin: 40px auto; padding: 18px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white; border: none; border-radius: 50px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(230, 81, 0, 0.4); transition: 0.3s;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(230, 81, 0, 0.6); }

        #result-area {
            text-align: center; font-size: 1.6rem; font-weight: bold; margin-top: 30px;
            padding: 30px; display: none; background: white; border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 2px solid var(--primary-color);
        }

        footer { background: var(--primary-dark); color: white; padding: 40px 20px; text-align: center; margin-top: 80px; }
        .footer-info { margin-top: 15px; font-size: 0.95rem; opacity: 0.9; }

        @media (max-width: 768px) {
            .question-card { flex-direction: column; }
            .topic-col { width: 100%; padding: 10px; justify-content: flex-start; border-right: none; border-bottom: 4px solid #ffcc80; }
            .content-col { width: 100%; padding: 15px; }
            .data-table td:first-child { width: 50%; }
            .data-table td:not(:first-child) { width: 25%; }
        }
    </style>
</head>

<script>
    const questions = [
        { id: 1, type: "radio", q: "Em hãy cho biết, chương trình nào sau đây sử dụng từ khóa để tìm kết quả trong các trang web trên internet?", opts: [{v: "a", t: "Trình chặn cửa sổ bật lên (Pop-up blocker)"}, {v: "b", t: "Diễn đàn (Forum)"}, {v: "c", t: "Phần mềm diệt virus (Anti-virus software)"}, {v: "d", t: "Công cụ tìm kiếm (Search engine)"}], ans: "d", explain: "Công cụ tìm kiếm (Search engine) là chương trình được thiết kế để tìm kiếm thông tin trên World Wide Web." },
        { id: 2, type: "check", q: "Em hãy cho biết, tùy chọn nào sau đây là đúng khi nói về tập tin đính kèm email? (Chọn 2)", opts: [{v: "a", t: "Em chỉ có thể đính kèm một tập tin cho mỗi email"}, {v: "b", t: "Không có giới hạn về kích thước của các tập tin đính kèm"}, {v: "c", t: "Người nhận email có thể chỉnh sửa các tập tin đính kèm"}, {v: "d", t: "Các tập tin như hình ảnh, video và tài liệu có thể được đính kèm"}], ans: ["c", "d"], explain: "Người nhận có thể tải xuống và chỉnh sửa file. Các định dạng phổ biến như ảnh, video, tài liệu đều đính kèm được." },
        { id: 3, type: "radio", q: "Em hãy cho biết điều nào sau đây là sự khác biệt giữa Wiki và Forum?", opts: [{v: "a", t: "Forum là một phần của trang web, trong khi Wiki tạo nên toàn bộ trang web"}, {v: "b", t: "Forum cho phép em nói về một chủ đề cụ thể trong khi Wiki thì không"}, {v: "c", t: "Wiki là một phần của trang web, trong khi Forum tạo nên toàn bộ trang web"}, {v: "d", t: "Wiki cho phép em nói về một chủ đề cụ thể trong khi Forum thì không"}], ans: "a", explain: "Wiki thường là cấu trúc của toàn bộ trang web nội dung (như Wikipedia), còn Forum thường là một mục thảo luận trong trang web." },
        { id: 4, type: "table_tf", q: "Với mỗi câu phát biểu về việc tinh chỉnh phạm vi tìm kiếm trên web, hãy chọn Đúng hoặc Sai.", headers: ["Đúng", "Sai"], rows: [{t: "Công cụ tìm kiếm thực hiện tìm theo đúng trình tự từ khóa mà bạn nhập vào", a: "no"}, {t: "Khi thêm từ \"or\" (hoặc), công cụ tìm kiếm sẽ kết hợp nhiều kết quả tìm kiếm thành một", a: "yes"}, {t: "Kết quả tìm kiếm trả phí (quảng cáo) trông giống các kết quả tìm kiếm không trả phí và được sắp xếp chung với nhau", a: "no"}], explain: "Tìm kiếm thông thường không bắt buộc đúng trình tự (trừ khi dùng ngoặc kép). Kết quả trả phí thường được đánh dấu riêng." },
        { id: 5, type: "radio", q: "Bạn nên làm gì nếu trang web chỉ tải được một nửa?", opts: [{v: "a", t: "Khởi động lại máy tính"}, {v: "b", t: "Dừng lại, tạm dừng, nói chuyện với người lớn"}, {v: "c", t: "Hãy thử lại vào một ngày khác"}, {v: "d", t: "Tải lại trang web"}], ans: "d", explain: "Tải lại trang (Refresh/Reload) là cách xử lý đầu tiên khi trang web hiển thị không đầy đủ." },
        { id: 6, type: "table_tf", q: "Với mỗi câu phát biểu về quy tắc chọn hình ảnh phù hợp trong tài liệu và bài trình chiếu, hãy chọn Đúng hoặc Sai.", headers: ["Đúng", "Sai"], rows: [{t: "Hình ảnh nên bị vỡ nét", a: "no"}, {t: "Hình ảnh nên liên quan đến chủ đề", a: "yes"}, {t: "Hình ảnh nên có dấu ẩn mờ (Watermark) từ các trang kho hình ảnh", a: "no"}], explain: "Hình ảnh cần rõ nét, liên quan chủ đề và không nên có watermark (bản quyền) nếu trình bày chuyên nghiệp." },
        { id: 7, type: "radio", q: "Bạn nên dùng loại định dạng nào để nhấn mạnh một từ trên trang web?", opts: [{v: "a", t: "Phông in đậm"}, {v: "b", t: "Danh sách đánh số"}, {v: "c", t: "Phông chữ nhỏ"}, {v: "d", t: "Gạch ngang giữa thân chữ (Strikethrough)"}], ans: "a", explain: "In đậm (Bold) là cách phổ biến nhất để nhấn mạnh từ ngữ." },
        { id: 8, type: "radio", q: "Bạn nên định dạng tiêu đề như thế nào để trông nổi bật hơn?", opts: [{v: "a", t: "Đổi định dạng thành in đậm"}, {v: "b", t: "Đính siêu liên kết (Hyperlink) vào tiêu đề"}, {v: "c", t: "Chuyển tiêu đề xuống cuối trang"}, {v: "d", t: "Giảm kích cỡ phông chữ"}], ans: "a", explain: "In đậm tiêu đề giúp nó nổi bật hơn so với văn bản thường." },
        
        // --- CHỦ ĐỀ 09 (CSS Only) ---

        { id: 10, type: "match", q: "Hãy di chuyển từng thuật ngữ về tạo nội dung từ danh sách ở bên phải sang định nghĩa tương ứng ở bên trái.", rows: [{t: "Tóm tắt các ý chính trong nội dung của bạn", a: "title"}, {t: "Tính năng cho phép người dùng căn đều từng dòng văn bản", a: "align"}, {t: "Một chuỗi các câu nói về một luận điểm hoặc chủ đề cụ thể", a: "para"}], opts: [{v: "title", t: "Tiêu đề (Title)"}, {v: "align", t: "Căn lề (Alignment)"}, {v: "para", t: "Đoạn văn (Paragraph)"}], explain: "Tóm tắt ý chính -> Tiêu đề. Căn đều -> Căn lề. Chuỗi câu -> Đoạn văn." },
        { id: 11, type: "match", q: "Hãy di chuyển từng thuật ngữ từ danh sách ở bên phải sang định nghĩa tương ứng ở bên trái.", rows: [{t: "Một đoạn mô tả ngắn về trang web, xuất hiện ở phía trên đầu cửa sổ trình duyệt", a: "title"}, {t: "Một trang đơn lẻ của một bài trình chiếu", a: "slide"}, {t: "Cách sắp xếp hoặc đặt vị trí văn bản", a: "align"}, {t: "Một tài liệu có thể hiển thị bằng trình duyệt", a: "page"}], opts: [{v: "title", t: "Tiêu đề (Title)"}, {v: "slide", t: "Trang chiếu (Slide)"}, {v: "align", t: "Căn lề (Alignment)"}, {v: "page", t: "Trang (Page)"}], explain: "Mô tả ngắn trên đầu -> Tiêu đề. Trang đơn lẻ -> Slide. Sắp xếp vị trí -> Căn lề. Tài liệu trên trình duyệt -> Web page." },

    function renderQuiz() {
        const form = document.getElementById('quiz-form');
        let html = '';
        questions.forEach((q, index) => {
            let label = q.id < 10 ? '0' + q.id : q.id;
            html += `<div class="question-card" id="card-${index}">
                <div class="topic-col">Chủ đề ${label}</div>
                <div class="content-col">
                    <div class="question-text">${q.q}</div>`;
            
            // LOGIC HIỂN THỊ MỚI: Ưu tiên customHtml -> img -> text
            if (q.customHtml) {
                html += q.customHtml;
            } else if (q.img) {
                html += `<img src="${q.img}" class="single-img" alt="HS tạm thời xem ảnh trong Sách">`;
            }

            if (q.type === 'radio' || q.type === 'img_radio') {
                html += `<div class="options">`;
                q.opts.forEach(opt => {
                    html += `<label><input type="radio" name="q${index}" value="${opt.v}"> ${opt.t}</label>`;
                });
                html += `</div>`;
            } else if (q.type === 'check') {
                html += `<div class="options">`;
                q.opts.forEach(opt => {
                    html += `<label><input type="checkbox" name="q${index}" value="${opt.v}"> ${opt.t}</label>`;
                });
                html += `</div>`;
            } else if (q.type === 'match') {
                html += `<div class="table-container"><table class="data-table"><thead><tr><th>Định nghĩa/Mô tả</th><th>Lựa chọn</th></tr></thead><tbody>`;
                q.rows.forEach((r, rIdx) => {
                    html += `<tr><td>${r.t}</td><td><select name="q${index}_${rIdx}"><option value="">-- Chọn --</option>`;
                    q.opts.forEach(opt => {
                        html += `<option value="${opt.v}">${opt.t}</option>`;
                    });
                    html += `</select></td></tr>`;
                });
                html += `</tbody></table></div>`;
            } else if (q.type === 'table_tf') {
                html += `<div class="table-container"><table class="data-table"><thead><tr><th>Nội dung</th><th>${q.headers[0]}</th><th>${q.headers[1]}</th></tr></thead><tbody>`;
                q.rows.forEach((r, rIdx) => {
                    html += `<tr><td>${r.t}</td>
                        <td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="yes"></td>
                        <td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="no"></td></tr>`;
                });
                html += `</tbody></table></div>`;
            }
            
            html += `<div class="feedback"><strong>Giải thích:</strong> ${q.explain}</div>
                </div>
            </div>`;
        });
        form.innerHTML = html;
    }

    function gradeQuiz() {
        let score = 0;
        let allAnswered = true;
        let firstUnanswered = null;

        document.querySelectorAll('.question-card').forEach(c => c.classList.remove('incomplete'));
        document.querySelectorAll('.feedback').forEach(f => f.style.display = 'none');
        document.querySelectorAll('.correct-opt, .wrong-opt').forEach(el => {
            el.classList.remove('correct-opt', 'wrong-opt');
            el.style.backgroundColor = ''; el.style.borderColor = ''; el.style.border = '';
        });
        document.querySelectorAll('.correction').forEach(el => el.remove());

        questions.forEach((q, index) => {
            let answered = false;
            if (q.type.includes('radio')) {
                if (document.querySelector(`input[name="q${index}"]:checked`)) answered = true;
            } else if (q.type.includes('check')) {
                if (document.querySelector(`input[name="q${index}"]:checked`)) answered = true;
            } else if (q.type === 'match' || q.type.includes('table')) {
                let subCount = 0;
                let totalRows = q.rows.length;
                if (q.type === 'match') {
                    q.rows.forEach((r, rIdx) => { if (document.getElementsByName(`q${index}_${rIdx}`)[0].value !== "") subCount++; });
                } else {
                    q.rows.forEach((r, rIdx) => { if (document.querySelector(`input[name="q${index}_${rIdx}"]:checked`)) subCount++; });
                }
                if (subCount === totalRows) answered = true;
            }

            if (!answered) {
                allAnswered = false;
                let card = document.getElementById(`card-${index}`);
                card.classList.add('incomplete');
                if (!firstUnanswered) firstUnanswered = card;
            }
        });

        if (!allAnswered) {
            alert("Vui lòng hoàn thành tất cả các câu hỏi trước khi nộp bài!");
            firstUnanswered.scrollIntoView({ behavior: "smooth", block: "center" });
            return;
        }

        questions.forEach((q, index) => {
            let isCorrect = false;
            if (q.type.includes('radio')) {
                let checked = document.querySelector(`input[name="q${index}"]:checked`);
                if (checked.value === q.ans) {
                    isCorrect = true;
                    checked.parentElement.classList.add('correct-opt');
                } else {
                    checked.parentElement.classList.add('wrong-opt');
                    let correctInput = document.querySelector(`input[name="q${index}"][value="${q.ans}"]`);
                    if(correctInput) correctInput.parentElement.style.border = "2px dashed #28a745";
                }
            } else if (q.type === 'check') {
                let checked = Array.from(document.querySelectorAll(`input[name="q${index}"]:checked`)).map(e => e.value);
                if (JSON.stringify(checked.sort()) === JSON.stringify(q.ans.sort())) isCorrect = true;
                document.querySelectorAll(`input[name="q${index}"]`).forEach(inp => {
                    if (q.ans.includes(inp.value)) inp.parentElement.classList.add('correct-opt');
                    if (inp.checked && !q.ans.includes(inp.value)) inp.parentElement.classList.add('wrong-opt');
                });
            } else if (q.type === 'match') {
                let subCorrect = 0;
                q.rows.forEach((r, rIdx) => {
                    let sel = document.getElementsByName(`q${index}_${rIdx}`)[0];
                    let userVal = sel.value;
                    let correctKey = r.a;
                    
                    if (userVal === correctKey) {
                        subCorrect++;
                        sel.style.borderColor = "#28a745";
                        sel.style.backgroundColor = "#d4edda";
                    } else {
                        sel.style.borderColor = "#dc3545";
                        sel.style.backgroundColor = "#f8d7da";
                    }
                });
                if (subCorrect === q.rows.length) isCorrect = true;
            } else if (q.type === 'table_tf') {
                let subCorrect = 0;
                q.rows.forEach((r, rIdx) => {
                    let checked = document.querySelector(`input[name="q${index}_${rIdx}"]:checked`);
                    let rightVal = r.a;
                    
                    if (checked.value === rightVal) {
                        subCorrect++;
                        checked.parentElement.style.backgroundColor = "#d4edda";
                    } else {
                        checked.parentElement.style.backgroundColor = "#f8d7da";
                        let correctInput = document.querySelector(`input[name="q${index}_${rIdx}"][value="${rightVal}"]`);
                        if (correctInput) correctInput.parentElement.style.border = "2px dashed #28a745";
                    }
                });
                if (subCorrect === q.rows.length) isCorrect = true;
            }

            if (isCorrect) score++;
            document.querySelector(`#card-${index} .feedback`).style.display = 'block';
        });

        let res = document.getElementById('result-area');
        res.style.display = 'block';
        let percent = Math.round((score / questions.length) * 100);
        res.innerHTML = `KẾT QUẢ: ${score} / ${questions.length} CÂU ĐÚNG (${percent}%)`;
        res.style.color = percent >= 80 ? '#ef6c00' : '#dc3545';
        res.style.borderColor = percent >= 80 ? '#ef6c00' : '#dc3545';

        document.querySelectorAll('input, select').forEach(el => el.disabled = true);
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    renderQuiz();
</script>
