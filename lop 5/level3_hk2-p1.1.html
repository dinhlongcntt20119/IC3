<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IC3 SPARK LEVEL 3 - KIẾN THỨC TỔNG HỢP (1.1)</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Kanit:ital,wght@1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-blue: #234585; --accent-yellow: #ffc107; --bg-color: #f0f4f8; --success-color: #d4edda; --error-color: #f8d7da; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: #333; line-height: 1.6; margin: 0; }
        header { background: var(--primary-blue); color: white; padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent-yellow); position: sticky; top: 0; z-index: 1000; }
        .home-btn { background: rgba(255,255,255,0.2); color: white; text-decoration: none; padding: 6px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.4); display: flex; align-items: center; gap: 5px; }
        .logo-ic3 { font-family: 'Kanit', sans-serif; font-size: 1.8rem; font-style: italic; font-weight: 800; }
        .logo-ic3 span:nth-child(1) { color: #4CAF50; -webkit-text-stroke: 1px white; } 
        .logo-ic3 span:nth-child(2) { color: #222; opacity: 0.7; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .question-card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 25px; border: 1px solid #e1e8ed; }
        .question-card.incomplete { border: 2px solid #dc3545; box-shadow: 0 0 8px rgba(220,53,69,0.4); }
        .topic-label { position: absolute; top: -12px; left: 20px; background: #2a5298; color: white; padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        .question-text { font-weight: 700; margin-bottom: 15px; color: #2c3e50; }
        .options label { display: block; padding: 10px; margin-bottom: 8px; border: 1px solid #eee; border-radius: 8px; cursor: pointer; }
        .grid-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .grid-table td, .grid-table th { border: 1px solid #dee2e6; padding: 8px; text-align: center; }
        .correct-answer { background-color: var(--success-color) !important; border: 1px solid #28a745 !important; }
        .wrong-answer { background-color: var(--error-color) !important; border: 1px solid #dc3545 !important; }
        .feedback-box { display: none; margin-top: 15px; padding: 15px; background: #eef2f7; border-left: 5px solid #28a745; }
        .btn-submit { display: block; width: 100%; padding: 18px; background: var(--primary-blue); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 30px; }
        #result-area { text-align: center; font-size: 1.4rem; font-weight: bold; margin-top: 30px; display: none; padding: 20px; border-radius: 8px; }
        footer { background: var(--primary-blue); color: white; padding: 30px; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>
<header>
    <div class="header-left"><a href="../index.html" class="home-btn"><i class="fas fa-home"></i> Trang chủ</a><div class="logo-ic3"><span>IC3</span><span>spark</span></div></div>
    <div>GV. Nguyễn Đình Bạch Long</div>
</header>
<div class="container">
    <div style="text-align:center;"><h1>KIẾN THỨC TỔNG HỢP - PHẦN 1.1</h1><p>Câu 01 - Câu 20</p></div>
    <form id="quiz-form">
        <script>
            const qData = [
                {id:1, q:"Khắc phục sự cố cơ bản?", type:"table", rows:[{t:"Khởi động lại",a:"c"},{t:"Ngắt nguồn tòa nhà",a:"k"},{t:"Tải lại trình duyệt",a:"c"},{t:"Kiểm tra cáp",a:"c"}], explain:"Khởi động lại, Refresh, Kiểm tra cáp là bước cơ bản."},
                {id:2, q:"Thành phần của URL?", type:"table", rows:[{t:"Giao thức",a:"c"},{t:"Tên miền",a:"c"},{t:"Chuỗi truy vấn",a:"c"},{t:"Neo (Anchor)",a:"c"}], explain:"Tất cả đều là thành phần cấu tạo URL."},
                {id:3, q:"Bước lấy thông tin trực tuyến?", type:"table", rows:[{t:"Nhập URL",a:"c"},{t:"Khởi động lại máy",a:"k"},{t:"Máy chủ trả về thông tin",a:"c"},{t:"URL phân giải IP",a:"c"}], explain:"Khởi động lại không phải là bước lấy thông tin."},
                {id:4, q:"USB Drive dùng để làm gì?", type:"radio", opts:[{v:"a",t:"Lưu trữ và truyền dữ liệu"},{v:"b",t:"Gửi SMS"},{v:"c",t:"Chụp ảnh"},{v:"d",t:"Chơi game"}], ans:"a", explain:"Lưu trữ dữ liệu."},
                {id:5, q:"Cài đặt nào cho phép theo dõi vị trí?", type:"radio", opts:[{v:"a",t:"Độ sáng"},{v:"b",t:"Thông báo"},{v:"c",t:"Wifi"},{v:"d",t:"Vị trí (Location)"}], ans:"d", explain:"Cài đặt Vị trí (Location Services)."},
                {id:6, q:"Giao thức kết nối an toàn?", type:"radio", opts:[{v:"a",t:"SMTP"},{v:"b",t:"HTTPS"},{v:"c",t:"FTP"},{v:"d",t:"HTTP"}], ans:"b", explain:"HTTPS (Secure)."},
                {id:7, q:"Thiết bị âm thanh không hoạt động?", type:"radio", opts:[{v:"a",t:"Kiểm tra âm lượng"},{v:"b",t:"Thay thế"},{v:"c",t:"Cài card mới"},{v:"d",t:"Chỉnh độ sáng"}], ans:"a", explain:"Kiểm tra âm lượng hoặc nút Mute trước tiên."},
                {id:8, q:"KHÔNG phải phần của URL?", type:"radio", opts:[{v:"a",t:"Subdomain"},{v:"b",t:"Domain"},{v:"c",t:"IP Address"},{v:"d",t:"Protocol"}], ans:"c", explain:"IP là địa chỉ số, URL là địa chỉ chữ. Tuy URL phân giải ra IP nhưng IP không phải là 'một phần' trong chuỗi URL thông thường."},
                {id:9, q:"Mục đích địa chỉ IP?", type:"radio", opts:[{v:"a",t:"Gửi email"},{v:"b",t:"Chơi nhạc"},{v:"c",t:"Xác định vị trí trang web/thiết bị"},{v:"d",t:"Điều khiển chuột"}], ans:"c", explain:"Định danh và xác định vị trí trên mạng."},
                {id:10, q:"Tên miền tin tưởng cho du lịch?", type:"radio", opts:[{v:"a",t:".net"},{v:"b",t:".gov"},{v:"c",t:".xyz"},{v:"d",t:".com"}], ans:"b", explain:".gov là chính phủ, thông tin du lịch chính thống thường tin cậy."},
                {id:11, q:"Không kết nối được wifi tại nhà?", type:"radio", opts:[{v:"a",t:"Di chuyển lại gần Router"},{v:"b",t:"Thay pin"},{v:"c",t:"Tắt bluetooth"},{v:"d",t:"Reset adapter"}], ans:"a", explain:"Thử lại gần nguồn phát sóng trước."},
                {id:12, q:"Khả năng tiếp cận (Accessibility)?", type:"radio", opts:[{v:"a",t:"Lưu đám mây"},{v:"b",t:"Kết nối mạng"},{v:"c",t:"Dễ sử dụng cho người khuyết tật"},{v:"d",t:"Gửi dữ liệu"}], ans:"c", explain:"Công nghệ hỗ trợ người khuyết tật."},
                {id:13, q:"Mục đích IP (lặp lại)?", type:"radio", opts:[{v:"a",t:"Xác định thiết bị trên mạng"},{v:"b",t:"Email"},{v:"c",t:"Vị trí vật lý"},{v:"d",t:"Thông tin cá nhân"}], ans:"a", explain:"Identify devices."},
                {id:14, q:"Internet là gì?", type:"radio", opts:[{v:"a",t:"Mạng lưới toàn cầu"},{v:"b",t:"Vị trí vật lý"},{v:"c",t:"Điện thoại"},{v:"d",t:"Trình duyệt"}], ans:"a", explain:"Global network."},
                {id:15, q:"Lợi ích Cloud?", type:"radio", opts:[{v:"a",t:"Đồng bộ hóa"},{v:"b",t:"Truy cập 1 thiết bị"},{v:"c",t:"Bản in giấy"},{v:"d",t:"Truy cập không cần phép"}], ans:"a", explain:"Sync across devices."},
                {id:16, q:"Nguồn thu thập dữ liệu?", type:"table", rows:[{t:"Google",a:"c"},{t:"GPS ô tô",a:"c"},{t:"Smartphone",a:"c"},{t:"MXH",a:"c"}], explain:"Tất cả đều thu thập dữ liệu người dùng."},
                {id:17, q:"Tính năng USB?", type:"table", rows:[{t:"Mang theo được",a:"c"},{t:"Lưu trữ",a:"c"},{t:"Truyền tập tin",a:"c"},{t:"Kết nối không dây",a:"k"}], explain:"USB cắm trực tiếp, không không dây."},
                {id:18, q:"Mô tả USB Drive?", type:"radio", opts:[{v:"a",t:"Không gian ổ cứng"},{v:"b",t:"CSDL online"},{v:"c",t:"Thiết bị lưu trữ dạng cắm"},{v:"d",t:"Bộ nhớ đám mây"}], ans:"c", explain:"Plug-in device."},
                {id:19, q:"Công nghệ khả thi?", type:"table", rows:[{t:"Công nhân mỏ nhận dữ liệu",a:"c"},{t:"Y tá làm việc từ xa",a:"c"},{t:"Máy học sáng tác nhạc",a:"c"}], explain:"Công nghệ hiện đại cho phép tất cả."},
                {id:20, q:"Bit dữ liệu nhỏ web thu thập?", type:"radio", opts:[{v:"a",t:"Cookies"},{v:"b",t:"Bảng tính"},{v:"c",t:"Hacking"},{v:"d",t:"Dữ liệu"}], ans:"a", explain:"Cookies."}
            ];
            
            // Render Questions (Tái sử dụng logic render từ file level2)
            const form = document.getElementById('quiz-form');
            qData.forEach(q => {
                let h = `<div class="question-card" id="c${q.id}"><span class="topic-label">Chủ đề ${q.id}</span><div class="question-text">${q.q}</div>`;
                if(q.type==='radio'){
                    h+=`<div class="options">`;
                    q.opts.forEach(o=>h+=`<label><input type="radio" name="q${q.id}" value="${o.v}"> ${o.t}</label>`);
                    h+=`</div>`;
                } else if(q.type==='table'){
                    h+=`<table class="grid-table"><tr><th>Nội dung</th><th>${q.id===1||q.id===17?'Có/Không':(q.id===16?'Có/Không':'Đúng/Sai')}</th></tr>`;
                    q.rows.forEach((r,i)=>h+=`<tr><td>${r.t}</td><td><label style="display:inline"><input type="radio" name="q${q.id}_${i}" value="${r.a==='c'?'c':'d'}"> ${q.id===1||q.id===3||q.id===16||q.id===17||q.id===19?'Có':'Đúng'}</label> <label style="display:inline"><input type="radio" name="q${q.id}_${i}" value="${r.a==='c'?'k':'s'}"> ${q.id===1||q.id===3||q.id===16||q.id===17||q.id===19?'Không':'Sai'}</label></td></tr>`);
                    h+=`</table>`;
                }
                h+=`<div class="feedback-box"><strong>Đáp án:</strong> ${q.explain}</div></div>`;
                form.innerHTML+=h;
            });

            function gradeQuiz(){
                let score=0; let all=true; let firstMiss=null;
                document.querySelectorAll('.question-card').forEach(c=>c.classList.remove('incomplete'));
                document.querySelectorAll('.feedback-box').forEach(b=>b.style.display='none');
                
                qData.forEach(q=>{
                    let ans=false;
                    if(q.type==='radio'){
                        if(document.querySelector(`input[name="q${q.id}"]:checked`)) ans=true;
                    } else {
                        let sub=0; q.rows.forEach((r,i)=>{ if(document.querySelector(`input[name="q${q.id}_${i}"]:checked`)) sub++; });
                        if(sub===q.rows.length) ans=true;
                    }
                    if(!ans){ all=false; let c=document.getElementById(`c${q.id}`); c.classList.add('incomplete'); if(!firstMiss) firstMiss=c; }
                });

                if(!all){ alert('Vui lòng làm hết bài!'); firstMiss.scrollIntoView({behavior:'smooth',block:'center'}); return; }

                qData.forEach(q=>{
                    let corr=false;
                    if(q.type==='radio'){
                        let v = document.querySelector(`input[name="q${q.id}"]:checked`).value;
                        if(v===q.ans) corr=true;
                        document.querySelectorAll(`input[name="q${q.id}"]`).forEach(i=>{
                            if(i.value===q.ans) i.parentElement.classList.add('correct-answer');
                            else if(i.checked) i.parentElement.classList.add('wrong-answer');
                        });
                    } else {
                        let subC=0;
                        q.rows.forEach((r,i)=>{
                            let v = document.querySelector(`input[name="q${q.id}_${i}"]:checked`).value;
                            // Logic: value 'c'/'d' is correct group, 'k'/'s' is wrong group.
                            // Data uses 'c' for yes/correct in logic.
                            let isTrue = (r.a==='c'||r.a==='d'); 
                            // Input values: first option is always 'c'/'d', second is 'k'/'s'
                            let userVal = document.querySelector(`input[name="q${q.id}_${i}"]:checked`);
                            // Check logic map
                            let correctVal = isTrue ? (q.id===1||q.id===3||q.id===16||q.id===17||q.id===19?'c':'d') : (q.id===1||q.id===3||q.id===16||q.id===17||q.id===19?'k':'s');
                            
                            if(userVal.value === correctVal) subC++;
                            // Style
                            document.querySelectorAll(`input[name="q${q.id}_${i}"]`).forEach(inp=>{
                                if(inp.value === correctVal) inp.parentElement.classList.add('correct-answer');
                                else if(inp.checked) inp.parentElement.classList.add('wrong-answer');
                            });
                        });
                        if(subC===q.rows.length) corr=true;
                    }
                    if(corr) score++;
                    document.querySelector(`#c${q.id} .feedback-box`).style.display='block';
                });

                let r = document.getElementById('result-area');
                r.style.display='block';
                r.innerHTML=`Kết quả: ${score}/${qData.length} câu đúng`;
                r.style.backgroundColor = score/qData.length >= 0.8 ? '#d4edda':'#f8d7da';
                window.scrollTo({top:0,behavior:'smooth'});
                document.querySelectorAll('input').forEach(i=>i.disabled=true);
            }
        </script>
        <button type="button" class="btn-submit" onclick="gradeQuiz()">NỘP BÀI</button>
        <div id="result-area"></div>
    </form>
</div>
<footer><p>© 2026 - GV Nguyễn Đình Bạch Long</p></footer>
</body>
</html>
