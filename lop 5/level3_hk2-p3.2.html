    function renderQuestions() {
        const form = document.getElementById('quiz-form');
        let html = '';
        questions.forEach(q => {
            html += `<div class="question-card" id="c${q.id}">
                <span class="topic-label">Chủ đề ${q.id}</span>
                <div class="question-text">${q.q}</div>`;
            
            if (q.type === 'radio') {
                html += `<div class="options">`;
                q.opts.forEach(opt => {
                    html += `<label><input type="radio" name="q${q.id}" value="${opt.v}"> ${opt.t}</label>`;
                });
                html += `</div>`;
            } else if (q.type === 'table') {
                const isTrueFalse = q.rows[0].a === 'd' || q.rows[0].a === 's';
                const col1 = isTrueFalse ? "Đúng" : "Có";
                const col2 = isTrueFalse ? "Sai" : "Không";
                
                html += `<table class="grid-table">
                    <tr><th>Nội dung</th><th>${col1} / ${col2}</th></tr>`;
                q.rows.forEach((r, idx) => {
                    const val1 = (r.a === 'c' || r.a === 'd') ? r.a : (isTrueFalse ? 's' : 'k'); // Value for Correct col
                    const val2 = (r.a === 'k' || r.a === 's') ? r.a : (isTrueFalse ? 'd' : 'c'); // Value for Wrong col
                    // Actually simplier: Input 1 value is always 'yes/true', Input 2 is 'no/false'. We check against r.a
                    html += `<tr>
                        <td>${r.t}</td>
                        <td>
                            <label style="display:inline-block; margin-right:10px;"><input type="radio" name="q${q.id}_${idx}" value="${isTrueFalse?'d':'c'}"> ${col1}</label>
                            <label style="display:inline-block;"><input type="radio" name="q${q.id}_${idx}" value="${isTrueFalse?'s':'k'}"> ${col2}</label>
                        </td>
                    </tr>`;
                });
                html += `</table>`;
            } else if (q.type === 'match') {
                html += `<table class="grid-table"><tr><th>Nội dung</th><th>Lựa chọn</th></tr>`;
                q.rows.forEach((r, idx) => {
                    html += `<tr><td>${r.t}</td><td>
                        <select name="q${q.id}_${idx}">
                            <option value="">-- Chọn --</option>`;
                    for (const [key, val] of Object.entries(q.options)) {
                        html += `<option value="${key}">${val}</option>`;
                    }
                    html += `</select></td></tr>`;
                });
                html += `</table>`;
            } else if (q.type === 'match_inline') {
                // Specific manual construction for inline selects
                let content = q.txt;
                if(q.id === 25) {
                    content = content.replace('[1]', `<select name="q${q.id}_1" style="display:inline-block; width:auto; margin:5px;"><option value="">...</option><option value="company">thebeautysalonnet@gmail.com</option><option value="wrong">companypro.net@gmail.com</option><option value="wrong">myhealthyeats.com</option></select>`);
                    content = content.replace('[2]', `<select name="q${q.id}_2" style="display:inline-block; width:auto; margin:5px;"><option value="">...</option><option value="subject_pro">Cần hỗ trợ dự án của trường</option><option value="subject_rude">Hãy giúp ngay</option></select>`);
                }
                html += `<div style="background:#f9f9f9; padding:15px; line-height:2;">${content}</div>`;
            }

            html += `<div class="feedback-box"><span class="feedback-title">Đáp án & Giải thích:</span>${q.explain}</div>
            </div>`;
        });
        form.innerHTML = html;
    }

    function gradeQuiz() {
        let score = 0;
        let allAnswered = true;
        let firstMissing = null;

        // Reset UI
        document.querySelectorAll('.question-card').forEach(c => c.classList.remove('incomplete'));
        document.querySelectorAll('.feedback-box').forEach(b => b.style.display = 'none');
        document.querySelectorAll('.correct-answer, .wrong-answer').forEach(el => el.classList.remove('correct-answer', 'wrong-answer'));

        // Validation
        questions.forEach(q => {
            let answered = false;
            if (q.type === 'radio') {
                if (document.querySelector(`input[name="q${q.id}"]:checked`)) answered = true;
            } else if (q.type === 'table') {
                let count = 0;
                q.rows.forEach((r, idx) => {
                    if (document.querySelector(`input[name="q${q.id}_${idx}"]:checked`)) count++;
                });
                if (count === q.rows.length) answered = true;
            } else if (q.type === 'match') {
                let count = 0;
                q.rows.forEach((r, idx) => {
                    if (document.querySelector(`select[name="q${q.id}_${idx}"]`).value !== "") count++;
                });
                if (count === q.rows.length) answered = true;
            } else if (q.type === 'match_inline') {
                if (q.id === 25) {
                    if(document.querySelector(`select[name="q${q.id}_1"]`).value !== "" && document.querySelector(`select[name="q${q.id}_2"]`).value !== "") answered = true;
                }
            }

            if (!answered) {
                allAnswered = false;
                const card = document.getElementById(`c${q.id}`);
                card.classList.add('incomplete');
                if (!firstMissing) firstMissing = card;
            }
        });

        if (!allAnswered) {
            alert("Vui lòng trả lời tất cả các câu hỏi!");
            firstMissing.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        // Grading
        questions.forEach(q => {
            let isCorrect = false;
            if (q.type === 'radio') {
                const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
                if (selected.value === q.ans) {
                    isCorrect = true;
                    selected.parentElement.classList.add('correct-answer');
                } else {
                    selected.parentElement.classList.add('wrong-answer');
                    // Highlight correct
                    document.querySelector(`input[name="q${q.id}"][value="${q.ans}"]`).parentElement.style.border = "2px dashed #28a745";
                }
            } else if (q.type === 'table') {
                let subScore = 0;
                q.rows.forEach((r, idx) => {
                    const selected = document.querySelector(`input[name="q${q.id}_${idx}"]:checked`);
                    if (selected.value === r.a) {
                        subScore++;
                        selected.parentElement.classList.add('correct-answer');
                    } else {
                        selected.parentElement.classList.add('wrong-answer');
                        // Find correct label to highlight
                        const inputs = document.getElementsByName(`q${q.id}_${idx}`);
                        for(let i of inputs) { if(i.value === r.a) i.parentElement.style.border = "2px dashed #28a745"; }
                    }
                });
                if (subScore === q.rows.length) isCorrect = true;
            } else if (q.type === 'match') {
                let subScore = 0;
                q.rows.forEach((r, idx) => {
                    const el = document.querySelector(`select[name="q${q.id}_${idx}"]`);
                    if (el.value === r.a) {
                        subScore++;
                        el.classList.add('correct-answer');
                    } else {
                        el.classList.add('wrong-answer');
                    }
                });
                if (subScore === q.rows.length) isCorrect = true;
            } else if (q.type === 'match_inline') {
                if(q.id === 25) {
                    const s1 = document.querySelector(`select[name="q${q.id}_1"]`);
                    const s2 = document.querySelector(`select[name="q${q.id}_2"]`);
                    if(s1.value === q.ans[0]) s1.classList.add('correct-answer'); else s1.classList.add('wrong-answer');
                    if(s2.value === q.ans[1]) s2.classList.add('correct-answer'); else s2.classList.add('wrong-answer');
                    if(s1.value === q.ans[0] && s2.value === q.ans[1]) isCorrect = true;
                }
            }

            if (isCorrect) score++;
            document.querySelector(`#c${q.id} .feedback-box`).style.display = 'block';
        });

        // Result
        const res = document.getElementById('result-area');
        res.style.display = 'block';
        res.innerHTML = `Kết quả: ${score}/${questions.length} câu đúng`;
        res.style.backgroundColor = (score/questions.length >= 0.8) ? "#d4edda" : "#f8d7da";
        
        // Disable inputs
        document.querySelectorAll('input, select').forEach(el => el.disabled = true);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize
    renderQuestions();
</script>
