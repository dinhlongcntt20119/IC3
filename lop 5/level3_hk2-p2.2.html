<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>IC3 SPARK LEVEL 3 - KIẾN THỨC TỔNG HỢP (2.2)</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Kanit:ital,wght@1,800&display=swap" rel="stylesheet">
    <style>
        :root { --primary-blue: #234585; --accent-yellow: #ffc107; --bg-color: #f0f4f8; --success-color: #d4edda; --error-color: #f8d7da; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: #333; margin: 0; }
        header { background: var(--primary-blue); color: white; padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent-yellow); position: sticky; top: 0; z-index: 1000; }
        .home-btn { background: rgba(255,255,255,0.2); color: white; padding: 6px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.4); text-decoration: none; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .question-card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 25px; border: 1px solid #e1e8ed; }
        .question-card.incomplete { border: 2px solid #dc3545; }
        .topic-label { position: absolute; top: -12px; left: 20px; background: #2a5298; color: white; padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        .question-text { font-weight: 700; margin-bottom: 15px; }
        .options label { display: block; padding: 10px; margin-bottom: 8px; border: 1px solid #eee; border-radius: 8px; cursor: pointer; }
        .grid-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .grid-table td, .grid-table th { border: 1px solid #dee2e6; padding: 8px; text-align: center; }
        .correct-answer { background-color: var(--success-color) !important; border: 1px solid #28a745 !important; }
        .wrong-answer { background-color: var(--error-color) !important; border: 1px solid #dc3545 !important; }
        .feedback-box { display: none; margin-top: 15px; padding: 15px; background: #eef2f7; border-left: 5px solid #28a745; }
        .btn-submit { display: block; width: 100%; padding: 18px; background: var(--primary-blue); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 30px; }
        #result-area { text-align: center; font-size: 1.4rem; font-weight: bold; margin-top: 30px; display: none; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
<header>
    <div class="header-left"><a href="../index.html" class="home-btn">Trang chủ</a></div>
    <div>GV. Nguyễn Đình Bạch Long</div>
</header>
<div class="container">
    <div style="text-align:center;"><h1>KIẾN THỨC TỔNG HỢP - PHẦN 2.2</h1><p>Câu 21 - Câu 42</p></div>
    <form id="quiz-form">
        <script>
            const qData = [
                {id:21, q:"Trả lời câu hỏi Vì sao/Như thế nào?", type:"radio", opts:[{v:"a",t:"Thông tin"},{v:"b",t:"Kiến thức"},{v:"c",t:"Cộng tác"},{v:"d",t:"Dữ liệu"}], ans:"b", explain:"Kiến thức (Knowledge)."},
                {id:22, q:"Mục tiêu Creative Commons?", type:"radio", opts:[{v:"a",t:"Phân phối tự do"},{v:"b",t:"Áp dụng luật"},{v:"c",t:"Giới hạn"},{v:"d",t:"Độc quyền"}], ans:"a", explain:"Chia sẻ quyền sử dụng."},
                {id:23, q:"Điền từ:", type:"match_inline", txt:"[1] giao tiếp là bộ quy tắc.", ans:["protocol"], explain:"Giao thức (Protocol)."},
                {id:24, q:"Nguồn tin cậy?", type:"table", rows:[{t:"National Geographic",a:"c"},{t:"Không trích dẫn",a:"k"},{t:"Nghiên cứu nhiều nguồn",a:"c"}], explain:"NatGeo và nghiên cứu kỹ lưỡng là tin cậy."},
                {id:25, q:"Tác giả trang web ở đâu?", type:"radio", opts:[{v:"a",t:"Hỗ trợ"},{v:"b",t:"URL"},{v:"c",t:"About us/Team"},{v:"d",t:"SĐT"}], ans:"c", explain:"Mục Giới thiệu/Về chúng tôi."},
                {id:26, q:"Mục đích Creative Commons?", type:"radio", opts:[{v:"a",t:"Sao chép không ghi công"},{v:"b",t:"Trao quyền sử dụng"},{v:"c",t:"Chỉnh sửa bán"},{v:"d",t:"Từ bỏ quyền"}], ans:"b", explain:"Cấp quyền sử dụng hợp pháp."},
                {id:27, q:"Nguồn tin cậy?", type:"table", rows:[{t:"Đại học .com",a:"k"},{t:"Quá cũ (1989)",a:"k"},{t:"Được 2 nguồn khác đồng ý",a:"c"}], explain:"Đồng thuận từ nhiều nguồn tăng độ tin cậy."},
                {id:28, q:"Ghép dữ liệu/thông tin:", type:"match", rows:[{t:"Áo trắng không hấp thụ nhiệt (Lý giải)",a:"know"},{t:"Màu trắng (Thô)",a:"data"},{t:"Áo có màu trắng (Ngữ cảnh)",a:"info"}], explain:"Data: Thô, Info: Có ngữ cảnh, Know: Hiểu biết/Quy luật."},
                {id:29, q:"Mục đích trích dẫn?", type:"radio", opts:[{v:"a",t:"Thêm trang"},{v:"b",t:"Ghi công & tránh đạo văn"},{v:"c",t:"Thể hiện kiến thức"},{v:"d",t:"Làm đẹp"}], ans:"b", explain:"Tôn trọng bản quyền."},
                {id:30, q:"Thông tin trong trích dẫn sách? (Chọn 3)", type:"check", opts:[{v:"a",t:"Số trang"},{v:"b",t:"File"},{v:"c",t:"URL"},{v:"d",t:"Nhà xuất bản"},{v:"e",t:"Tiêu đề"},{v:"f",t:"Tác giả"}], ans:["d","e","f"], explain:"Tác giả, Tiêu đề, Nhà xuất bản."},
                {id:31, q:"Tổ chức cấp quyền miễn phí?", type:"radio", opts:[{v:"a",t:"Wix"},{v:"b",t:"Shutterstock"},{v:"c",t:"Creative Commons"},{v:"d",t:"Canva"}], ans:"c", explain:"Creative Commons."},
                {id:32, q:"Ghép thuật ngữ:", type:"match", rows:[{t:"Bảo vệ pháp lý",a:"copyright"},{t:"Cách nhìn nhận",a:"perspective"},{t:"Mức độ hữu ích",a:"relevance"},{t:"Độ tin cậy",a:"credibility"}], explain:"Copyright, Perspective, Relevance, Credibility."},
                {id:33, q:"Ứng dụng bảng tính?", type:"radio", opts:[{v:"a",t:"Teams"},{v:"b",t:"Google Sheets"},{v:"c",t:"TextEdit"},{v:"d",t:"Photoshop"}], ans:"b", explain:"Google Sheets/Excel."},
                {id:34, q:"Khi nào dùng trích dẫn?", type:"radio", opts:[{v:"a",t:"Tự vẽ"},{v:"b",t:"Đăng nội dung người khác"},{v:"c",t:"Phỏng vấn"},{v:"d",t:"Tự thiết kế"}], ans:"b", explain:"Khi sử dụng tác phẩm không phải của mình."},
                {id:35, q:"Biểu đồ so sánh phần trăm?", type:"radio", opts:[{v:"a",t:"Tròn (Pie)"},{v:"b",t:"Đường"},{v:"c",t:"Thanh"},{v:"d",t:"Cột"}], ans:"a", explain:"Biểu đồ tròn thể hiện tỷ lệ %."},
                {id:36, q:"Ai sở hữu ảnh trên mạng?", type:"radio", opts:[{v:"a",t:"Công cụ tìm kiếm"},{v:"b",t:"Người tạo/tải lên"},{v:"c",t:"Người viết chú thích"},{v:"d",t:"Trang web hiển thị"}], ans:"b", explain:"Chủ sở hữu gốc."},
                {id:37, q:"Cần trích dẫn không?", type:"table", rows:[{t:"Chúc mừng sinh nhật",a:"k"},{t:"Hình siêu anh hùng",a:"c"},{t:"Đoạn trích NatGeo",a:"c"}], explain:"Thông tin phổ biến không cần, tác phẩm sáng tạo cần."},
                {id:38, q:"Thông tin trích dẫn sách?", type:"radio", opts:[{v:"a",t:"Tên sách & Tác giả"},{v:"b",t:"Thư viện"},{v:"c",t:"Người giới thiệu"},{v:"d",t:"Bìa sách"}], ans:"a", explain:"Tên sách và Tác giả."},
                {id:39, q:"App tạo bảng tính?", type:"radio", opts:[{v:"a",t:"Google Sheets"},{v:"b",t:"PowerPoint"},{v:"c",t:"Illustrator"},{v:"d",t:"Pages"}], ans:"a", explain:"Google Sheets."},
                {id:40, q:"Ghép chủ sở hữu:", type:"match", rows:[{t:"Nghệ thuật số",a:"artist"},{t:"Blog",a:"author"},{t:"Email",a:"sender"}], explain:"Artist (Họa sĩ), Author (Tác giả), Sender (Người gửi)."},
                {id:41, q:"Ghép phím tắt:", type:"match", rows:[{t:"Dán",a:"paste"},{t:"Sao chép",a:"copy"},{t:"Chuyển app",a:"switch"}], explain:"Paste: Ctrl+V, Copy: Ctrl+C, Switch: Alt+Tab."},
                {id:42, q:"Ghép thuật ngữ:", type:"match", rows:[{t:"Thông tin nguồn ảnh",a:"citation"},{t:"Dùng như của mình",a:"plagiarism"},{t:"Gợi ý từ",a:"autocomplete"},{t:"Sửa lỗi",a:"autocorrect"}], explain:"Citation, Plagiarism, Autocomplete, Autocorrect."}
            ];

            const form = document.getElementById('quiz-form');
            qData.forEach(q => {
                let h = `<div class="question-card" id="c${q.id}"><span class="topic-label">Chủ đề ${q.id}</span><div class="question-text">${q.q}</div>`;
                if(q.type==='radio' || q.type==='check'){
                    h+=`<div class="options">`;
                    let t = q.type==='radio'?'radio':'checkbox';
                    q.opts.forEach(o=>h+=`<label><input type="${t}" name="q${q.id}" value="${o.v}"> ${o.t}</label>`);
                    h+=`</div>`;
                } else if(q.type==='table'){
                    h+=`<table class="grid-table"><tr><th>Nội dung</th><th>${q.id===37?'Có/Không':'Có/Không'}</th></tr>`;
                    q.rows.forEach((r,i)=>h+=`<tr><td>${r.t}</td><td><label style="display:inline"><input type="radio" name="q${q.id}_${i}" value="${r.a==='c'?'c':'k'}"> ${q.id===37?'Có':'Có'}</label> <label style="display:inline"><input type="radio" name="q${q.id}_${i}" value="${r.a==='c'?'k':'c'}"> ${q.id===37?'Không':'Không'}</label></td></tr>`);
                    h+=`</table>`;
                } else if(q.type==='match'){
                    h+=`<table class="grid-table"><tr><th>Nội dung</th><th>Lựa chọn</th></tr>`;
                    q.rows.forEach((r,i)=>{
                        h+=`<tr><td>${r.t}</td><td><select name="q${q.id}_${i}"><option value="">--Chọn--</option>`;
                        if(q.id===28) h+=`<option value="data">Dữ liệu</option><option value="info">Thông tin</option><option value="know">Kiến thức</option>`;
                        if(q.id===32) h+=`<option value="copyright">Bản quyền</option><option value="perspective">Quan điểm</option><option value="relevance">Liên quan</option><option value="credibility">Uy tín</option>`;
                        if(q.id===40) h+=`<option value="artist">Họa sĩ</option><option value="author">Tác giả</option><option value="sender">Người gửi</option>`;
                        if(q.id===41) h+=`<option value="paste">Ctrl+V</option><option value="copy">Ctrl+C</option><option value="switch">Alt+Tab</option>`;
                        if(q.id===42) h+=`<option value="citation">Trích dẫn</option><option value="plagiarism">Đạo văn</option><option value="autocomplete">Tự động hoàn tất</option><option value="autocorrect">Tự sửa</option>`;
                        h+=`</select></td></tr>`;
                    });
                    h+=`</table>`;
                } else if(q.type==='match_inline'){
                    h+=`<div>${q.txt.replace('[1]',`<select name="q${q.id}_1"><option value="">...</option><option value="protocol">Giao thức</option><option value="network">Mạng</option></select>`)}</div>`;
                }
                h+=`<div class="feedback-box"><strong>Đáp án:</strong> ${q.explain}</div></div>`;
                form.innerHTML+=h;
            });

            function gradeQuiz(){
                let score=0; let all=true; let firstMiss=null;
                document.querySelectorAll('.question-card').forEach(c=>c.classList.remove('incomplete'));
                document.querySelectorAll('.feedback-box').forEach(b=>b.style.display='none');
                
                qData.forEach(q=>{
                    let ans=false;
                    if(q.type==='radio' || q.type==='check'){ if(document.querySelector(`input[name="q${q.id}"]:checked`)) ans=true; }
                    else if(q.type==='table'){ let sub=0; q.rows.forEach((r,i)=>{ if(document.querySelector(`input[name="q${q.id}_${i}"]:checked`)) sub++; }); if(sub===q.rows.length) ans=true; }
                    else if(q.type==='match'){ let sub=0; q.rows.forEach((r,i)=>{ if(document.querySelector(`select[name="q${q.id}_${i}"]`).value!=='') sub++; }); if(sub===q.rows.length) ans=true; }
                    else if(q.type==='match_inline'){ if(document.querySelector(`select[name="q${q.id}_1"]`).value!=='') ans=true; }
                    if(!ans){ all=false; document.getElementById(`c${q.id}`).classList.add('incomplete'); if(!firstMiss) firstMiss=document.getElementById(`c${q.id}`); }
                });

                if(!all){ alert('Vui lòng làm hết bài!'); firstMiss.scrollIntoView({behavior:'smooth',block:'center'}); return; }

                qData.forEach(q=>{
                    let corr=false;
                    if(q.type==='radio'){
                        let v = document.querySelector(`input[name="q${q.id}"]:checked`).value;
                        if(v===q.ans) corr=true;
                        document.querySelectorAll(`input[name="q${q.id}"]`).forEach(i=>{ if(i.value===q.ans) i.parentElement.classList.add('correct-answer'); else if(i.checked) i.parentElement.classList.add('wrong-answer'); });
                    } else if(q.type==='check'){
                        let chk = Array.from(document.querySelectorAll(`input[name="q${q.id}"]:checked`)).map(i=>i.value);
                        if(JSON.stringify(chk.sort())===JSON.stringify(q.ans.sort())) corr=true;
                        document.querySelectorAll(`input[name="q${q.id}"]`).forEach(i=>{ if(q.ans.includes(i.value)) i.parentElement.classList.add('correct-answer'); else if(i.checked) i.parentElement.classList.add('wrong-answer'); });
                    } else if(q.type==='table'){
                        let subC=0;
                        q.rows.forEach((r,i)=>{
                            let v = document.querySelector(`input[name="q${q.id}_${i}"]:checked`).value;
                            let rightVal = r.a==='c'?'c':'k';
                            if(v===rightVal) subC++;
                            document.querySelectorAll(`input[name="q${q.id}_${i}"]`).forEach(inp=>{ if(inp.value===rightVal) inp.parentElement.classList.add('correct-answer'); else if(inp.checked) inp.parentElement.classList.add('wrong-answer'); });
                        });
                        if(subC===q.rows.length) corr=true;
                    } else if(q.type==='match'){
                        let subC=0;
                        q.rows.forEach((r,i)=>{
                            let s = document.querySelector(`select[name="q${q.id}_${i}"]`);
                            if(s.value===r.a) { subC++; s.classList.add('correct-answer'); } else s.classList.add('wrong-answer');
                        });
                        if(subC===q.rows.length) corr=true;
                    } else if(q.type==='match_inline'){
                        let s = document.querySelector(`select[name="q${q.id}_1"]`);
                        if(s.value===q.ans[0]) { corr=true; s.classList.add('correct-answer'); } else s.classList.add('wrong-answer');
                    }
                    if(corr) score++;
                    document.querySelector(`#c${q.id} .feedback-box`).style.display='block';
                });

                let r = document.getElementById('result-area');
                r.style.display='block';
                r.innerHTML=`Kết quả: ${score}/${qData.length} câu đúng`;
                r.style.backgroundColor = score/qData.length >= 0.8 ? '#d4edda':'#f8d7da';
                window.scrollTo({top:0,behavior:'smooth'});
                document.querySelectorAll('input, select').forEach(i=>i.disabled=true);
            }
        </script>
        <button type="button" class="btn-submit" onclick="gradeQuiz()">NỘP BÀI</button>
        <div id="result-area"></div>
    </form>
</div>
<footer><p>© 2026 - GV Nguyễn Đình Bạch Long</p></footer>
</body>
</html>
