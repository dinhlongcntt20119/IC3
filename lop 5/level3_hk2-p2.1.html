<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>IC3 SPARK LEVEL 3 - KIẾN THỨC TỔNG HỢP (2.1)</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Kanit:ital,wght@1,800&display=swap" rel="stylesheet">
    <style>
        :root { --primary-blue: #234585; --accent-yellow: #ffc107; --bg-color: #f0f4f8; --success-color: #d4edda; --error-color: #f8d7da; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: #333; margin: 0; }
        header { background: var(--primary-blue); color: white; padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent-yellow); position: sticky; top: 0; z-index: 1000; }
        .home-btn { background: rgba(255,255,255,0.2); color: white; padding: 6px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.4); text-decoration: none; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .question-card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 25px; border: 1px solid #e1e8ed; }
        .question-card.incomplete { border: 2px solid #dc3545; }
        .topic-label { position: absolute; top: -12px; left: 20px; background: #2a5298; color: white; padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        .question-text { font-weight: 700; margin-bottom: 15px; }
        .options label { display: block; padding: 10px; margin-bottom: 8px; border: 1px solid #eee; border-radius: 8px; cursor: pointer; }
        .grid-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .grid-table td, .grid-table th { border: 1px solid #dee2e6; padding: 8px; text-align: center; }
        .correct-answer { background-color: var(--success-color) !important; border: 1px solid #28a745 !important; }
        .wrong-answer { background-color: var(--error-color) !important; border: 1px solid #dc3545 !important; }
        .feedback-box { display: none; margin-top: 15px; padding: 15px; background: #eef2f7; border-left: 5px solid #28a745; }
        .btn-submit { display: block; width: 100%; padding: 18px; background: var(--primary-blue); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 30px; }
        #result-area { text-align: center; font-size: 1.4rem; font-weight: bold; margin-top: 30px; display: none; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
<header>
    <div class="header-left"><a href="../index.html" class="home-btn">Trang chủ</a></div>
    <div>GV. Nguyễn Đình Bạch Long</div>
</header>
<div class="container">
    <div style="text-align:center;"><h1>KIẾN THỨC TỔNG HỢP - PHẦN 2.1</h1><p>Câu 01 - Câu 20</p></div>
    <form id="quiz-form">
        <script>
            const qData = [
                {id:1, q:"Công dân số mẫu mực?", type:"table", rows:[{t:"Dùng tên thật người khác",a:"k"},{t:"Đưa địa chỉ nhà cho người lạ",a:"k"},{t:"Trích dẫn nguồn ảnh",a:"c"}], explain:"Không giả mạo, bảo mật thông tin, tôn trọng bản quyền."},
                {id:2, q:"Ghép thuật ngữ bảo mật:", type:"match", rows:[{t:"Web giả mạo",a:"phishing"},{t:"File theo dõi",a:"cookies"},{t:"Chương trình hại",a:"virus"},{t:"Lọc dữ liệu",a:"firewall"}], explain:"Phishing, Cookies, Virus, Firewall."},
                {id:3, q:"Web tìm kiếm về khủng long?", type:"radio", opts:[{v:"a",t:"google.com"},{v:"b",t:"encyclopedia"},{v:"c",t:"dinosaurs"},{v:"d",t:"wiki"}], ans:"a", explain:"Google là công cụ tìm kiếm phổ biến nhất."},
                {id:4, q:"Đúng/Sai về công dân số:", type:"table", rows:[{t:"Ẩn danh là dùng tên thật",a:"s"},{t:"Hacking là truy cập trái phép",a:"d"},{t:"Catfishing là giả mạo",a:"d"}], explain:"Ẩn danh là KHÔNG dùng tên thật."},
                {id:5, q:"Hành động mẫu mực?", type:"table", rows:[{t:"Giả người khác tăng follow",a:"k"},{t:"Review nhà hàng",a:"c"},{t:"Đăng điểm bạn",a:"k"}], explain:"Giả mạo và xâm phạm riêng tư là sai."},
                {id:6, q:"Hacker không xấu nhưng không được phép? (Chọn 2)", type:"check", opts:[{v:"a",t:"Hacktivist"},{v:"b",t:"Mũ trắng"},{v:"c",t:"Mũ đen"},{v:"d",t:"Mũ xám"}], ans:["a","d"], explain:"Hacktivist và Gray Hat có thể không vì tiền nhưng vẫn vi phạm pháp luật."},
                {id:7, q:"Ghép thuật ngữ:", type:"match", rows:[{t:"Truy cập gây hại",a:"hack"},{t:"Mạo danh lừa đảo",a:"catfish"},{t:"Đánh cắp ứng dụng",a:"piracy"}], explain:"Hacking, Catfishing, Piracy."},
                {id:8, q:"Chưa đủ tuổi dùng MXH?", type:"radio", opts:[{v:"a",t:"Đợi đủ tuổi"},{v:"b",t:"Dùng nick bố mẹ"},{v:"c",t:"Tạo hồ sơ giả"},{v:"d",t:"Đổi ngày sinh"}], ans:"a", explain:"Tuân thủ quy định độ tuổi."},
                {id:9, q:"Điền từ:", type:"match_inline", txt:"[1] hoạt động để xác định lỗ hổng bảo mật.", ans:["ethical"], explain:"Tin tặc có đạo đức (Ethical Hacker)."},
                {id:10, q:"Đúng/Sai về quyền riêng tư:", type:"table", rows:[{t:"Xác thực đa yếu tố bảo vệ",a:"d"},{t:"Không thể giới hạn người xem",a:"s"},{t:"Cài đặt hạn chế chặn người lạ",a:"d"}], explain:"Privacy settings rất quan trọng."},
                {id:11, q:"Công dân mẫu mực?", type:"table", rows:[{t:"Sao chép game cho bạn",a:"k"},{t:"Đăng bảng điểm bạn",a:"k"},{t:"Chia sẻ bài báo thời tiết",a:"c"}], explain:"Chia sẻ thông tin hữu ích, không vi phạm bản quyền/riêng tư."},
                {id:12, q:"Tầm quan trọng Privacy Settings? (Chọn 2)", type:"check", opts:[{v:"a",t:"Bảo vệ khỏi kẻ xấu"},{v:"b",t:"Kiểm soát người xem"},{v:"c",t:"Tăng follow"},{v:"d",t:"Riêng tư tuyệt đối"},{v:"e",t:"Bảo vệ khỏi bình luận bạn bè"}], ans:["a","b"], explain:"Bảo vệ an toàn và kiểm soát hiển thị."},
                {id:13, q:"Cài đặt kiểm soát thông tin cá nhân?", type:"match_inline", txt:"[1] cho phép kiểm soát thông tin.", ans:["privacy"], explain:"Privacy Settings."},
                {id:14, q:"Nguồn tin cậy?", type:"table", rows:[{t:"NatGeo về cá voi",a:"c"},{t:"Không trích dẫn",a:"k"},{t:"Nghiên cứu nhiều nguồn",a:"c"}], explain:"Nguồn uy tín và đa dạng."},
                {id:15, q:"Xác định tin cậy?", type:"radio", opts:[{v:"a",t:"Hỏi bạn bè"},{v:"b",t:"Tìm trích dẫn/nguồn"},{v:"c",t:"Web đẹp"},{v:"d",t:"Mọi thứ đều thật"}], ans:"b", explain:"Kiểm chứng nguồn gốc."},
                {id:16, q:"Ghép thuật ngữ dữ liệu:", type:"match", rows:[{t:"Thu thập/quản lý",a:"im"},{t:"Hiểu biết sâu sắc",a:"know"},{t:"Xử lý có ý nghĩa",a:"info"},{t:"Sự kiện thô",a:"data"}], explain:"IM, Knowledge, Information, Data."},
                {id:17, q:"Xác định nguồn tin cậy?", type:"table", rows:[{t:"Bình luận MXH",a:"k"},{t:"Khảo sát bạn bè",a:"k"},{t:"Bách khoa toàn thư trường giới thiệu",a:"c"}], explain:"Nguồn học thuật đáng tin hơn ý kiến cá nhân."},
                {id:18, q:"Ghép sở hữu trí tuệ:", type:"match", rows:[{t:"Sáng tạo trí tuệ",a:"ip"},{t:"Công nghệ công ty",a:"prop"},{t:"Mẫu dữ liệu nhỏ",a:"cookies"},{t:"Phần mềm miễn phí",a:"open"}], explain:"IP, Proprietary, Cookies, Open Source."},
                {id:19, q:"Bảo vệ sách/phim?", type:"radio", opts:[{v:"a",t:"Nhãn hiệu"},{v:"b",t:"Sáng chế"},{v:"c",t:"Bản quyền"},{v:"d",t:"Mã nguồn mở"}], ans:"c", explain:"Copyright (Bản quyền)."},
                {id:20, q:"Ghép dữ liệu:", type:"match", rows:[{t:"Dữ liệu đã xử lý",a:"info"},{t:"Dữ liệu thô",a:"data"},{t:"Dữ liệu thu thập về sự kiện",a:"know"}], explain:"Info (Thông tin), Data (Dữ liệu), Knowledge (Kiến thức - ngữ cảnh này có thể là Info/Data tùy sách, nhưng theo loại trừ là Know)."}
            ];

            const form = document.getElementById('quiz-form');
            qData.forEach(q => {
                let h = `<div class="question-card" id="c${q.id}"><span class="topic-label">Chủ đề ${q.id}</span><div class="question-text">${q.q}</div>`;
                if(q.type==='radio' || q.type==='check'){
                    h+=`<div class="options">`;
                    let t = q.type==='radio'?'radio':'checkbox';
                    q.opts.forEach(o=>h+=`<label><input type="${t}" name="q${q.id}" value="${o.v}"> ${o.t}</label>`);
                    h+=`</div>`;
                } else if(q.type==='table'){
                    h+=`<table class="grid-table"><tr><th>Nội dung</th><th>${q.id===4||q.id===10?'Đúng/Sai':'Có/Không'}</th></tr>`;
                    q.rows.forEach((r,i)=>h+=`<tr><td>${r.t}</td><td><label style="display:inline"><input type="radio" name="q${q.id}_${i}" value="${r.a==='c'||r.a==='d'?'c':'k'}"> ${q.id===4||q.id===10?'Đúng':'Có'}</label> <label style="display:inline"><input type="radio" name="q${q.id}_${i}" value="${r.a==='c'||r.a==='d'?'k':'c'}"> ${q.id===4||q.id===10?'Sai':'Không'}</label></td></tr>`);
                    h+=`</table>`;
                } else if(q.type==='match'){
                    h+=`<table class="grid-table"><tr><th>Nội dung</th><th>Lựa chọn</th></tr>`;
                    q.rows.forEach((r,i)=>{
                        h+=`<tr><td>${r.t}</td><td><select name="q${q.id}_${i}"><option value="">--Chọn--</option>`;
                        if(q.id===2) h+=`<option value="phishing">Phishing</option><option value="cookies">Cookies</option><option value="virus">Virus</option><option value="firewall">Tường lửa</option>`;
                        if(q.id===7) h+=`<option value="hack">Hacking</option><option value="catfish">Catfishing</option><option value="piracy">Piracy</option>`;
                        if(q.id===16) h+=`<option value="im">Quản lý TT</option><option value="know">Kiến thức</option><option value="info">Thông tin</option><option value="data">Dữ liệu</option>`;
                        if(q.id===18) h+=`<option value="ip">SHTT</option><option value="prop">Độc quyền</option><option value="cookies">Cookies</option><option value="open">Mã nguồn mở</option>`;
                        if(q.id===20) h+=`<option value="info">Thông tin</option><option value="data">Dữ liệu</option><option value="know">Kiến thức</option>`;
                        h+=`</select></td></tr>`;
                    });
                    h+=`</table>`;
                } else if(q.type==='match_inline'){
                    h+=`<div>${q.txt.replace('[1]',`<select name="q${q.id}_1"><option value="">...</option><option value="ethical">Tin tặc đạo đức</option><option value="privacy">Quyền riêng tư</option></select>`)}</div>`;
                }
                h+=`<div class="feedback-box"><strong>Đáp án:</strong> ${q.explain}</div></div>`;
                form.innerHTML+=h;
            });

            function gradeQuiz(){
                let score=0; let all=true; let firstMiss=null;
                document.querySelectorAll('.question-card').forEach(c=>c.classList.remove('incomplete'));
                document.querySelectorAll('.feedback-box').forEach(b=>b.style.display='none');
                
                qData.forEach(q=>{
                    let ans=false;
                    if(q.type==='radio' || q.type==='check'){ if(document.querySelector(`input[name="q${q.id}"]:checked`)) ans=true; }
                    else if(q.type==='table'){ let sub=0; q.rows.forEach((r,i)=>{ if(document.querySelector(`input[name="q${q.id}_${i}"]:checked`)) sub++; }); if(sub===q.rows.length) ans=true; }
                    else if(q.type==='match'){ let sub=0; q.rows.forEach((r,i)=>{ if(document.querySelector(`select[name="q${q.id}_${i}"]`).value!=='') sub++; }); if(sub===q.rows.length) ans=true; }
                    else if(q.type==='match_inline'){ if(document.querySelector(`select[name="q${q.id}_1"]`).value!=='') ans=true; }
                    if(!ans){ all=false; document.getElementById(`c${q.id}`).classList.add('incomplete'); if(!firstMiss) firstMiss=document.getElementById(`c${q.id}`); }
                });

                if(!all){ alert('Vui lòng làm hết bài!'); firstMiss.scrollIntoView({behavior:'smooth',block:'center'}); return; }

                qData.forEach(q=>{
                    let corr=false;
                    if(q.type==='radio'){
                        let v = document.querySelector(`input[name="q${q.id}"]:checked`).value;
                        if(v===q.ans) corr=true;
                        document.querySelectorAll(`input[name="q${q.id}"]`).forEach(i=>{ if(i.value===q.ans) i.parentElement.classList.add('correct-answer'); else if(i.checked) i.parentElement.classList.add('wrong-answer'); });
                    } else if(q.type==='check'){
                        let chk = Array.from(document.querySelectorAll(`input[name="q${q.id}"]:checked`)).map(i=>i.value);
                        if(JSON.stringify(chk.sort())===JSON.stringify(q.ans.sort())) corr=true;
                        document.querySelectorAll(`input[name="q${q.id}"]`).forEach(i=>{ if(q.ans.includes(i.value)) i.parentElement.classList.add('correct-answer'); else if(i.checked) i.parentElement.classList.add('wrong-answer'); });
                    } else if(q.type==='table'){
                        let subC=0;
                        q.rows.forEach((r,i)=>{
                            let v = document.querySelector(`input[name="q${q.id}_${i}"]:checked`).value;
                            // Logic: 'c' or 'd' is correct val. Table input values: 1st is 'c', 2nd is 'k'.
                            let rightVal = (r.a==='c'||r.a==='d')?'c':'k';
                            if(v===rightVal) subC++;
                            document.querySelectorAll(`input[name="q${q.id}_${i}"]`).forEach(inp=>{ if(inp.value===rightVal) inp.parentElement.classList.add('correct-answer'); else if(inp.checked) inp.parentElement.classList.add('wrong-answer'); });
                        });
                        if(subC===q.rows.length) corr=true;
                    } else if(q.type==='match'){
                        let subC=0;
                        q.rows.forEach((r,i)=>{
                            let s = document.querySelector(`select[name="q${q.id}_${i}"]`);
                            if(s.value===r.a) { subC++; s.classList.add('correct-answer'); } else s.classList.add('wrong-answer');
                        });
                        if(subC===q.rows.length) corr=true;
                    } else if(q.type==='match_inline'){
                        let s = document.querySelector(`select[name="q${q.id}_1"]`);
                        if(s.value===q.ans[0]) { corr=true; s.classList.add('correct-answer'); } else s.classList.add('wrong-answer');
                    }
                    if(corr) score++;
                    document.querySelector(`#c${q.id} .feedback-box`).style.display='block';
                });

                let r = document.getElementById('result-area');
                r.style.display='block';
                r.innerHTML=`Kết quả: ${score}/${qData.length} câu đúng`;
                r.style.backgroundColor = score/qData.length >= 0.8 ? '#d4edda':'#f8d7da';
                window.scrollTo({top:0,behavior:'smooth'});
                document.querySelectorAll('input, select').forEach(i=>i.disabled=true);
            }
        </script>
        <button type="button" class="btn-submit" onclick="gradeQuiz()">NỘP BÀI</button>
        <div id="result-area"></div>
    </form>
</div>
<footer><p>© 2026 - GV Nguyễn Đình Bạch Long</p></footer>
</body>
</html>
