<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IC3 SPARK LEVEL 3 - KIẾN THỨC TỔNG HỢP (1.2)</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Kanit:ital,wght@1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-blue: #234585; --accent-yellow: #ffc107; --bg-color: #f0f4f8; --success-color: #d4edda; --error-color: #f8d7da; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: #333; line-height: 1.6; margin: 0; }
        header { background: var(--primary-blue); color: white; padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent-yellow); position: sticky; top: 0; z-index: 1000; }
        .home-btn { background: rgba(255,255,255,0.2); color: white; padding: 6px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.4); display: flex; align-items: center; gap: 5px; text-decoration: none; }
        .logo-ic3 { font-family: 'Kanit', sans-serif; font-size: 1.8rem; font-style: italic; font-weight: 800; }
        .logo-ic3 span:nth-child(1) { color: #4CAF50; -webkit-text-stroke: 1px white; } 
        .logo-ic3 span:nth-child(2) { color: #222; opacity: 0.7; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .question-card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 25px; border: 1px solid #e1e8ed; }
        .question-card.incomplete { border: 2px solid #dc3545; }
        .topic-label { position: absolute; top: -12px; left: 20px; background: #2a5298; color: white; padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        .question-text { font-weight: 700; margin-bottom: 15px; color: #2c3e50; }
        .options label { display: block; padding: 10px; margin-bottom: 8px; border: 1px solid #eee; border-radius: 8px; cursor: pointer; }
        .grid-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .grid-table td, .grid-table th { border: 1px solid #dee2e6; padding: 8px; text-align: center; }
        .correct-answer { background-color: var(--success-color) !important; border: 1px solid #28a745 !important; }
        .wrong-answer { background-color: var(--error-color) !important; border: 1px solid #dc3545 !important; }
        .feedback-box { display: none; margin-top: 15px; padding: 15px; background: #eef2f7; border-left: 5px solid #28a745; }
        .btn-submit { display: block; width: 100%; padding: 18px; background: var(--primary-blue); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 30px; }
        #result-area { text-align: center; font-size: 1.4rem; font-weight: bold; margin-top: 30px; display: none; padding: 20px; border-radius: 8px; }
        footer { background: var(--primary-blue); color: white; padding: 30px; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>
<header>
    <div class="header-left"><a href="../index.html" class="home-btn"><i class="fas fa-home"></i> Trang chủ</a><div class="logo-ic3"><span>IC3</span><span>spark</span></div></div>
    <div>GV. Nguyễn Đình Bạch Long</div>
</header>
<div class="container">
    <div style="text-align:center;"><h1>KIẾN THỨC TỔNG HỢP - PHẦN 1.2</h1><p>Câu 21 - Câu 42</p></div>
    <form id="quiz-form">
        <script>
            const qData = [
                {id:21, q:"Máy in ngừng in, làm gì trước?", type:"radio", opts:[{v:"a",t:"Khởi động lại máy"},{v:"b",t:"Xóa hàng chờ"},{v:"c",t:"Đổi driver"},{v:"d",t:"Kiểm tra dây cáp/kết nối"}], ans:"d", explain:"Kiểm tra vật lý (dây cáp) trước tiên."},
                {id:22, q:"Máy tính bị chậm?", type:"radio", opts:[{v:"a",t:"Đóng ứng dụng không dùng"},{v:"b",t:"Rút phích cắm"},{v:"c",t:"Cập nhật OS"},{v:"d",t:"Nhấp chuột liên tục"}], ans:"a", explain:"Giải phóng RAM bằng cách đóng ứng dụng."},
                {id:23, q:"URL là gì?", type:"radio", opts:[{v:"a",t:"Nhà phát hành"},{v:"b",t:"Tên trang"},{v:"c",t:"Địa chỉ trang web"},{v:"d",t:"Tác giả"}], ans:"c", explain:"Uniform Resource Locator."},
                {id:24, q:"Ẩn vị trí khi tìm nhà hàng?", type:"radio", opts:[{v:"a",t:"Duyệt riêng tư (Incognito)"},{v:"b",t:"Chặn quảng cáo"},{v:"c",t:"Xóa cookies"},{v:"d",t:"Xóa cache"}], ans:"a", explain:"Chế độ riêng tư hạn chế lưu dấu vết."},
                {id:25, q:"Tài xế xe buýt dùng gì để định hướng?", type:"radio", opts:[{v:"a",t:"Radio"},{v:"b",t:"GPS"},{v:"c",t:"MP3"},{v:"d",t:"Địa cầu"}], ans:"b", explain:"GPS (Global Positioning System)."},
                {id:26, q:"URL đúng định dạng?", type:"radio", opts:[{v:"a",t:"https://.company"},{v:"b",t:"https://www.companypro.net/test"},{v:"c",t:"http://www"},{v:"d",t:"https://www/net"}], ans:"b", explain:"Đúng cú pháp protocol://domain/path."},
                {id:27, q:"Nhập URL ở đâu?", type:"radio", opts:[{v:"a",t:"Thanh địa chỉ (Address Bar)"},{v:"b",t:"Ô tìm kiếm"},{v:"c",t:"Nút đăng nhập"},{v:"d",t:"Gmail"}], ans:"a", explain:"Thanh địa chỉ nằm trên cùng."},
                {id:28, q:"Đuôi trang web phi lợi nhuận?", type:"radio", opts:[{v:"a",t:".net"},{v:"b",t:".edu"},{v:"c",t:".org"},{v:"d",t:".com"}], ans:"c", explain:".org (Organization)."},
                {id:29, q:"Ghép loại lưu trữ:", type:"match", rows:[{t:"Lưu trên laptop",a:"hdd"},{t:"Sao lưu an toàn bởi cty khác",a:"cloud"},{t:"Sao chép không cần mạng",a:"usb"}], explain:"HDD: Tại chỗ, Cloud: Từ xa, USB: Di động offline."},
                {id:30, q:"Các bước truy cập web:", type:"match_inline", txt:"1. Kết nối tới [1]. 2. [2] gửi về. 3. [3] hiển thị.", ans:["server","page","browser"], explain:"Browser -> Server -> Page -> Browser."},
                {id:31, q:"Catfishing là gì?", type:"radio", opts:[{v:"a",t:"Kết bạn an toàn"},{v:"b",t:"Môn thể thao"},{v:"c",t:"Nghiên cứu"},{v:"d",t:"Giả mạo người khác để lừa đảo"}], ans:"d", explain:"Lừa đảo bằng danh tính giả."},
                {id:32, q:"Công dân số tích cực?", type:"radio", opts:[{v:"a",t:"Chia sẻ kiến thức/giúp đỡ"},{v:"b",t:"Không báo cáo xấu"},{v:"c",t:"Tạo nick giả"},{v:"d",t:"Chia sẻ info cá nhân"}], ans:"a", explain:"Hành vi tích cực."},
                {id:33, q:"Công dân số tiêu cực?", type:"radio", opts:[{v:"a",t:"Khen ngợi"},{v:"b",t:"Hợp tác"},{v:"c",t:"Tôn trọng"},{v:"d",t:"Tải lậu bản quyền"}], ans:"d", explain:"Vi phạm bản quyền."},
                {id:34, q:"Ghép loại Hacker:", type:"match", rows:[{t:"Kiểm tra bảo mật (báo cáo)",a:"ethical"},{t:"Tấn công vì mục đích xã hội",a:"hacktivist"},{t:"Chặn truy cập (phá hoại)",a:"unethical"}], explain:"Ethical: Đạo đức, Hacktivist: Nhà hoạt động, Unethical: Xấu."},
                {id:35, q:"Hacker mũ trắng?", type:"radio", opts:[{v:"a",t:"Nhắm vào người xấu"},{v:"b",t:"Đội mũ trắng"},{v:"c",t:"Dùng kỹ năng cho mục đích tốt"},{v:"d",t:"Mặc đồ trắng"}], ans:"c", explain:"Chuyên gia bảo mật hợp pháp."},
                {id:36, q:"Ghép thuật ngữ:", type:"match", rows:[{t:"Che giấu danh tính",a:"anon"},{t:"Dùng kỹ năng thử nghiệm/giải quyết",a:"hacker"},{t:"Sao chép không phép",a:"piracy"},{t:"Hành động trách nhiệm",a:"ethical"}], explain:"Anon: Ẩn danh, Piracy: Bản quyền."},
                {id:37, q:"Gặp nội dung không phù hợp?", type:"radio", opts:[{v:"a",t:"Báo cáo cho người lớn"},{v:"b",t:"Bỏ qua"},{v:"c",t:"Bình luận"},{v:"d",t:"Chia sẻ"}], ans:"a", explain:"Báo cáo (Report/Tell)."},
                {id:38, q:"Bảo vệ quyền riêng tư bài đăng?", type:"radio", opts:[{v:"a",t:"Xóa bài"},{v:"b",t:"Công khai hết"},{v:"c",t:"Mật khẩu"},{v:"d",t:"Chỉnh cài đặt quyền riêng tư (Privacy Settings)"}], ans:"d", explain:"Giới hạn người xem."},
                {id:39, q:"Kiểm soát ai xem/bình luận?", type:"radio", opts:[{v:"a",t:"Đổi pass"},{v:"b",t:"Thông báo"},{v:"c",t:"Phông chữ"},{v:"d",t:"Cài đặt quyền riêng tư"}], ans:"d", explain:"Privacy Settings."},
                {id:40, q:"Nội dung giới hạn độ tuổi?", type:"radio", opts:[{v:"a",t:"Giáo dục"},{v:"b",t:"Hoạt hình"},{v:"c",t:"Game bạo lực"},{v:"d",t:"Nấu ăn"}], ans:"c", explain:"Nội dung bạo lực/người lớn."},
                {id:41, q:"Tầm quan trọng Privacy Settings?", type:"radio", opts:[{v:"a",t:"Bảo vệ thông tin cá nhân"},{v:"b",t:"Chia sẻ công khai"},{v:"c",t:"Tăng hiển thị"},{v:"d",t:"Kiếm like"}], ans:"a", explain:"Kiểm soát thông tin."},
                {id:42, q:"Ghép Hacker:", type:"match", rows:[{t:"Bất hợp pháp/Xấu",a:"black"},{t:"Không phép/Chia sẻ phí",a:"gray"},{t:"Truy cập trái phép",a:"hacking"},{t:"Hợp pháp",a:"white"}], explain:"Black: Mũ đen, Gray: Mũ xám, White: Mũ trắng."}
            ];

            const form = document.getElementById('quiz-form');
            qData.forEach(q => {
                let h = `<div class="question-card" id="c${q.id}"><span class="topic-label">Chủ đề ${q.id}</span><div class="question-text">${q.q}</div>`;
                if(q.type==='radio'){
                    h+=`<div class="options">`;
                    q.opts.forEach(o=>h+=`<label><input type="radio" name="q${q.id}" value="${o.v}"> ${o.t}</label>`);
                    h+=`</div>`;
                } else if(q.type==='match'){
                    h+=`<table class="grid-table"><tr><th>Nội dung</th><th>Lựa chọn</th></tr>`;
                    q.rows.forEach((r,i)=>{
                        h+=`<tr><td>${r.t}</td><td><select name="q${q.id}_${i}"><option value="">--Chọn--</option>`;
                        if(q.id===29) h+=`<option value="hdd">Ổ cứng</option><option value="cloud">Cloud</option><option value="usb">USB</option>`;
                        if(q.id===34) h+=`<option value="ethical">Hacker đạo đức</option><option value="hacktivist">Hacker hoạt động</option><option value="unethical">Hacker xấu</option>`;
                        if(q.id===36) h+=`<option value="anon">Ẩn danh</option><option value="hacker">Hacker</option><option value="piracy">Vi phạm bản quyền</option><option value="ethical">Đạo đức</option>`;
                        if(q.id===42) h+=`<option value="black">Mũ đen</option><option value="gray">Mũ xám</option><option value="hacking">Hacking</option><option value="white">Mũ trắng</option>`;
                        h+=`</select></td></tr>`;
                    });
                    h+=`</table>`;
                } else if(q.type==='match_inline'){
                    h+=`<div>${q.txt.replace('[1]',`<select name="q${q.id}_1"><option value="">...</option><option value="server">Máy chủ web</option><option value="browser">Trình duyệt</option><option value="page">Trang</option></select>`).replace('[2]',`<select name="q${q.id}_2"><option value="">...</option><option value="page">Trang</option><option value="server">Máy chủ</option></select>`).replace('[3]',`<select name="q${q.id}_3"><option value="">...</option><option value="browser">Trình duyệt</option><option value="page">Trang</option></select>`)}</div>`;
                }
                h+=`<div class="feedback-box"><strong>Đáp án:</strong> ${q.explain}</div></div>`;
                form.innerHTML+=h;
            });

            function gradeQuiz(){
                let score=0; let all=true; let firstMiss=null;
                document.querySelectorAll('.question-card').forEach(c=>c.classList.remove('incomplete'));
                document.querySelectorAll('.feedback-box').forEach(b=>b.style.display='none');
                
                qData.forEach(q=>{
                    let ans=false;
                    if(q.type==='radio'){
                        if(document.querySelector(`input[name="q${q.id}"]:checked`)) ans=true;
                    } else if(q.type==='match'){
                        let sub=0; q.rows.forEach((r,i)=>{ if(document.querySelector(`select[name="q${q.id}_${i}"]`).value!=='') sub++; });
                        if(sub===q.rows.length) ans=true;
                    } else if(q.type==='match_inline'){
                        if(document.querySelector(`select[name="q${q.id}_1"]`).value!=='' && document.querySelector(`select[name="q${q.id}_2"]`).value!=='' && document.querySelector(`select[name="q${q.id}_3"]`).value!=='') ans=true;
                    }
                    if(!ans){ all=false; let c=document.getElementById(`c${q.id}`); c.classList.add('incomplete'); if(!firstMiss) firstMiss=c; }
                });

                if(!all){ alert('Vui lòng làm hết bài!'); firstMiss.scrollIntoView({behavior:'smooth',block:'center'}); return; }

                qData.forEach(q=>{
                    let corr=false;
                    if(q.type==='radio'){
                        let v = document.querySelector(`input[name="q${q.id}"]:checked`).value;
                        if(v===q.ans) corr=true;
                        document.querySelectorAll(`input[name="q${q.id}"]`).forEach(i=>{
                            if(i.value===q.ans) i.parentElement.classList.add('correct-answer');
                            else if(i.checked) i.parentElement.classList.add('wrong-answer');
                        });
                    } else if(q.type==='match'){
                        let subC=0;
                        q.rows.forEach((r,i)=>{
                            let sel = document.querySelector(`select[name="q${q.id}_${i}"]`);
                            if(sel.value===r.a) { subC++; sel.classList.add('correct-answer'); }
                            else sel.classList.add('wrong-answer');
                        });
                        if(subC===q.rows.length) corr=true;
                    } else if(q.type==='match_inline'){
                        let s1 = document.querySelector(`select[name="q${q.id}_1"]`);
                        let s2 = document.querySelector(`select[name="q${q.id}_2"]`);
                        let s3 = document.querySelector(`select[name="q${q.id}_3"]`);
                        if(s1.value===q.ans[0]) s1.classList.add('correct-answer'); else s1.classList.add('wrong-answer');
                        if(s2.value===q.ans[1]) s2.classList.add('correct-answer'); else s2.classList.add('wrong-answer');
                        if(s3.value===q.ans[2]) s3.classList.add('correct-answer'); else s3.classList.add('wrong-answer');
                        if(s1.value===q.ans[0] && s2.value===q.ans[1] && s3.value===q.ans[2]) corr=true;
                    }
                    if(corr) score++;
                    document.querySelector(`#c${q.id} .feedback-box`).style.display='block';
                });

                let r = document.getElementById('result-area');
                r.style.display='block';
                r.innerHTML=`Kết quả: ${score}/${qData.length} câu đúng`;
                r.style.backgroundColor = score/qData.length >= 0.8 ? '#d4edda':'#f8d7da';
                window.scrollTo({top:0,behavior:'smooth'});
                document.querySelectorAll('input, select').forEach(i=>i.disabled=true);
            }
        </script>
        <button type="button" class="btn-submit" onclick="gradeQuiz()">NỘP BÀI</button>
        <div id="result-area"></div>
    </form>
</div>
<footer><p>© 2026 - GV Nguyễn Đình Bạch Long</p></footer>
</body>
</html>
