<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý IC3 Spark - Admin</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Kanit:ital,wght@1,800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-kanit { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app">
        <!-- Login Section -->
        <div id="login-section" class="flex items-center justify-center min-h-screen bg-slate-900 p-4">
             <div class="bg-white rounded-[2.5rem] p-10 max-w-sm w-full shadow-[0_20px_50px_rgba(0,0,0,0.3)] text-center border-t-8 border-yellow-400">
                 <div class="flex items-center justify-center gap-2 mb-8 select-none">
                    <span class="text-5xl font-kanit italic text-[#4CAF50] drop-shadow-sm">IC</span>
                    <span class="text-6xl font-kanit italic text-slate-800 -ml-1">3</span>
                 </div>
                 <h2 class="text-2xl font-black text-slate-800 mb-2 uppercase tracking-tight">Quản trị viên</h2>
                 <p class="text-gray-400 text-sm mb-10 font-medium italic">Hệ thống quản lý ôn luyện IC3 Spark</p>
                 
                 <button id="login-btn" class="w-full flex items-center justify-center gap-4 bg-white border-2 border-slate-100 py-4 rounded-2xl font-bold text-slate-700 hover:bg-slate-50 hover:border-slate-200 hover:shadow-lg transition-all active:scale-95 group">
                     <svg class="w-6 h-6 transition-transform group-hover:scale-110" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z"/>
                     </svg>
                     Tiếp tục với Google
                 </button>
             </div>
        </div>

        <!-- Dashboard Section (Hidden initially) -->
        <div id="dashboard-section" class="hidden">
            <header class="bg-slate-900 text-white py-4 px-6 flex justify-between items-center sticky top-0 z-10 shadow-lg border-b-4 border-yellow-400">
                <div class="text-2xl font-kanit italic">
                    <span class="text-[#4CAF50]">IC</span><span>3</span> <span class="not-italic text-sm font-sans font-normal opacity-70">ADMIN PORTAL</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="admin-email" class="text-xs opacity-80 hidden md:block"></span>
                    <button id="logout-btn" class="bg-red-500/20 hover:bg-red-500/40 px-4 py-2 rounded-lg text-xs font-bold transition-all border border-red-500/30">ĐĂNG XUẤT</button>
                </div>
            </header>

            <main class="p-6 max-w-7xl mx-auto">
                <div class="mb-8">
                    <h1 class="text-2xl font-bold text-slate-800">Bảng điều khiển học tập</h1>
                    <p class="text-sm text-gray-500">Quản lý kết quả thi của học sinh lớp 3, 4, 5</p>
                </div>

                <!-- Stats Summary -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-xs text-gray-400 uppercase font-bold tracking-widest mb-1">Tổng bài thi</p>
                        <h3 id="total-submissions" class="text-3xl font-bold text-slate-800">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-xs text-gray-400 uppercase font-bold tracking-widest mb-1">Học sinh</p>
                        <h3 id="unique-students" class="text-3xl font-bold text-green-600">0</h3>
                    </div>
                     <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-xs text-gray-400 uppercase font-bold tracking-widest mb-1">Lớp học</p>
                        <h3 id="total-classes" class="text-3xl font-bold text-blue-600">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-xs text-gray-400 uppercase font-bold tracking-widest mb-1">Điểm TB</p>
                        <h3 id="avg-score" class="text-3xl font-bold text-purple-600">0%</h3>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-gray-50 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex gap-2">
                             <select id="grade-filter" class="px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                                 <option value="all">Tất cả Khối</option>
                                 <option value="3">Khối 3</option>
                                 <option value="4">Khối 4</option>
                                 <option value="5">Khối 5</option>
                             </select>
                             <select id="class-filter" class="px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                                 <option value="all">Tất cả Lớp</option>
                             </select>
                        </div>
                        <div class="relative w-full md:w-auto">
                            <input type="text" id="search-input" placeholder="Tìm tên học sinh..." class="w-full md:w-80 pl-10 pr-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                            <span class="absolute left-3 top-2.5 opacity-30">🔍</span>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="border-b border-gray-100 text-xs text-gray-400 uppercase font-bold">
                                    <th class="px-6 py-4">Học sinh</th>
                                    <th class="px-6 py-4">Lớp</th>
                                    <th class="px-6 py-4">Bài thi</th>
                                    <th class="px-6 py-4 text-center">Điểm số</th>
                                    <th class="px-6 py-4">Thời gian nộp</th>
                                    <th class="px-6 py-4 text-right">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="results-body">
                                <!-- Results will be injected here -->
                                <tr><td colspan="6" class="p-10 text-center text-gray-400">Đang tải dữ liệu...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>

        <!-- Detail Modal -->
        <div id="detail-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
                <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <div>
                        <h2 id="modal-student-name" class="text-xl font-bold text-slate-800">Chi tiết bài làm</h2>
                        <p id="modal-lesson-title" class="text-sm text-gray-500"></p>
                    </div>
                    <button id="close-modal" class="text-gray-400 hover:text-gray-600 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div id="modal-content" class="p-6 overflow-y-auto flex-grow space-y-4">
                    <!-- Details will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="/admin.js"></script>
</body>
</html>
