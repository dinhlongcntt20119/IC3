<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lớp 4 - Level 2 | Kiến Thức Tổng Hợp - Phần 1.2</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #ef6c00; --primary-dark: #e65100; --accent-color: #ff9800;
            --bg-body: #fff8e1; --text-color: #3e2723; --border-color: #ffe0b2;
            --correct-bg: #d4edda; --correct-border: #28a745; --wrong-bg: #f8d7da; --wrong-border: #dc3545;
        }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-body); color: var(--text-color); margin: 0; padding: 0; }
        
        header { background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 1000; border-bottom: 4px solid #fff; }
        .header-left { display: flex; flex-direction: column; align-items: flex-start; }
        .logo-ic3 { font-family: 'Kanit', sans-serif; font-size: 2rem; font-weight: 800; font-style: italic; line-height: 1; }
        .logo-ic3 span:nth-child(1) { color: #fff; } .logo-ic3 span:nth-child(2) { color: #ffe0b2; }
        .home-btn { margin-top: 8px; color: white; text-decoration: none; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.6); padding: 5px 15px; border-radius: 20px; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
        .home-btn:hover { background: rgba(255,255,255,0.2); }
        .header-right { text-align: right; }
        .teacher-name { font-weight: 700; font-size: 1.1rem; display: block; }
        .sub-title { font-size: 0.9rem; opacity: 0.9; }
        
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .page-title { text-align: center; margin-bottom: 40px; }
        .page-title h1 { color: var(--primary-dark); margin: 0; font-size: 2.2rem; text-transform: uppercase; font-weight: 800; }
        .page-title h2 { color: #5d4037; margin: 10px 0 0; font-size: 1.4rem; font-weight: bold; text-transform: uppercase; }
        
        .question-card { background: white; border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 30px; overflow: hidden; display: flex; flex-wrap: wrap; box-shadow: 0 4px 12px rgba(230, 81, 0, 0.08); }
        .question-card.incomplete { border: 2px solid var(--wrong-border); box-shadow: 0 0 10px rgba(220, 53, 69, 0.2); }
        
        .topic-col { background-color: var(--primary-dark); width: 140px; padding: 20px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 700; color: white; flex-shrink: 0; font-size: 1.2rem; border-right: 1px solid #fff; }
        .content-col { flex-grow: 1; padding: 25px; width: calc(100% - 140px); background: #fff; }
        .question-text { font-weight: 700; font-size: 1.1rem; margin-bottom: 20px; color: var(--primary-dark); }
        
        .options label { display: block; margin-bottom: 10px; cursor: pointer; padding: 12px 15px; border: 2px solid #fff3e0; border-radius: 8px; transition: 0.2s; position: relative; }
        .options label:hover { background-color: #fff3e0; border-color: var(--primary-color); }
        .options input { margin-right: 12px; transform: scale(1.3); vertical-align: middle; accent-color: var(--primary-color); }
        
        /* Table Styles */
        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 15px; }
        .data-table { width: 100%; border-collapse: collapse; margin: 0; }
        .data-table th { background-color: var(--primary-color); color: white; padding: 15px; text-align: center; font-weight: 700; border-bottom: 2px solid #fff; }
        .data-table td { border-bottom: 1px solid var(--border-color); padding: 15px; vertical-align: middle; }
        .data-table tr:nth-child(even) { background-color: #fff8e1; }
        .data-table td:first-child { width: 60%; font-weight: 500; }
        .data-table td:not(:first-child) { width: 40%; text-align: center; }
        
        /* Select Styles */
        .data-table select { width: 100%; padding: 10px; border: 1px solid #ffcc80; border-radius: 5px; background: white; font-size: 0.95rem; cursor: pointer; }
        .data-table input[type="radio"] { transform: scale(1.5); cursor: pointer; accent-color: var(--primary-color); }

        /* Custom Style for Inline Select (Fill in blank) */
        .fill-blank-row { margin-bottom: 15px; line-height: 2.2; font-size: 1.1rem; border-bottom: 1px dashed #ffe0b2; padding-bottom: 10px; }
        .fill-blank-row:last-child { border-bottom: none; }
        .inline-select { display: inline-block; width: auto; min-width: 180px; padding: 5px 15px; border: 2px solid var(--primary-color); border-radius: 20px; background: #fff; color: #e65100; font-weight: bold; cursor: pointer; margin: 0 5px; vertical-align: middle; }
        .inline-select:focus { outline: none; box-shadow: 0 0 5px rgba(239, 108, 0, 0.5); }

        /* Feedback & Button */
        .feedback { margin-top: 20px; padding: 15px; background-color: #fff3cd; border-left: 5px solid #ffc107; border-radius: 4px; font-size: 0.95rem; color: #856404; display: none; line-height: 1.5; }
        .correct-opt { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; }
        .wrong-opt { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; }
        
        .correction { display: block; margin-top: 8px; font-size: 0.9rem; font-weight: bold; color: var(--wrong-border); background: rgba(255,255,255,0.9); padding: 5px; border-radius: 4px; border: 1px dashed var(--wrong-border); }

        .btn-submit { display: block; width: 250px; margin: 40px auto; padding: 18px; background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); color: white; border: none; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 15px rgba(230, 81, 0, 0.4); transition: 0.3s; }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(230, 81, 0, 0.6); }
        #result-area { text-align: center; font-size: 1.6rem; font-weight: bold; margin-top: 30px; padding: 30px; display: none; background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 2px solid var(--primary-color); }
        footer { background: var(--primary-dark); color: white; padding: 40px 20px; text-align: center; margin-top: 80px; }
        .footer-info { margin-top: 15px; font-size: 0.95rem; opacity: 0.9; }
        @media (max-width: 768px) { .question-card { flex-direction: column; } .topic-col { width: 100%; border-right: none; border-bottom: 4px solid #ffcc80; } .content-col { width: 100%; padding: 15px; } }
    </style>
</head>

<script>
    const questions = [
        { id: 19, type: "check", q: "Em hãy cho biết, vì sao người dùng nên bảo vệ danh tính trực tuyến của họ? (Chọn 2)", opts: [{v: "a", t: "Người dùng luôn nói thật khi trực tuyến"}, {v: "b", t: "Người dùng thường không sử dụng hình ảnh thật của họ"}, {v: "c", t: "Internet có bộ nhớ lâu dài"}, {v: "d", t: "Người dùng không cần bảo vệ danh tính trực tuyến"}], ans: ["b", "c"], explain: "Cần bảo vệ vì thông tin giả mạo (b) và thông tin tồn tại vĩnh viễn (c) có thể gây hại." },
        { id: 20, type: "check", q: "Trong việc sử dụng công nghệ kỹ thuật số ở trường, chọn hai đáp án chỉ những hành vi đúng đắn mà mọi người nên làm? (Chọn 2)", opts: [{v: "a", t: "Học sinh không nên đánh cắp làm hư hại tài sản của người khác"}, {v: "b", t: "Học sinh nên chia sẻ mật khẩu cho nhau biết"}, {v: "c", t: "Học sinh và giáo viên không nên dùng mạng xã hội trong lớp học"}, {v: "d", t: "Học sinh nên mở loa ngoài khi xem Video, thay vì đeo tai nghe"}], ans: ["a", "c"], explain: "Tôn trọng tài sản và tập trung trong lớp học (không dùng mạng xã hội) là hành vi đúng đắn." },
        { id: 21, type: "match", q: "Hãy chọn quy tắc xã giao phù hợp cho mỗi tình huống.", rows: [{t: "Một bạn cùng lớp đăng ảnh vẽ bạn mà chưa hỏi ý kiến", a: "ton_trong"}, {t: "Gửi tin nhắn trực tiếp cho giáo viên vào nửa đêm ngày cuối tuần", a: "thoi_gian"}, {t: "Hai người bạn trò chuyện về một bạn cùng lớp trong phần nhắn tin trực tiếp", a: "khong_noi_xau"}, {t: "KÍNH GỬI THẦY/CÔ", a: "in_hoa"}], opts: [{v: "khong_noi_xau", t: "Không trao đổi thông tin về người khác mà chưa hỏi ý kiến của họ"}, {v: "thoi_gian", t: "Gửi tin nhắn vào thời gian thích hợp"}, {v: "ton_trong", t: "Tôn trọng quyền riêng tư của người khác"}, {v: "in_hoa", t: "Tránh ghi toàn chữ IN HOA"}], explain: "Đăng ảnh không xin phép -> Tôn trọng riêng tư. Gửi tin đêm khuya -> Sai thời gian. KÍNH GỬI... -> In hoa (như đang la hét)." },
        { id: 22, type: "radio", q: "Đâu là một dạng phép xã giao trên môi trường kỹ thuật số?", opts: [{v: "a", t: "Dùng các nguồn giả trên mạng"}, {v: "b", t: "Đưa sự hài hước và châm biếm vào tin nhắn"}, {v: "c", t: "Đăng các thông điệp có tính phi báng trên mạng"}, {v: "d", t: "Duy trì tính tích cực trong tin nhắn và bài đăng của bạn"}], ans: "d", explain: "Duy trì thái độ tích cực, lịch sự là cốt lõi của phép xã giao (Netiquette)." },
        { id: 23, type: "radio", q: "Thông tin nào là một phần của dấu chân kỹ thuật số (Digital footprint) của bạn?", opts: [{v: "a", t: "Bưu thiếp và thư bạn gửi cho một người bạn qua thư"}, {v: "b", t: "Bài đăng trên mạng xã hội"}, {v: "c", t: "Nhạc được lưu trên ổ cứng máy tính"}, {v: "d", t: "Biên lai mua hàng tại một cửa hàng địa phương"}], ans: "b", explain: "Bài đăng mạng xã hội là thông tin công khai trên internet." },
        { id: 24, type: "radio", q: "Khi bắt đầu làm dự án nghiên cứu, giáo viên đưa cho bạn http://orchestramusic.org để sử dụng. Thứ mà giáo viên đưa cho bạn là gì?", opts: [{v: "a", t: "Một tác giả"}, {v: "b", t: "Tiêu đề một trang"}, {v: "c", t: "Một URL"}, {v: "d", t: "Mã nguồn"}], ans: "c", explain: "Chuỗi ký tự bắt đầu bằng http://... là một địa chỉ web hay URL." },
        { id: 25, type: "radio", q: "Khi nghiên cứu để làm bài tập, bạn tìm thấy một trang web có thông tin liên quan mà bạn muốn dùng. Giáo viên yêu cầu bạn đính kèm URL đó vào bài nộp. Câu nào bên dưới là ví dụ về một URL?", opts: [{v: "a", t: "http://www.coolplaces.com/visit-the-pyramids"}, {v: "b", t: "com.CoolPlaces.www"}, {v: "c", t: "CoolPlaces.com"}, {v: "d", t: "www.coolplaces"}], ans: "a", explain: "URL đầy đủ bao gồm giao thức (http://), tên miền và đường dẫn." },
        { id: 26, type: "radio", q: "Bạn được bạn của mình giới thiệu một trang web mới cho phép chơi game trực tuyến miễn phí. Đó là loại trang web gì?", opts: [{v: "a", t: "Giải trí"}, {v: "b", t: "Thông tin"}, {v: "c", t: "Mạng xã hội"}, {v: "d", t: "Giao tiếp"}], ans: "a", explain: "Chơi game là một hoạt động giải trí." },
        { id: 27, type: "match", q: "Hãy chọn thuật ngữ phù hợp cho mỗi định nghĩa.", rows: [{t: "Cung cấp bản mới nhất của trang web", a: "reload"}, {t: "Khám phá để nắm rõ một ứng dụng hoặc trang web", a: "navigate"}, {t: "Lưu địa chỉ một trang web (đôi khi được gọi là 'danh sách yêu thích' (Favorite))", a: "bookmark"}, {t: "Một cửa sổ hoặc màn hình chứa rất nhiều trường hoặc ô trống để nhập dữ liệu", a: "form"}], opts: [{v: "reload", t: "Tải lại (Reload)"}, {v: "navigate", t: "Điều hướng (Navigate)"}, {v: "bookmark", t: "Dấu trang (Bookmark)"}, {v: "form", t: "Biểu mẫu (Form)"}], explain: "Reload: Tải lại. Navigate: Điều hướng. Bookmark: Lưu trang. Form: Nhập liệu." },
        { id: 28, type: "table_tf", q: "Với mỗi câu phát biểu về trình duyệt web, hãy chọn Đúng hoặc Sai.", headers: ["Đúng", "Sai"], rows: [{t: "Dấu trang (Bookmark) cho phép người dùng điều hướng lại các trang web yêu thích của họ", a: "yes"}, {t: "Chức năng tải lại cho phép người dùng truy cập một trang web mà họ thường xem", a: "no"}, {t: "Tự động điền (Autofill) cho phép trình duyệt tự điền thông tin mà không phải gõ lại", a: "yes"}], explain: "Tải lại (Reload) chỉ làm mới trang hiện tại, không phải là danh sách truy cập thường xuyên (History/Bookmark)." },
        
        // --- CHỦ ĐỀ 29: DẠNG ĐIỀN KHUYẾT VỚI MENU LIST ---
        { 
            id: 29, type: "fill_blank", 
            q: "Bạn cần hoàn thành một dự án nghiên cứu. Hãy chọn hành động đúng từ danh sách thả xuống để xử lý từng tình huống.",
            rows: [
                {t: "Bạn đang đọc tài liệu nghiên cứu thì trang bị đứng hoàn toàn, nên bạn ............ trang web.", a: "tailai"}, 
                {t: "Bạn cần truy cập vào trang web, nên bạn ............ trang web.", a: "dieuhuong"}, 
                {t: "Bạn muốn lưu trang web để quay lại sau, nên bạn ............ trang web.", a: "danhdau"}
            ], 
            opts: [
                {v: "tailai", t: "Tải lại (Reload)"}, 
                {v: "dieuhuong", t: "Điều hướng đến (Navigate to)"}, 
                {v: "danhdau", t: "Đánh dấu trang (Bookmark)"}
            ], 
            explain: "Trang bị đứng -> Tải lại. Truy cập -> Điều hướng đến. Lưu lại -> Đánh dấu trang." 
        },

        { id: 30, type: "check", q: "Bạn chạy xong một lượt tìm kiếm trên web, nhưng không tìm được kết quả mình cần. Bạn nên thực hiện 2 bước nào để giúp tinh chỉnh phạm vi tìm kiếm? (Chọn 2)", opts: [{v: "a", t: "Nhập vào một quảng cáo"}, {v: "b", t: "Thử lại mà không thay đổi gì cả"}, {v: "c", t: "Dùng các bộ lọc"}, {v: "d", t: "Dùng từ đồng nghĩa hoặc các từ thay thế khác"}], ans: ["c", "d"], explain: "Sử dụng bộ lọc (Filters) và từ khóa thay thế (Synonyms) giúp kết quả tìm kiếm chính xác hơn." },
        { id: 31, type: "radio", q: "Bạn muốn mua một vật phẩm mới cho trò chơi trực tuyến. Bạn biết rằng giá sẽ giảm sau 5 phút nữa. Bạn đã mở sẵn trang đó ra chờ. Khi hết 5 phút đó, bạn nên làm gì để nhanh chóng hiển thị mức giá mới?", opts: [{v: "a", t: "In trang đó ra"}, {v: "b", t: "Đánh dấu trang đó"}, {v: "c", t: "Gửi email cho công ty bán hàng"}, {v: "d", t: "Tải lại trang"}], ans: "d", explain: "Tải lại trang (Reload/Refresh) sẽ cập nhật thông tin mới nhất từ máy chủ." },
        { id: 32, type: "radio", q: "Nếu muốn lưu trang web để quay lại sau thì bạn có thể làm gì?", opts: [{v: "a", t: "Cố nhớ vào lần đăng nhập tới"}, {v: "b", t: "Đánh dấu trang (Bookmark) cho URL đó"}, {v: "c", t: "Nói cho một người bạn biết"}, {v: "d", t: "Nhờ ai đó gợi nhắc cho bạn"}], ans: "b", explain: "Bookmark là tính năng chuyên dụng để lưu lại địa chỉ web." },
        { id: 33, type: "radio", q: "Bạn đang tìm một số thông tin trên mạng, nhưng kết quả trả về không cung cấp thông tin mà bạn cần. Bạn nên làm gì?", opts: [{v: "a", t: "Đóng trình duyệt của bạn"}, {v: "b", t: "Kiểm tra kết nối internet của bạn"}, {v: "c", t: "Dùng từ đồng nghĩa để thay đổi thuật ngữ tìm"}, {v: "d", t: "Bấm vào đường liên kết của những kết quả quảng cáo"}], ans: "c", explain: "Thay đổi từ khóa tìm kiếm (dùng từ đồng nghĩa) thường giúp tìm được kết quả phù hợp hơn." },
        { id: 34, type: "radio", q: "Bạn đang đọc một bài viết trên trang web. Bên dưới bài viết đó có nhiều đường liên kết cung cấp thêm thông tin ngoài. Bạn nên bấm vào liên kết nào để tìm hiểu về người viết bài báo?", opts: [{v: "a", t: "Chính sách quyền riêng tư (Privacy policy)"}, {v: "b", t: "Tác giả (Author)"}, {v: "c", t: "Điều khoản sử dụng (Terms of use)"}, {v: "d", t: "Phiên bản di động (Mobile version)"}], ans: "b", explain: "Liên kết 'Tác giả' sẽ dẫn đến thông tin về người viết bài." },
        { id: 35, type: "match", q: "Hãy chọn mục đích phù hợp cho mỗi hoạt động.", rows: [{t: "Gửi email cho giáo viên của bạn về bài tập bị thiếu", a: "giao_tiep"}, {t: "Dùng Google Scholar để tìm kiếm một chủ đề cho bài tập", a: "thong_tin"}, {t: "Xem đoạn video hài hước về một chú chó đi xe máy", a: "giai_tri"}], opts: [{v: "giao_tiep", t: "Giao tiếp"}, {v: "thong_tin", t: "Thông tin"}, {v: "giai_tri", t: "Giải trí"}], explain: "Email -> Giao tiếp. Google Scholar -> Tìm kiếm thông tin. Video hài -> Giải trí." },
        { id: 36, type: "check", q: "Em hãy cho biết, tùy chọn nào sau đây là ví dụ về công cụ tìm kiếm? (Chọn 2)", opts: [{v: "a", t: "Safari"}, {v: "b", t: "Bing"}, {v: "c", t: "Google"}, {v: "d", t: "Firefox"}], ans: ["b", "c"], explain: "Bing và Google là công cụ tìm kiếm. Safari và Firefox là trình duyệt web." }
    ];

    function renderQuiz() {
        const form = document.getElementById('quiz-form');
        let html = '';
        questions.forEach((q, index) => {
            let label = q.id < 10 ? '0' + q.id : q.id;
            html += `<div class="question-card" id="card-${index}"><div class="topic-col">Câu ${label}</div><div class="content-col"><div class="question-text">${q.q}</div>`;
            
            if (q.type === 'radio') {
                html += `<div class="options">`; q.opts.forEach(opt => { html += `<label><input type="radio" name="q${index}" value="${opt.v}"> ${opt.t}</label>`; }); html += `</div>`;
            } else if (q.type === 'check') {
                html += `<div class="options">`; q.opts.forEach(opt => { html += `<label><input type="checkbox" name="q${index}" value="${opt.v}"> ${opt.t}</label>`; }); html += `</div>`;
            } else if (q.type === 'match') {
                html += `<div class="table-container"><table class="data-table"><thead><tr><th>Nội dung / Câu hỏi</th><th>Lựa chọn</th></tr></thead><tbody>`;
                q.rows.forEach((r, rIdx) => { 
                    html += `<tr><td>${r.t}</td><td><select name="q${index}_${rIdx}" style="width:100%"><option value="">-- Chọn --</option>`;
                    q.opts.forEach(opt => { html += `<option value="${opt.v}">${opt.t}</option>`; });
                    html += `</select></td></tr>`;
                });
                html += `</tbody></table></div>`;
            } else if (q.type === 'fill_blank') {
                // RENDER CHO CÂU HỎI ĐIỀN KHUYẾT (CHỦ ĐỀ 29)
                html += `<div style="background: #fff8e1; padding: 15px; border-radius: 8px;">`;
                q.rows.forEach((r, rIdx) => {
                    let selectHtml = `<select name="q${index}_${rIdx}" class="inline-select"><option value="">-- Chọn --</option>`;
                    q.opts.forEach(opt => { selectHtml += `<option value="${opt.v}">${opt.t}</option>`; });
                    selectHtml += `</select>`;
                    let displayText = r.t.replace("............", selectHtml);
                    html += `<div class="fill-blank-row">${displayText}</div>`;
                });
                html += `</div>`;
            } else if (q.type === 'table_tf') {
                html += `<div class="table-container"><table class="data-table"><thead><tr><th>Nội dung</th><th>${q.headers[0]}</th><th>${q.headers[1]}</th></tr></thead><tbody>`;
                q.rows.forEach((r, rIdx) => { html += `<tr><td>${r.t}</td><td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="yes"></td><td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="no"></td></tr>`; });
                html += `</tbody></table></div>`;
            }
            html += `<div class="feedback"><strong>Giải thích:</strong> ${q.explain}</div></div></div>`;
        });
        form.innerHTML = html;
    }

    function gradeQuiz() {
        let score = 0; let allAnswered = true; let firstUnanswered = null;
        document.querySelectorAll('.question-card').forEach(c => c.classList.remove('incomplete'));
        document.querySelectorAll('.feedback').forEach(f => f.style.display = 'none');
        document.querySelectorAll('.correct-opt, .wrong-opt').forEach(el => { el.classList.remove('correct-opt', 'wrong-opt'); el.style.backgroundColor = ''; el.style.borderColor = ''; el.style.border = ''; });
        
        questions.forEach((q, index) => {
            let answered = false;
            if (q.type === 'radio') { if (document.querySelector(`input[name="q${index}"]:checked`)) answered = true; }
            else if (q.type === 'check') { if (document.querySelector(`input[name="q${index}"]:checked`)) answered = true; }
            else if (q.type === 'match' || q.type === 'fill_blank') { 
                let subCount = 0;
                q.rows.forEach((r, rIdx) => { if (document.getElementsByName(`q${index}_${rIdx}`)[0].value !== "") subCount++; });
                if (subCount === q.rows.length) answered = true;
            }
            else if (q.type === 'table_tf') { let subCount = 0; q.rows.forEach((r, rIdx) => { if (document.querySelector(`input[name="q${index}_${rIdx}"]:checked`)) subCount++; }); if (subCount === q.rows.length) answered = true; }
            if (!answered) { allAnswered = false; let card = document.getElementById(`card-${index}`); card.classList.add('incomplete'); if (!firstUnanswered) firstUnanswered = card; }
        });

        if (!allAnswered) { alert("Vui lòng hoàn thành tất cả các câu hỏi trước khi nộp bài!"); firstUnanswered.scrollIntoView({ behavior: "smooth", block: "center" }); return; }

        questions.forEach((q, index) => {
            let isCorrect = false;
            if (q.type === 'radio') {
                let checked = document.querySelector(`input[name="q${index}"]:checked`);
                if (checked.value === q.ans) { isCorrect = true; checked.parentElement.classList.add('correct-opt'); }
                else { checked.parentElement.classList.add('wrong-opt'); let correctInput = document.querySelector(`input[name="q${index}"][value="${q.ans}"]`); if(correctInput) correctInput.parentElement.style.border = "2px dashed #28a745"; }
            } else if (q.type === 'check') {
                let checked = Array.from(document.querySelectorAll(`input[name="q${index}"]:checked`)).map(e => e.value);
                if (JSON.stringify(checked.sort()) === JSON.stringify(q.ans.sort())) isCorrect = true;
                document.querySelectorAll(`input[name="q${index}"]`).forEach(inp => { if (q.ans.includes(inp.value)) inp.parentElement.classList.add('correct-opt'); if (inp.checked && !q.ans.includes(inp.value)) inp.parentElement.classList.add('wrong-opt'); });
            } else if (q.type === 'match' || q.type === 'fill_blank') {
                let subCorrect = 0;
                q.rows.forEach((r, rIdx) => {
                    let sel = document.getElementsByName(`q${index}_${rIdx}`)[0];
                    if (sel.value === r.a) { subCorrect++; sel.style.borderColor = "#28a745"; sel.style.backgroundColor = "#d4edda"; }
                    else { sel.style.borderColor = "#dc3545"; sel.style.backgroundColor = "#f8d7da"; }
                });
                if (subCorrect === q.rows.length) isCorrect = true;
            } else if (q.type === 'table_tf') {
                let subCorrect = 0;
                q.rows.forEach((r, rIdx) => {
                    let checked = document.querySelector(`input[name="q${index}_${rIdx}"]:checked`);
                    let rightVal = r.a;
                    if (checked.value === rightVal) { subCorrect++; checked.parentElement.style.backgroundColor = "#d4edda"; }
                    else { checked.parentElement.style.backgroundColor = "#f8d7da"; let correctInput = document.querySelector(`input[name="q${index}_${rIdx}"][value="${rightVal}"]`); if (correctInput) correctInput.parentElement.style.border = "2px dashed #28a745"; }
                });
                if (subCorrect === q.rows.length) isCorrect = true;
            }
            if (isCorrect) score++;
            document.querySelector(`#card-${index} .feedback`).style.display = 'block';
        });

        let res = document.getElementById('result-area'); res.style.display = 'block';
        let percent = Math.round((score / questions.length) * 100);
        res.innerHTML = `KẾT QUẢ: ${score} / ${questions.length} CÂU ĐÚNG (${percent}%)`;
        res.style.color = percent >= 80 ? '#ef6c00' : '#dc3545'; res.style.borderColor = percent >= 80 ? '#ef6c00' : '#dc3545';
        document.querySelectorAll('input, select').forEach(el => el.disabled = true); window.scrollTo({top: 0, behavior: 'smooth'});
    }
    renderQuiz();
</script>
