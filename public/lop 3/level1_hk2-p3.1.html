<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lớp 3 - Level 1 | Kiến Thức Tổng Hợp - Phần 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Kanit:ital,wght@1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #28a745; /* Level 1 Green */
            --primary-dark: #1e7e34;
            --bg-light: #e8f5e9;
            --text-color: #333;
            --border-color: #dee2e6;
            --correct-bg: #d4edda;
            --wrong-bg: #f8d7da;
        }

        body { font-family: 'Roboto', sans-serif; background-color: #f4f6f9; color: var(--text-color); margin: 0; padding: 0; }
        
        /* HEADER */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 1000; border-bottom: 4px solid #fff;
        }
        .header-left { display: flex; flex-direction: column; align-items: flex-start; }
        .logo-ic3 { font-family: 'Kanit', sans-serif; font-size: 2rem; font-weight: 800; font-style: italic; line-height: 1; }
        .logo-ic3 span:nth-child(1) { color: #fff; } 
        .logo-ic3 span:nth-child(2) { color: #d1e7dd; }
        .home-btn {
            margin-top: 8px; color: white; text-decoration: none; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.6);
            padding: 5px 15px; border-radius: 20px; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px;
        }
        .home-btn:hover { background: rgba(255,255,255,0.2); }
        .header-right { text-align: right; }
        .teacher-name { font-weight: 700; font-size: 1.1rem; display: block; }
        .sub-title { font-size: 0.9rem; opacity: 0.9; }

        /* CONTAINER */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .page-title { text-align: center; margin-bottom: 40px; }
        .page-title h1 { color: var(--primary-dark); margin: 0; font-size: 2rem; text-transform: uppercase; }
        .page-title h2 { color: #555; margin: 10px 0 0; font-size: 1.3rem; font-weight: normal; }

        /* QUESTION CARD */
        .question-card {
            background: white; border: 1px solid var(--border-color); border-radius: 10px; 
            margin-bottom: 30px; overflow: hidden; display: flex; flex-wrap: wrap;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
        }
        .question-card.incomplete { border: 2px solid #dc3545; box-shadow: 0 0 10px rgba(220, 53, 69, 0.2); }

        .topic-col {
            background-color: var(--primary-color); width: 140px; padding: 20px;
            display: flex; align-items: center; justify-content: center; text-align: center;
            font-weight: 700; color: white; flex-shrink: 0; font-size: 1rem; border-right: 1px solid #fff;
        }
        .content-col { flex-grow: 1; padding: 25px; width: calc(100% - 140px); background: #fff; }

        .question-text { font-weight: 700; font-size: 1.1rem; margin-bottom: 20px; color: #2c3e50; }

        /* OPTIONS */
        .options label {
            display: block; margin-bottom: 10px; cursor: pointer; padding: 12px 15px;
            border: 2px solid #f1f1f1; border-radius: 8px; transition: 0.2s; position: relative;
        }
        .options label:hover { background-color: var(--bg-light); border-color: var(--primary-color); }
        .options input { margin-right: 12px; transform: scale(1.3); vertical-align: middle; accent-color: var(--primary-color); }

        /* IMAGE GRID */
        .img-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .img-item { border: 2px solid #eee; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .img-item:hover { border-color: var(--primary-color); background: var(--bg-light); }
        .img-item img { max-width: 100%; height: 120px; object-fit: contain; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto; }
        .img-item input { transform: scale(1.3); accent-color: var(--primary-color); margin: 0; cursor: pointer; }
        
        /* SINGLE IMAGE */
        .single-img { display: block; max-width: 100%; max-height: 300px; margin: 0 auto 20px auto; border-radius: 8px; border: 1px solid #ddd; }

        /* TABLES */
        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); }
        .data-table { width: 100%; border-collapse: collapse; margin: 0; }
        .data-table th {
            background-color: var(--primary-color); color: white; padding: 15px; 
            text-align: center; font-weight: 700; border-bottom: 2px solid #fff;
        }
        .data-table td { border-bottom: 1px solid var(--border-color); padding: 15px; vertical-align: middle; }
        .data-table tr:nth-child(even) { background-color: #fcfcfc; }
        .data-table tr:last-child td { border-bottom: none; }
        
        .data-table td:first-child { width: 60%; font-weight: 500; }
        .data-table td:not(:first-child) { width: 20%; text-align: center; }

        .data-table select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; 
            background: white; font-size: 0.95rem; cursor: pointer;
        }
        .data-table input[type="radio"] { transform: scale(1.5); cursor: pointer; accent-color: var(--primary-color); }

        /* FEEDBACK */
        .feedback { 
            margin-top: 20px; padding: 15px; background-color: #fff3cd; 
            border-left: 5px solid #ffc107; border-radius: 4px; 
            font-size: 0.95rem; color: #856404; display: none; line-height: 1.5;
        }
        .correct-opt { background-color: var(--correct-bg) !important; border-color: #28a745 !important; }
        .wrong-opt { background-color: var(--wrong-bg) !important; border-color: #dc3545 !important; }
        
        .correction { 
            display: block; margin-top: 8px; font-size: 0.9rem; font-weight: bold; 
            color: #dc3545; background: rgba(255,255,255,0.9); padding: 5px; border-radius: 4px; border: 1px dashed #dc3545;
        }

        .btn-submit {
            display: block; width: 250px; margin: 40px auto; padding: 18px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white; border: none; border-radius: 50px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4); transition: 0.3s;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(40, 167, 69, 0.6); }

        #result-area {
            text-align: center; font-size: 1.6rem; font-weight: bold; margin-top: 30px;
            padding: 30px; display: none; background: white; border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 2px solid var(--primary-color);
        }

        footer { background: var(--primary-color); color: white; padding: 40px 20px; text-align: center; margin-top: 80px; }
        .footer-info { margin-top: 15px; font-size: 0.95rem; opacity: 0.9; }

        @media (max-width: 768px) {
            .question-card { flex-direction: column; }
            .topic-col { width: 100%; padding: 10px; justify-content: flex-start; border-right: none; border-bottom: 4px solid #1e7e34; }
            .content-col { width: 100%; padding: 15px; }
            .data-table td:first-child { width: 50%; }
            .data-table td:not(:first-child) { width: 25%; }
        }
    </style>
</head>

    function renderQuiz() {
        const form = document.getElementById('quiz-form');
        let html = '';
        questions.forEach((q, index) => {
            html += `<div class="question-card" id="card-${index}">
                <div class="topic-col">Chủ đề ${q.id < 10 ? '0' + q.id : q.id}</div>
                <div class="content-col">
                    <div class="question-text">${q.q}</div>`;
            
            if (q.img && q.type !== 'img_radio' && q.type !== 'img_check') {
                html += `<img src="${q.img}" class="single-img" alt="Minh họa">`;
            }

            if (q.type === 'radio') {
                html += `<div class="options">`;
                q.opts.forEach(opt => {
                    html += `<label><input type="radio" name="q${index}" value="${opt.v}"> ${opt.t}</label>`;
                });
                html += `</div>`;
            } else if (q.type === 'check') {
                html += `<div class="options">`;
                q.opts.forEach(opt => {
                    html += `<label><input type="checkbox" name="q${index}" value="${opt.v}"> ${opt.t}</label>`;
                });
                html += `</div>`;
            } else if (q.type === 'img_radio') {
                html += `<div class="img-grid">`;
                q.opts.forEach(opt => {
                    html += `<label class="img-item">
                        <img src="${opt.img}" alt="${opt.t}">
                        <input type="radio" name="q${index}" value="${opt.v}">
                    </label>`;
                });
                html += `</div>`;
            } else if (q.type === 'img_check') {
                html += `<div class="img-grid">`;
                q.opts.forEach(opt => {
                    html += `<label class="img-item">
                        <img src="${opt.img}" alt="${opt.t}">
                        <input type="checkbox" name="q${index}" value="${opt.v}">
                    </label>`;
                });
                html += `</div>`;
            } else if (q.type === 'match') {
                html += `<div class="table-container"><table class="data-table"><thead><tr><th>Định nghĩa/Mô tả</th><th>Thuật ngữ/Lựa chọn</th></tr></thead><tbody>`;
                q.rows.forEach((r, rIdx) => {
                    html += `<tr><td>${r.t}</td><td><select name="q${index}_${rIdx}"><option value="">-- Chọn --</option>`;
                    q.opts.forEach(opt => {
                        html += `<option value="${opt.v}">${opt.t}</option>`;
                    });
                    html += `</select></td></tr>`;
                });
                html += `</tbody></table></div>`;
            } else if (q.type === 'table_tf') {
                html += `<div class="table-container"><table class="data-table"><thead><tr><th>Nội dung</th><th>${q.headers[0]}</th><th>${q.headers[1]}</th></tr></thead><tbody>`;
                q.rows.forEach((r, rIdx) => {
                    html += `<tr><td>${r.t}</td>
                        <td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="${r.a === 'yes' ? 'yes' : 'no'}"></td>
                        <td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="${r.a === 'no' ? 'yes' : 'no'}"></td></tr>`;
                        /* Logic check: 
                           Nếu r.a là 'yes' (Đúng/Có), thì input cột 1 (value=yes) là đáp án đúng.
                           Nếu r.a là 'no' (Sai/Không), thì input cột 2 (value=yes) là đáp án đúng.
                           Ở đây ta set value của input để hàm gradeQuiz so sánh.
                           Cần cẩn thận: Hàm gradeQuiz check if checked.value === r.a
                           Nếu r.a = 'yes'. User chọn col 1. Input col 1 value phải là 'yes'.
                           Nếu r.a = 'no'. User chọn col 2. Input col 2 value phải là 'no'.
                        */
                });
                html += `</tbody></table></div>`;
            } else if (q.type === 'table') {
                html += `<div class="table-container"><table class="data-table"><thead><tr><th>Nội dung</th><th>${q.headers[0]}</th><th>${q.headers[1]}</th></tr></thead><tbody>`;
                q.rows.forEach((r, rIdx) => {
                    html += `<tr><td>${r.t}</td>
                        <td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="val1"></td>
                        <td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="val2"></td></tr>`;
                });
                html += `</tbody></table></div>`;
            }
            
            html += `<div class="feedback"><strong>Giải thích:</strong> ${q.explain}</div>
                </div>
            </div>`;
        });
        form.innerHTML = html; // Cập nhật lại logic render cho table_tf ở dưới để chính xác hơn
    }

    /* GHI ĐÈ LẠI HÀM RENDER ĐỂ SỬA LOGIC VALUE CỦA TABLE_TF CHO CHÍNH XÁC */
    function renderQuiz() {
        const form = document.getElementById('quiz-form');
        let html = '';
        questions.forEach((q, index) => {
            html += `<div class="question-card" id="card-${index}">
                <div class="topic-col">Chủ đề ${q.id < 10 ? '0' + q.id : q.id}</div>
                <div class="content-col">
                    <div class="question-text">${q.q}</div>`;
            
            if (q.img) {
                html += `<img src="${q.img}" class="single-img" alt="Minh họa">`;
            }

            if (q.type === 'radio') {
                html += `<div class="options">`;
                q.opts.forEach(opt => {
                    html += `<label><input type="radio" name="q${index}" value="${opt.v}"> ${opt.t}</label>`;
                });
                html += `</div>`;
            } else if (q.type === 'table_tf') {
                html += `<div class="table-container"><table class="data-table"><thead><tr><th>Nội dung</th><th>${q.headers[0]}</th><th>${q.headers[1]}</th></tr></thead><tbody>`;
                q.rows.forEach((r, rIdx) => {
                    // Cột 1 là 'yes', Cột 2 là 'no'. 
                    // Nếu đáp án r.a là 'yes', chọn cột 1 sẽ đúng.
                    html += `<tr><td>${r.t}</td>
                        <td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="yes"></td>
                        <td class="cell-center"><input type="radio" name="q${index}_${rIdx}" value="no"></td></tr>`;
                });
                html += `</tbody></table></div>`;
            }
            
            html += `<div class="feedback"><strong>Giải thích:</strong> ${q.explain}</div>
                </div>
            </div>`;
        });
        form.innerHTML = html;
    }

    function gradeQuiz() {
        let score = 0;
        let allAnswered = true;
        let firstUnanswered = null;

        document.querySelectorAll('.question-card').forEach(c => c.classList.remove('incomplete'));
        document.querySelectorAll('.feedback').forEach(f => f.style.display = 'none');
        document.querySelectorAll('.correct-opt, .wrong-opt').forEach(el => {
            el.classList.remove('correct-opt', 'wrong-opt');
            el.style.backgroundColor = ''; el.style.borderColor = ''; el.style.border = '';
        });
        document.querySelectorAll('.correction').forEach(el => el.remove());

        questions.forEach((q, index) => {
            let answered = false;
            if (q.type === 'radio') {
                if (document.querySelector(`input[name="q${index}"]:checked`)) answered = true;
            } else if (q.type === 'table_tf') {
                let subCount = 0;
                q.rows.forEach((r, rIdx) => { if (document.querySelector(`input[name="q${index}_${rIdx}"]:checked`)) subCount++; });
                if (subCount === q.rows.length) answered = true;
            }

            if (!answered) {
                allAnswered = false;
                let card = document.getElementById(`card-${index}`);
                card.classList.add('incomplete');
                if (!firstUnanswered) firstUnanswered = card;
            }
        });

        if (!allAnswered) {
            alert("Vui lòng hoàn thành tất cả các câu hỏi trước khi nộp bài!");
            firstUnanswered.scrollIntoView({ behavior: "smooth", block: "center" });
            return;
        }

        questions.forEach((q, index) => {
            let isCorrect = false;
            if (q.type === 'radio') {
                let checked = document.querySelector(`input[name="q${index}"]:checked`);
                if (checked.value === q.ans) {
                    isCorrect = true;
                    checked.parentElement.classList.add('correct-opt');
                } else {
                    checked.parentElement.classList.add('wrong-opt');
                    let correctInput = document.querySelector(`input[name="q${index}"][value="${q.ans}"]`);
                    if(correctInput) correctInput.parentElement.style.border = "2px dashed #28a745";
                }
            } else if (q.type === 'table_tf') {
                let subCorrect = 0;
                q.rows.forEach((r, rIdx) => {
                    let checked = document.querySelector(`input[name="q${index}_${rIdx}"]:checked`);
                    let rightVal = r.a; // 'yes' or 'no'
                    
                    if (checked.value === rightVal) {
                        subCorrect++;
                        checked.parentElement.style.backgroundColor = "#d4edda";
                    } else {
                        checked.parentElement.style.backgroundColor = "#f8d7da";
                        let correctInput = document.querySelector(`input[name="q${index}_${rIdx}"][value="${rightVal}"]`);
                        if (correctInput) correctInput.parentElement.style.border = "2px dashed #28a745";
                    }
                });
                if (subCorrect === q.rows.length) isCorrect = true;
            }

            if (isCorrect) score++;
            document.querySelector(`#card-${index} .feedback`).style.display = 'block';
        });

        let res = document.getElementById('result-area');
        res.style.display = 'block';
        let percent = Math.round((score / questions.length) * 100);
        res.innerHTML = `KẾT QUẢ: ${score} / ${questions.length} CÂU ĐÚNG (${percent}%)`;
        res.style.color = percent >= 80 ? '#28a745' : '#dc3545';
        res.style.borderColor = percent >= 80 ? '#28a745' : '#dc3545';

        document.querySelectorAll('input, select').forEach(el => el.disabled = true);
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    renderQuiz();
</script>
